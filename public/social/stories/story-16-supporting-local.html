<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 16 · Supporting local candidates. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s16 { position:absolute; inset:0; z-index:5; background:#5A7060; overflow:hidden; }
  .s16-bg { position:absolute; z-index:1; inset:0;
    background:
      radial-gradient(70% 45% at 15% 12%, rgba(46,69,56,.5), transparent 60%),
      radial-gradient(80% 50% at 90% 90%, rgba(20,32,25,.55), transparent 60%),
      linear-gradient(180deg, #5A7060 0%, #2e4538 100%);
  }
  .s16-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s16-mast img { height:56px; width:auto; }
  .s16-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s16-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* 3-column growth story - each a step */
  .s16-steps { position:absolute; z-index:10; left:96px; right:96px; top:340px; display:flex; flex-direction:column; gap:52px; }
  .s16-step { display:grid; grid-template-columns:120px 1fr auto; align-items:baseline; gap:36px; padding-bottom:44px; border-bottom:1px solid rgba(224,214,188,.22); }
  .s16-step:last-child { border-bottom:none; }
  .s16-step .n { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:130px; line-height:.8; color:rgba(224,214,188,.35); }
  .s16-step .txt { font-family:var(--font-display); font-weight:500; font-size:78px; line-height:.98; letter-spacing:-.025em; color:#f6f2e8; }
  .s16-step .txt em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s16-step .icn { font-family:var(--font-mono); font-size:14px; letter-spacing:.4em; color:rgba(224,214,188,.55); }

  /* Photo strip at bottom */
  .s16-photo { position:absolute; z-index:6; left:0; right:0; bottom:280px; height:240px; overflow:hidden; }
  .s16-photo img { width:100%; height:100%; object-fit:cover; object-position:center 50%; filter:saturate(.7) contrast(1.1) brightness(.6); }
  .s16-photo::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(46,69,56,.4), rgba(20,32,25,.6)); }
  .s16-photo::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:rgba(224,214,188,.4); z-index:2; }

  .s16-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:32px; border-top:1px solid rgba(224,214,188,.2); }
  .s16-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.7); }
</style>
</head>
<body>
  <div class="canvas story s-forest">
    <div class="s16">
      <div class="s16-bg"></div>

      <div class="s16-mast"><img src="../assets/nwop-logo-light.png" alt="" /></div>

      <div class="s16-steps">
        <div class="s16-step">
          <span class="txt">Supporting local <em>candidates.</em></span>
        </div>
        <div class="s16-step">
          <span class="txt">Building stronger <em>campaigns.</em></span>
        </div>
        <div class="s16-step">
          <span class="txt">Growing stronger <em>communities.</em></span>
        </div>
      </div>

      <div class="s16-photo"><img src="../assets/img/community.jpg" alt="" /></div>

      <div class="s16-foot">
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
