<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 14 · Every town deserves a voice. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s14 { position:absolute; inset:0; z-index:5; background:#f6f2e8; overflow:hidden; }
  .s14-bg { position:absolute; z-index:1; inset:0;
    background:linear-gradient(180deg, #f6f2e8 0%, #ede5c9 100%);
  }
  /* Diagonal split - upper diagonal photo band */
  .s14-diag { position:absolute; z-index:2; left:-100px; right:-100px; top:280px; height:680px; overflow:hidden;
    transform:rotate(-6deg); transform-origin:center;
  }
  .s14-diag img { width:100%; height:120%; object-fit:cover; object-position:center 55%; filter:saturate(.85) contrast(1.05); }
  .s14-diag::after { content:''; position:absolute; inset:0; background: linear-gradient(180deg, rgba(46,69,56,.2), rgba(107,90,66,.15)); }
  .s14-diag::before { content:''; position:absolute; left:0; right:0; top:0; bottom:0; box-shadow: inset 0 0 90px rgba(46,42,20,.35); }

  .s14-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s14-mast img { height:56px; width:auto; }
  .s14-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,42,20,.7); display:flex; align-items:center; gap:18px; }
  .s14-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* City chips */
  .s14-chips { position:absolute; z-index:8; left:96px; top:1010px; right:96px; display:flex; flex-wrap:wrap; gap:12px; }
  .s14-chip { padding:8px 18px; border:1px solid rgba(46,42,20,.35); font-family:var(--font-mono); font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:rgba(46,42,20,.7); background:rgba(255,255,255,.4); }

  /* Editorial two-line stack */
  .s14-body { position:absolute; z-index:10; left:96px; right:96px; top:1160px; }
  .s14-cap { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:#5A7060; display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .s14-cap .bar { width:50px; height:1px; background:currentColor; }
  .s14-h { font-family:var(--font-display); font-weight:500; font-size:110px; line-height:.98; letter-spacing:-.028em; color:#2e4538; }
  .s14-h em { font-style:italic; font-weight:400; color:#5A7060; }
  .s14-rule { width:120px; height:2px; background:#2e4538; margin:44px 0 32px; }
  .s14-sub { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:64px; line-height:1.06; letter-spacing:-.015em; color:#6B5A42; }

  .s14-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; }
  .s14-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.55); }
</style>
</head>
<body>
  <div class="canvas story s-sand on-photo">
    <div class="s14">
      <div class="s14-bg"></div>
      <div class="s14-diag"><img src="../assets/img/hero.jpg" alt="" /></div>

      <div class="s14-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="s14-kick"><span class="bar"></span>Every Town</div>

      <div class="s14-chips" aria-hidden="true">
        <span class="s14-chip">Astoria</span>
        <span class="s14-chip">Tillamook</span>
        <span class="s14-chip">Seaside</span>
        <span class="s14-chip">Beaverton</span>
        <span class="s14-chip">Hillsboro</span>
        <span class="s14-chip">St. Helens</span>
        <span class="s14-chip">Forest Grove</span>
        <span class="s14-chip">Scappoose</span>
      </div>

      <div class="s14-body">
        <div class="s14-cap"><span class="bar"></span>A Regional Belief</div>
        <h1 class="s14-h">We believe every <em>town</em> deserves a voice.</h1>
        <div class="s14-rule"></div>
        <p class="s14-sub">Not just the biggest ones.</p>
      </div>

      <div class="s14-foot">
        <span class="txt">NWOP · Every Community</span>
        <span class="txt">Vol. XIV · 2026</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
