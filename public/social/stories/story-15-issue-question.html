<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 15 · What issue matters most in your community? — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s15 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Photo backdrop, deep grade */
  .s15-bg { position:absolute; z-index:1; inset:0; }
  .s15-bg img { width:100%; height:100%; object-fit:cover; object-position:center 50%; filter:saturate(.5) contrast(1.32) brightness(.32) blur(1px); }
  /* Cinematic 3-layer wash */
  .s15-wash { position:absolute; z-index:2; inset:0;
    background:
      radial-gradient(60% 40% at 50% 22%, rgba(90,112,96,.45) 0%, transparent 70%),
      radial-gradient(90% 70% at 50% 100%, rgba(20,30,22,.9) 0%, transparent 60%),
      linear-gradient(180deg, rgba(31,47,38,.65) 0%, rgba(20,30,22,.3) 45%, rgba(6,10,7,.98) 100%);
  }
  /* Faint scanlines */
  .s15-scan { position:absolute; z-index:3; inset:0; pointer-events:none; opacity:.08;
    background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(0,0,0,.5) 4px 5px);
    mix-blend-mode:multiply;
  }
  /* Registration marks in corners */
  .s15-mark { position:absolute; z-index:8; width:22px; height:22px; }
  .s15-mark::before, .s15-mark::after { content:''; position:absolute; background:rgba(224,214,188,.55); }
  .s15-mark::before { left:10px; top:0; width:2px; height:22px; }
  .s15-mark::after  { top:10px; left:0; width:22px; height:2px; }
  .s15-mark.tl { top:96px; left:72px; }
  .s15-mark.tr { top:96px; right:72px; }
  .s15-mark.bl { bottom:96px; left:72px; }
  .s15-mark.br { bottom:96px; right:72px; }
  /* Mast */
  .s15-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s15-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.7)); }
  /* Star cluster upper right */
  .s15-stars { position:absolute; z-index:8; top:150px; right:120px; display:grid; grid-template-columns:repeat(3,10px); gap:12px; opacity:.7; }
  /* Vertical brand rule (right spine) */
  .s15-spine { position:absolute; z-index:6; right:48px; top:220px; bottom:220px; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.4) 20%, rgba(224,214,188,.4) 80%, rgba(224,214,188,0)); }
  /* Top kicker mono label */
  .s15-kicker { position:absolute; z-index:10; left:96px; top:340px; display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:20px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); }
  .s15-kicker .bar { width:64px; height:1px; background:currentColor; opacity:.7; }
  /* Big italic quote glyph in background */
  .s15-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:1200px; line-height:.68; color:rgba(224,214,188,.045); right:-260px; top:200px; pointer-events:none; }
  /* Main question — top-center huge */
  .s15-q { position:absolute; z-index:10; left:96px; right:96px; top:460px;
    font-family:var(--font-display); font-weight:500; font-size:132px; line-height:.98; letter-spacing:-.03em;
    color:#f6f2e8; text-shadow: 0 8px 40px rgba(0,0,0,.65);
  }
  .s15-q em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Diagonal accent line */
  .s15-diag { position:absolute; z-index:6; left:96px; top:1020px; right:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.55) 0%, transparent 50%); }
  /* Center CTA — as a premium form field mock */
  .s15-mid { position:absolute; z-index:10; left:96px; right:96px; top:1130px; display:flex; flex-direction:column; gap:26px; }
  .s15-mid .lbl { font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); }
  .s15-mid .field { padding:44px 56px; background:rgba(224,214,188,.06); border:1.5px solid rgba(224,214,188,.4); border-radius:16px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:66px; letter-spacing:-.015em; color:rgba(246,242,232,.85);
    display:flex; align-items:center; gap:24px;
    box-shadow: inset 0 0 40px rgba(0,0,0,.35), 0 40px 60px -30px rgba(0,0,0,.7);
  }
  .s15-mid .field .cursor { display:inline-block; width:3px; height:60px; background:rgba(224,214,188,.7); margin-left:6px; animation: none; }
  /* Bottom badge grid */
  .s15-bottom { position:absolute; z-index:10; left:96px; right:96px; bottom:160px; display:flex; align-items:center; justify-content:space-between; }
  .s15-bottom .left { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .s15-bottom .left .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .s15-bottom .swipe { display:flex; align-items:center; gap:14px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:40px; color:#e0d6bc; letter-spacing:-.02em; }
  .s15-bottom .swipe svg { display:block; }
  /* Ghost giant numeral */
  .s15-num { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:1300px; line-height:.7; color:rgba(224,214,188,.05); left:-120px; bottom:-360px; pointer-events:none; }
</style>
</head>
<body>
  <div class="canvas story s-ink on-photo">
    <div class="s15">
      <div class="s15-bg"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="s15-wash"></div>
      <div class="s15-scan"></div>

      <span class="s15-mark tl"></span>
      <span class="s15-mark tr"></span>
      <span class="s15-mark bl"></span>
      <span class="s15-mark br"></span>

      <div class="s15-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="s15-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="s15-spine"></div>

      <div class="s15-kicker"><span class="bar"></span></div>

      <h1 class="s15-q">What issue matters most in your <em>community?</em></h1>

      <div class="s15-diag"></div>

      <div class="s15-mid">
        <div class="field">Tell us below<span class="cursor"></span></div>
      </div>

      <div class="s15-bottom">
        <div class="left"><span class="bar"></span></div>
        <div class="swipe" aria-hidden="true">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#e0d6bc" stroke-width="1.6"><path d="M12 19V5"/><path d="M6 11l6-6 6 6"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
