<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>You don't have to run for office to make a difference — Northwest Oregon PAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1920px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1920px;overflow:hidden;background:rgba(42,42,38,1);
    font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;background:rgba(42,42,38,1);"></div>
<img src="../posts/img/node-2_2223.png" alt="" style="position:absolute;left:0px;top:-662px;width:1080px;height:1920px;object-fit:cover;">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:430px;background:linear-gradient(180deg, rgba(42,42,38,0.85) 0%, rgba(42,42,38,0) 100%);"></div>
<div style="position:absolute;left:0px;top:864px;width:1080px;height:1056px;background:rgba(78,96,81,1);"></div>
<div style="position:absolute;left:0px;top:860px;width:1080px;height:4px;background:rgba(224,214,188,1);"></div>
<img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:100px;width:162px;height:48px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:958px;width:805px;height:300px;display:flex;flex-direction:column;justify-content:flex-start;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:92px;font-weight:700;color:rgba(241,238,228,1);letter-spacing:0px;line-height:100px;text-align:left;white-space:pre-wrap;font-style:normal;text-transform:none;margin:0">You don't have to run for office to <span style="color:rgba(224,214,188,1);">make a difference.</span></p></div>
<div style="position:absolute;left:88px;top:1480px;width:731px;height:58px;display:flex;flex-direction:column;justify-content:flex-start;overflow:visible;"><p style="font-family:'Source Sans 3', system-ui, sans-serif;font-size:44px;font-weight:400;color:rgba(241,238,228,1);letter-spacing:0px;line-height:58px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">You simply have to support our mission.</p></div>
</div></div>
<script>(function(){var W=1080,H=1920,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
</body>
</html>
