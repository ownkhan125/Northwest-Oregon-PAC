<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 19 · Would you consider supporting a local candidate? — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s19 { position:absolute; inset:0; z-index:5; background:#e0d6bc; overflow:hidden; }
  .s19-photo { position:absolute; z-index:1; inset:0; }
  .s19-photo img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(.7) contrast(1.05) brightness(1.02); mix-blend-mode:multiply; opacity:.5; }
  .s19-photo::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(75% 45% at 50% 30%, rgba(224,214,188,.25), transparent 60%),
      linear-gradient(180deg, rgba(224,214,188,.4) 0%, rgba(224,214,188,.9) 60%, #e0d6bc 100%);
  }

  .s19-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s19-mast img { height:56px; width:auto; }
  .s19-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,42,20,.7); display:flex; align-items:center; gap:18px; }
  .s19-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Corner registration marks */
  .s19-mark { position:absolute; z-index:8; width:22px; height:22px; }
  .s19-mark::before, .s19-mark::after { content:''; position:absolute; background:rgba(46,42,20,.55); }
  .s19-mark::before { left:10px; top:0; width:2px; height:22px; }
  .s19-mark::after  { top:10px; left:0; width:22px; height:2px; }
  .s19-mark.tl { top:280px; left:72px; }
  .s19-mark.tr { top:280px; right:72px; }
  .s19-mark.bl { bottom:280px; left:72px; }
  .s19-mark.br { bottom:280px; right:72px; }

  .s19-label { position:absolute; z-index:10; left:96px; top:400px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:#5A7060; display:flex; align-items:center; gap:16px; }
  .s19-label .bar { width:56px; height:1px; background:currentColor; }

  .s19-q { position:absolute; z-index:10; left:96px; right:96px; top:500px;
    font-family:var(--font-display); font-weight:500; font-size:118px; line-height:.98; letter-spacing:-.028em; color:#2e4538;
  }
  .s19-q em { font-style:italic; font-weight:400; color:#6B5A42; }

  /* Poll options - pill style */
  .s19-options { position:absolute; z-index:10; left:96px; right:96px; top:1180px; display:flex; flex-direction:column; gap:28px; }
  .s19-opt { padding:38px 48px; border-radius:100px; display:flex; align-items:center; gap:24px; justify-content:space-between;
    font-family:var(--font-display); font-weight:500; font-size:60px; letter-spacing:-.02em;
    box-shadow: 0 20px 40px -20px rgba(46,42,20,.35);
  }
  .s19-opt .left { display:flex; align-items:center; gap:20px; }
  .s19-opt .dash { font-family:var(--font-mono); font-size:32px; opacity:.7; }
  .s19-opt.filled { background:#2e4538; color:#f6f2e8; }
  .s19-opt.outlined { background:transparent; border:1.5px solid #2e4538; color:#2e4538; }
  .s19-opt .pct { font-family:var(--font-mono); font-size:20px; letter-spacing:.4em; opacity:.55; }

  .s19-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; }
  .s19-foot .tap { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:34px; color:#2e4538; }
  .s19-foot .seal { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.55); }
</style>
</head>
<body>
  <div class="canvas story s-sand on-photo">
    <div class="s19">
      <div class="s19-photo"><img src="../assets/img/campaign.jpg" alt="" /></div>

      <span class="s19-mark tl"></span>
      <span class="s19-mark tr"></span>
      <span class="s19-mark bl"></span>
      <span class="s19-mark br"></span>

      <div class="s19-mast"><img src="../assets/nwop-logo-dark.png" alt="" /></div>

      <h1 class="s19-q">Would you consider <em>supporting</em> a local candidate?</h1>

      <div class="s19-options">
        <div class="s19-opt filled">
          <span class="left"><span class="dash">-</span>YES</span>
        </div>
        <div class="s19-opt outlined">
          <span class="left"><span class="dash">-</span>Tell me more</span>
        </div>
      </div>

      <div class="s19-foot">
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
