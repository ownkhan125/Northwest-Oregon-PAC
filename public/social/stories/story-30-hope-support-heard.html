<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />

<style>
  .s30 { position:absolute; inset:0; z-index:5; background:#2e4538; overflow:hidden; }
  .s30-photo { position:absolute; z-index:1; inset:0; opacity:.4; }
  .s30-photo img { width:100%; height:100%; object-fit:cover; object-position:center 55%; filter:saturate(.5) contrast(1.2) brightness(.6); }
  .s30-wash { position:absolute; z-index:2; inset:0;
    background:
      radial-gradient(70% 45% at 50% 25%, rgba(90,112,96,.4), transparent 65%),
      radial-gradient(90% 50% at 50% 100%, rgba(20,32,25,.9), transparent 60%),
      linear-gradient(180deg, rgba(46,69,56,.65) 0%, rgba(20,32,25,.95) 100%);
  }

  /* Grid pattern */
  .s30-grid { position:absolute; z-index:3; inset:0; opacity:.06; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 90px 90px;
  }

  /* Corner brackets */
  .s30-brk { position:absolute; z-index:8; width:60px; height:60px; border:2px solid rgba(224,214,188,.55); }
  .s30-brk.tl { top:290px; left:72px; border-right:none; border-bottom:none; }
  .s30-brk.tr { top:290px; right:72px; border-left:none; border-bottom:none; }
  .s30-brk.bl { bottom:280px; left:72px; border-right:none; border-top:none; }
  .s30-brk.br { bottom:280px; right:72px; border-left:none; border-top:none; }

  .s30-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s30-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.55)); }
  .s30-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s30-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Custom SVG seal element */
  .s30-seal { position:absolute; z-index:8; top:400px; left:50%; transform:translateX(-50%); width:200px; height:200px; }
  .s30-seal svg { width:100%; height:100%; }

  /* Center manifesto */
  .s30-center { position:absolute; z-index:10; left:96px; right:96px; top:720px; text-align:center; }
  .s30-h { font-family:var(--font-display); font-weight:500; font-size:110px; line-height:1.0; letter-spacing:-.025em; color:#f6f2e8; text-shadow:0 6px 28px rgba(0,0,0,.5); }
  .s30-h em { font-style:italic; font-weight:400; color:#e0d6bc; }

  /* Values row - Hope · Support · Heard */
  .s30-values { position:absolute; z-index:10; left:96px; right:96px; top:1290px; text-align:center;
    padding:36px 0; border-top:1.5px solid rgba(224,214,188,.4); border-bottom:1.5px solid rgba(224,214,188,.4);
    font-family:var(--font-display); font-weight:500; font-size:80px; line-height:1.0; letter-spacing:-.02em; color:#f6f2e8;
  }
  .s30-values .dot { font-style:italic; color:#e0d6bc; margin:0 20px; }
  .s30-values em { font-style:italic; font-weight:400; color:#e0d6bc; }

  /* Follow · Donate action */
  .s30-action { position:absolute; z-index:10; left:96px; right:96px; top:1520px; text-align:center; }
  .s30-action .lbl { font-family:var(--font-mono); font-size:14px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.65); margin-bottom:26px; }
  .s30-action .row { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:64px; letter-spacing:-.015em; color:#e0d6bc; }
  .s30-action .row .dot { color:rgba(224,214,188,.65); margin:0 20px; font-style:italic; }

  .s30-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:24px; border-top:1px solid rgba(224,214,188,.22); }
  .s30-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.6); }
</style>

<body>
  <div class="canvas story s-forest on-photo">

      <div class="s30-grid"></div>

      <span class="s30-brk tl"></span>
      <span class="s30-brk tr"></span>

      <div class="s30-seal" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="94" fill="none" stroke="#e0d6bc" stroke-opacity=".55" stroke-width="1.5"/>
          <circle cx="100" cy="100" r="80" fill="none" stroke="#e0d6bc" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 5"/>
          <g fill="#e0d6bc">

            <path d="M145 128l3.3 7.7L157 137l-6.3 5.3 1.7 8.7L145 146.7 137.6 151l2-8.7L133 137l8.2-1L145 128z" opacity=".85"/>
          </g>
          <text x="100" y="115" text-anchor="middle" font-family="Source Sans 3" font-size="11" letter-spacing="3" fill="#e0d6bc" opacity=".85">NWOP</text>
          <text x="100" y="170" text-anchor="middle" font-family="Source Sans 3" font-size="7" letter-spacing="4" fill="#e0d6bc" opacity=".6">· 2026 ·</text>
        </svg>
      </div>

      <div class="s30-center">
        <h1 class="s30-h">Together, we're building a stronger <em>Northwest Oregon.</em></h1>
      </div>

      <div class="s30-values">Hope <span class="dot">·</span> Support <span class="dot">·</span> Heard</div>

      <div class="s30-action">
        <div class="lbl">Stay Connected</div>

      <div class="s30-foot">

        <span class="txt">Story XXX · 2026</span>

    </div>

  </div>
