<style>
  .s25 { position:absolute; inset:0; z-index:5; background:#e0d6bc; overflow:hidden; }
  .s25-bg { position:absolute; z-index:1; inset:0;
    background:linear-gradient(180deg, #e6dcc2 0%, #d0c4a2 100%);
  }

  /* Full-frame candidate portrait cutout upper */
  .s25-portrait-wrap { position:absolute; z-index:2; top:280px; left:0; right:0; height:1180px; overflow:hidden; }
  .s25-portrait-wrap img { width:100%; height:100%; object-fit:cover; object-position:center 20%; filter:saturate(.9) contrast(1.05); }

  }
  .s25-portrait-wrap::before { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:#2e4538; z-index:3; }

  /* Name plate — signature ID stamp over portrait bottom */
  .s25-name { position:absolute; z-index:10; left:96px; right:96px; top:1180px;
    display:flex; flex-direction:column; gap:14px;
  }
  .s25-quotename { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:180px; line-height:.92; letter-spacing:-.035em; color:#2e4538; text-shadow: 0 4px 24px rgba(255,255,255,.25); }

  /* Backed BY stamp */
  .s25-backed { position:absolute; z-index:10; left:96px; right:96px; top:1440px;
    padding-top:36px; border-top:2px solid #2e4538; display:flex; flex-direction:column; gap:14px;
  }
  .s25-backed .by { font-family:var(--font-mono); font-size:20px; letter-spacing:.55em; text-transform:uppercase; color:#6B5A42; display:flex; align-items:center; gap:16px; }
  .s25-backed .by .bar { width:52px; height:1px; background:currentColor; }
  .s25-backed .pac { font-family:var(--font-display); font-weight:600; font-size:88px; line-height:.98; letter-spacing:-.02em; color:#2e4538; text-transform:none; }

  .s25-tag { position:absolute; z-index:10; left:96px; right:96px; bottom:230px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:44px; line-height:1.14; letter-spacing:-.01em; color:#5A7060;
  }

  .s25-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:22px; border-top:1px solid rgba(46,42,20,.28); }
  .s25-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.55); }

  <div class="canvas story s-sand on-photo">
