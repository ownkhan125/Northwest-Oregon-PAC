<title>Story 17 · You don't have to run for office. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s17 { position:absolute; inset:0; z-index:5; background:#f6f2e8; overflow:hidden; }
  .s17-bg { position:absolute; z-index:1; inset:0;
    background:linear-gradient(180deg, #f6f2e8 0%, #ede5c9 100%);
  }
  /* Torn paper effect via clip-path */
  .s17-tear { position:absolute; z-index:2; left:0; right:0; top:900px; bottom:0;
    background:#2e4538;
    clip-path: polygon(0 4%, 6% 0, 14% 5%, 24% 1%, 34% 5%, 46% 2%, 56% 6%, 66% 1%, 76% 5%, 86% 2%, 94% 6%, 100% 3%, 100% 100%, 0 100%);
  }
  .s17-tear::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(70% 40% at 50% 10%, rgba(90,112,96,.35), transparent 60%),
      linear-gradient(180deg, transparent 0%, rgba(0,0,0,.25) 100%);
  }

  .s17-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s17-mast img { height:56px; width:auto; }
  .s17-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,42,20,.7); display:flex; align-items:center; gap:18px; }
  .s17-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Upper: what you DON'T need */
  .s17-top { position:absolute; z-index:8; left:96px; right:96px; top:340px; }
  .s17-lbl { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:#6B5A42; display:flex; align-items:center; gap:14px; margin-bottom:36px; }
  .s17-lbl .bar { width:52px; height:1px; background:currentColor; }
  .s17-h { font-family:var(--font-display); font-weight:500; font-size:118px; line-height:.98; letter-spacing:-.03em; color:#2e4538; }
  .s17-h em { font-style:italic; font-weight:400; color:#6B5A42; position:relative; }
  .s17-h em::after { content:''; position:absolute; left:-2%; right:-2%; top:52%; height:6px; background:#c9432c; opacity:.7; transform:rotate(-2deg); }

  /* Bottom: what you DO */
  .s17-bot { position:absolute; z-index:10; left:96px; right:96px; top:1120px; }
  .s17-lbl2 { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); display:flex; align-items:center; gap:14px; margin-bottom:34px; }
  .s17-lbl2 .bar { width:52px; height:1px; background:currentColor; }
  .s17-h2 { font-family:var(--font-display); font-weight:500; font-size:98px; line-height:1.0; letter-spacing:-.028em; color:#f6f2e8; }
  .s17-h2 em { font-style:italic; font-weight:400; color:#e0d6bc; }

  .s17-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:32px; border-top:1px solid rgba(224,214,188,.25); }
  .s17-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.65); }
</style>
</head>
<body>
  <div class="canvas story s-sand on-photo">
    <div class="s17">
      <div class="s17-bg"></div>
      <div class="s17-tear"></div>

      <div class="s17-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="s17-kick"><span class="bar"></span>Not Required</div>

      <div class="s17-top">
        <div class="s17-lbl"><span class="bar"></span>The Misconception</div>
        <h1 class="s17-h">You don't have to <em>run for office</em> to make a difference.</h1>
      </div>

      <div class="s17-bot">
        <div class="s17-lbl2"><span class="bar"></span>The Reality</div>
        <h2 class="s17-h2">You simply have to <em>support our mission.</em></h2>
      </div>

      <div class="s17-foot">
        <span class="txt">NWOP · Support the Mission</span>
        <span class="txt">Story XVII · 2026</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
