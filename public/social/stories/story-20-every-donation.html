<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 20 · Every donation helps build long-term political infrastructure. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s20 { position:absolute; inset:0; z-index:5; background:#f6f2e8; overflow:hidden; }
  .s20-bg { position:absolute; z-index:1; inset:0;
    background:linear-gradient(180deg, #f6f2e8 0%, #e8dfc4 100%);
  }
  /* Blueprint grid */
  .s20-grid { position:absolute; z-index:2; inset:0; opacity:.15; pointer-events:none;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 90px 90px;
  }

  .s20-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s20-mast img { height:56px; width:auto; }
  .s20-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,42,20,.7); display:flex; align-items:center; gap:18px; }
  .s20-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Architectural blueprint schema — centered vertically, generous frame */
  .s20-scheme { position:absolute; z-index:5; left:96px; right:96px; top:360px; bottom:280px;
    border:1.5px solid rgba(46,69,56,.45);
    padding:80px 72px;
    display:flex; flex-direction:column; justify-content:center;
  }
  .s20-scheme .corner { position:absolute; width:12px; height:12px; border:1.5px solid #2e4538; background:#f6f2e8; }
  .s20-scheme .corner.tl { top:-7px; left:-7px; }
  .s20-scheme .corner.tr { top:-7px; right:-7px; }
  .s20-scheme .corner.bl { bottom:-7px; left:-7px; }
  .s20-scheme .corner.br { bottom:-7px; right:-7px; }
  .s20-scheme .lbl { font-family:var(--font-mono); font-size:12px; letter-spacing:.44em; text-transform:uppercase; color:#5A7060; margin-bottom:22px; }
  .s20-scheme .title { font-family:var(--font-display); font-weight:500; font-size:82px; line-height:1.06; letter-spacing:-.024em; color:#2e4538; }
  .s20-scheme .title em { font-style:italic; font-weight:400; color:#6B5A42; }
  .s20-scheme .divider { display:flex; align-items:center; gap:12px; margin:32px 0; font-family:var(--font-mono); font-size:11px; letter-spacing:.5em; color:rgba(46,42,20,.5); }
  .s20-scheme .divider::before, .s20-scheme .divider::after { content:''; flex:1; height:1px; background:currentColor; }
  .s20-scheme .measure { display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:13px; letter-spacing:.4em; color:rgba(46,42,20,.55); text-transform:uppercase; }

  .s20-note { position:absolute; z-index:10; left:96px; right:96px; top:1200px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:64px; line-height:1.08; letter-spacing:-.02em; color:#5A7060;
  }

  .s20-tag { position:absolute; z-index:10; left:96px; top:1520px; right:96px; display:flex; flex-wrap:wrap; gap:14px; }
  .s20-tag span { padding:8px 20px; border:1px solid #2e4538; font-family:var(--font-mono); font-size:13px; letter-spacing:.4em; text-transform:uppercase; color:#2e4538; }

  .s20-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:32px; border-top:1px solid rgba(46,42,20,.28); }
  .s20-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.55); }
</style>
</head>
<body>
  <div class="canvas story s-sand">
    <div class="s20">
      <div class="s20-bg"></div>
      <div class="s20-grid"></div>

      <div class="s20-mast"><img src="../assets/nwop-logo-dark.png" alt="" /></div>

      <div class="s20-scheme">
        <span class="corner tl"></span>
        <span class="corner tr"></span>
        <span class="corner bl"></span>
        <span class="corner br"></span>

        <div class="title">Every donation helps <em>build</em> long-term political infrastructure across Northwest Oregon.</div>
      </div>

      <div class="s20-foot">
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
