<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1920px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1920px;overflow:hidden;background:rgba(42,42,38,1);

  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">

<img src="../posts/img/31_2684.jpg" alt="" style="position:absolute;left:0px;top:0px;width:1080px;height:1920px;object-fit:cover;">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:430px;background:linear-gradient(180deg, rgba(42,42,38,0.85) 0%, rgba(42,42,38,0) 100%);"></div>
<div style="position:absolute;left:0px;top:980px;width:1080px;height:940px;background:linear-gradient(180deg, rgba(42,42,38,0) 0%, rgba(42,42,38,0.86) 55%, rgba(42,42,38,0.9) 100%);"></div>
<img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:100px;width:162px;height:48px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:1160px;width:654px;height:288px;display:flex;flex-direction:column;justify-content:flex-start;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:80px;font-weight:700;color:rgba(241,238,228,1);letter-spacing:0px;line-height:96px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">Your community.
Your voice.
<span style="color:rgba(224,214,188,1);">Your future.</span></p></div>
<div style="position:absolute;left:88px;top:1518px;width:465px;height:83px;background:rgba(224,214,188,1);border-radius:44px;"></div>
<div style="position:absolute;left:136px;top:1538px;width:369px;height:43px;display:flex;flex-direction:column;justify-content:flex-start;overflow:visible;"><p style="font-family:'Source Sans 3', system-ui, sans-serif;font-size:30px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0.5px;line-height:42.720001220703125px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">Support Northwest Oregon</p></div>
</div></div>
<script>(function(){var W=1080,H=1920,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
