<!doctype html>

<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />

<style>
  .s13 { position:absolute; inset:0; z-index:5; background:#0f1610; overflow:hidden; }
  .s13-photo { position:absolute; z-index:1; inset:0; }
  .s13-photo img { width:100%; height:100%; object-fit:cover; object-position:center 50%; filter:saturate(.75) contrast(1.15) brightness(.55); }
  .s13-photo::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(90% 60% at 50% 40%, rgba(46,69,56,.3), transparent 70%),
      linear-gradient(180deg, rgba(10,15,11,.55) 0%, rgba(10,15,11,0) 30%, rgba(10,15,11,.8) 100%);
  }

  /* Corner brackets */
  .s13-brk { position:absolute; z-index:8; width:60px; height:60px; border:2px solid rgba(224,214,188,.55); }
  .s13-brk.tl { top:290px; left:72px; border-right:none; border-bottom:none; }
  .s13-brk.br { bottom:290px; right:72px; border-left:none; border-top:none; }

  .s13-mast { position:absolute; z-index:12; top:132px; left:96px; }

  .s13-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Single centered pull quote */
  .s13-center { position:absolute; z-index:10; left:96px; right:96px; top:600px; }
  .s13-lbl { font-family:var(--font-mono); font-size:15px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.7); text-align:center; margin-bottom:56px; }
  .s13-lbl::before, .s13-lbl::after { content:''; display:inline-block; width:40px; height:1px; background:currentColor; vertical-align:middle; margin:0 20px; }
  .s13-h { font-family:var(--font-display); font-weight:500; font-size:130px; line-height:.98; letter-spacing:-.03em; color:#f6f2e8; text-shadow:0 6px 32px rgba(0,0,0,.6); text-align:left; }
  .s13-h em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s13-rule { width:200px; height:2px; background:#e0d6bc; margin-top:64px; }

  /* Bottom manifesto tag */
  .s13-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; }
  .s13-foot-top { display:flex; align-items:center; justify-content:space-between; padding-bottom:26px; border-bottom:1px solid rgba(224,214,188,.28); margin-bottom:26px; }
  .s13-foot-top .item { font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.7); }
  .s13-foot-bot { display:flex; align-items:center; justify-content:space-between; }
  .s13-foot-bot .seal { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.5); }

<body>
  <div class="canvas story s-ink on-photo">
    <div class="s13">

      <div class="s13-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="s13-center">
        <div class="s13-lbl">Northwest Oregon</div>
        <h1 class="s13-h">The <em>future</em> of Northwest Oregon belongs to those willing to <em>build it.</em></h1>

      </div>

      <div class="s13-foot">
        <div class="s13-foot-top">
          <span class="item">Build</span>
          <span class="item">·</span>
          <span class="item">Lead</span>
          <span class="item">·</span>
          <span class="item">Serve</span>
        </div>
        <div class="s13-foot-bot">
          <span class="seal">NWOP · 2026</span>
          <span class="seal">Story XIII</span>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
