<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 01 · Attention every four years. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s01 { position:absolute; inset:0; z-index:5; background:#0d130e; overflow:hidden; }
  .s01-photo { position:absolute; z-index:1; top:0; left:0; right:0; height:1020px; overflow:hidden; }
  .s01-photo img { width:100%; height:100%; object-fit:cover; object-position:center 40%; filter:saturate(.85) contrast(1.1) brightness(.7); }
  .s01-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(13,19,14,.55) 0%, rgba(13,19,14,0) 40%, rgba(13,19,14,.55) 78%, #0d130e 100%),
      radial-gradient(80% 60% at 50% 30%, rgba(46,69,56,.35), transparent 70%);
  }
  .s01-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s01-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.55)); }
  .s01-kick { position:absolute; z-index:10; top:150px; right:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.8); }
  .s01-kick .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  .s01-cap { position:absolute; z-index:10; left:96px; top:920px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .s01-cap .dot { width:6px; height:6px; border-radius:50%; background:#e0d6bc; opacity:.7; }
  .s01-body { position:absolute; z-index:10; left:96px; right:96px; top:1070px; bottom:132px; display:flex; flex-direction:column; }
  .s01-headline { font-family:var(--font-display); font-weight:500; font-size:88px; line-height:1.02; letter-spacing:-.025em; color:#f6f2e8; }
  .s01-headline em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s01-rule { width:120px; height:2px; background:#e0d6bc; margin:36px 0 30px; }
  .s01-sub { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:46px; line-height:1.18; color:rgba(246,242,232,.9); letter-spacing:-.01em; }
  .s01-cta { margin-top:auto; display:flex; align-items:center; gap:22px; padding-top:34px; }
  .s01-cta .lbl { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:34px; color:#e0d6bc; letter-spacing:-.01em; }
  .s01-cta .arrow { width:64px; height:1px; background:#e0d6bc; position:relative; }
  .s01-cta .arrow::after { content:''; position:absolute; right:-2px; top:-5px; width:10px; height:10px; border-right:1.5px solid #e0d6bc; border-top:1.5px solid #e0d6bc; transform:rotate(45deg); }
</style>
</head>
<body>
  <div class="canvas story s-ink on-photo">
    <div class="s01">
      <div class="s01-photo"><img src="../assets/img/banner.jpg" alt="" /></div>
      <div class="s01-mast"><img src="../assets/nwop-logo-light.png" alt="" /></div>

      <div class="s01-body">
        <h1 class="s01-headline">Northwest Oregon deserves more than <em>attention every four years.</em></h1>
        <div class="s01-rule"></div>
        <p class="s01-sub">We're building something that lasts.</p>
        <div class="s01-cta">
          <span class="lbl">Learn More</span>
          <span class="arrow"></span>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
