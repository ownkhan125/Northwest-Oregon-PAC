<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 03 · Have you voted in a local election recently? — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s03 { position:absolute; inset:0; z-index:5; background:#2e4538; overflow:hidden; }
  .s03-bg { position:absolute; z-index:1; inset:0; opacity:.32; }
  .s03-bg img { width:100%; height:100%; object-fit:cover; object-position:center 55%; filter:saturate(.4) contrast(1.2) brightness(.55); }
  .s03-wash { position:absolute; z-index:2; inset:0;
    background:
      radial-gradient(70% 50% at 50% 30%, rgba(90,112,96,.35), transparent 65%),
      linear-gradient(180deg, rgba(46,69,56,.65) 0%, rgba(20,32,25,.9) 100%);
  }
  .s03-grid { position:absolute; z-index:3; inset:0; pointer-events:none; opacity:.08;
    background-image: linear-gradient(90deg, #e0d6bc 1px, transparent 1px), linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .s03-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s03-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 20px rgba(0,0,0,.5)); }
  .s03-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s03-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  /* corner registration marks */
  .s03-mark { position:absolute; z-index:8; width:22px; height:22px; }
  .s03-mark::before, .s03-mark::after { content:''; position:absolute; background:rgba(224,214,188,.55); }
  .s03-mark::before { left:10px; top:0; width:2px; height:22px; }
  .s03-mark::after  { top:10px; left:0; width:22px; height:2px; }
  .s03-mark.tl { top:280px; left:72px; }
  .s03-mark.tr { top:280px; right:72px; }
  .s03-mark.bl { bottom:280px; left:72px; }
  .s03-mark.br { bottom:280px; right:72px; }

  .s03-label { position:absolute; z-index:10; left:96px; top:400px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); display:flex; align-items:center; gap:18px; }
  .s03-label .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  .s03-q { position:absolute; z-index:10; left:96px; right:96px; top:520px;
    font-family:var(--font-display); font-weight:500; font-size:110px; line-height:1.0; letter-spacing:-.025em; color:#f6f2e8;
  }
  .s03-q em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s03-options { position:absolute; z-index:10; left:96px; right:96px; top:1150px; display:flex; flex-direction:column; gap:32px; }
  .s03-opt { padding:44px 60px; border:1.5px solid rgba(224,214,188,.4); border-radius:100px;
    background:rgba(224,214,188,.05);
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-display); font-weight:500; font-size:60px; letter-spacing:-.015em; color:#f6f2e8;
    box-shadow: 0 30px 60px -30px rgba(0,0,0,.5);
  }
  .s03-opt .pct { font-family:var(--font-mono); font-weight:400; font-size:22px; letter-spacing:.4em; color:rgba(224,214,188,.55); }
  .s03-opt.alt { background:transparent; border-style:dashed; color:#e0d6bc; }
  .s03-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; }
  .s03-foot .tap { font-family:var(--font-display); font-style:italic; font-size:32px; color:#e0d6bc; }
  .s03-foot .seal { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.5); }
</style>
</head>
<body>
  <div class="canvas story s-forest on-photo">
    <div class="s03">
      <div class="s03-bg"><img src="../assets/img/us-elections.jpg" alt="" /></div>
      <div class="s03-wash"></div>
      <div class="s03-grid"></div>

      <span class="s03-mark tl"></span>
      <span class="s03-mark tr"></span>
      <span class="s03-mark bl"></span>
      <span class="s03-mark br"></span>

      <div class="s03-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="s03-kick"><span class="bar"></span>Poll · 03</div>

      <div class="s03-label"><span class="bar"></span>A Quick Question</div>
      <h1 class="s03-q">Have you voted in a <em>local election</em> recently?</h1>

      <div class="s03-options">
        <div class="s03-opt"><span>Yes</span><span class="pct">Tap to answer</span></div>
        <div class="s03-opt alt"><span>Not Yet</span><span class="pct">Tap to answer</span></div>
      </div>

      <div class="s03-foot">
        <span class="tap">Tap a choice</span>
        <span class="seal">NWOP · Poll 03 · 2026</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
