<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 05 · Every dollar raised — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s05 { position:absolute; inset:0; z-index:5; background:#2e4538; overflow:hidden; }
  .s05-bg { position:absolute; z-index:1; inset:0; }
  .s05-bg::before { content:''; position:absolute; inset:0;
    background:
      radial-gradient(80% 60% at 30% 20%, rgba(90,112,96,.5), transparent 65%),
      radial-gradient(60% 40% at 80% 90%, rgba(107,90,66,.35), transparent 65%),
      linear-gradient(180deg, #2e4538 0%, #1c2d24 100%);
  }
  .s05-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s05-mast img { height:56px; width:auto; }
  .s05-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); display:flex; align-items:center; gap:18px; }
  .s05-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Numeric infographic $ */
  .s05-num-wrap { position:absolute; z-index:8; left:96px; right:96px; top:340px; display:flex; flex-direction:column; align-items:flex-start; gap:36px; }
  .s05-cap { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.6); display:flex; align-items:center; gap:16px; }
  .s05-cap .bar { width:56px; height:1px; background:currentColor; }
  .s05-dollar { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:640px; line-height:.7; color:#e0d6bc; letter-spacing:-.05em; }

  .s05-quote { position:absolute; z-index:10; left:96px; right:96px; top:1150px;
    font-family:var(--font-display); font-weight:500; font-size:88px; line-height:1.02; letter-spacing:-.025em; color:#f6f2e8;
  }
  .s05-quote em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s05-rule { position:absolute; z-index:10; left:96px; top:1620px; width:120px; height:2px; background:#e0d6bc; }

  .s05-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; }
  .s05-cta { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:42px; color:#e0d6bc; letter-spacing:-.01em; }
  .s05-seal { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.5); }
</style>
</head>
<body>
  <div class="canvas story s-forest">
    <div class="s05">
      <div class="s05-bg"></div>

      <div class="s05-mast"><img src="../assets/nwop-logo-light.png" alt="" /></div>

      <div class="s05-num-wrap">
        <div class="s05-dollar">$</div>
      </div>

      <h1 class="s05-quote">Every dollar raised stays focused on <em>strengthening Northwest Oregon.</em></h1>
      <div class="s05-rule"></div>

      <div class="s05-foot">
        <span class="s05-cta">Support the Mission</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
