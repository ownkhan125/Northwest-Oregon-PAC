<style>

  .s28-photo { position:absolute; z-index:3; left:96px; top:340px; width:520px; height:640px; overflow:hidden;

  .s28-photo .cap { position:absolute; left:0; right:0; bottom:22px; text-align:center; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:#6B5A42; }

  .s28-poll-lbl { position:absolute; z-index:10; left:96px; top:1170px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#6B5A42; display:flex; align-items:center; gap:14px; }
