<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 29 · Support Ciatta Thompson — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s29 { position:absolute; inset:0; z-index:5; background:#111a13; overflow:hidden; }

  /* Portrait bottom-heavy fullbleed with layered wash */
  .s29-portrait { position:absolute; z-index:1; inset:0; }
  .s29-portrait img { width:100%; height:100%; object-fit:cover; object-position:center 22%; filter:saturate(.9) contrast(1.08); }
  .s29-portrait::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(17,26,19,.45) 0%, rgba(17,26,19,0) 25%, rgba(17,26,19,.5) 55%, rgba(17,26,19,.95) 100%);
  }

  .s29-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s29-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.55)); }
  .s29-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s29-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Editorial name badge upper */
  .s29-namebadge { position:absolute; z-index:8; top:290px; left:72px; display:flex; align-items:center; gap:14px;
    padding:14px 20px; background:rgba(17,26,19,.5); border:1px solid rgba(224,214,188,.45); backdrop-filter: blur(6px);
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75);
  }
  .s29-namebadge .dot { width:6px; height:6px; border-radius:50%; background:#e0d6bc; }

  /* Big serif quote-style headline */
  .s29-block { position:absolute; z-index:10; left:96px; right:96px; top:1120px; }
  .s29-lbl { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); display:flex; align-items:center; gap:16px; margin-bottom:32px; }
  .s29-lbl .bar { width:56px; height:1px; background:currentColor; }
  .s29-h { font-family:var(--font-display); font-weight:500; font-size:110px; line-height:.98; letter-spacing:-.028em; color:#f6f2e8; text-shadow: 0 6px 32px rgba(0,0,0,.55); }
  .s29-h em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s29-rule { width:120px; height:2px; background:#e0d6bc; margin:44px 0 32px; }

  /* CTA - "Support Ciatta Thompson today." */
  .s29-cta { display:flex; align-items:center; gap:22px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:64px; line-height:1.04; letter-spacing:-.02em; color:#e0d6bc;
  }
  .s29-cta .arrow { display:inline-block; width:80px; height:1px; background:#e0d6bc; position:relative; margin-left:6px; margin-top:14px; }
  .s29-cta .arrow::after { content:''; position:absolute; right:-1px; top:-5px; width:10px; height:10px; border-right:1.5px solid #e0d6bc; border-top:1.5px solid #e0d6bc; transform:rotate(45deg); }

  .s29-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:132px; display:flex; align-items:center; justify-content:space-between; padding-top:24px; border-top:1px solid rgba(224,214,188,.25); }
  .s29-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.65); }
</style>
</head>
<body>
  <div class="canvas story s-ink on-photo">
    <div class="s29">
      <div class="s29-portrait"><img src="../assets/img/ciatta-thompson.jpg" alt="Ciatta Thompson" /></div>

      <div class="s29-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="s29-kick"><span class="bar"></span>Candidate · XXIX</div>

      <div class="s29-namebadge"><span class="dot"></span>Ciatta Thompson · Oregon House</div>

      <div class="s29-block">
        <div class="s29-lbl"><span class="bar"></span>Support Every Contribution</div>
        <h1 class="s29-h">Every contribution helps strengthen <em>campaigns.</em></h1>
        <div class="s29-rule"></div>
        <div class="s29-cta">Support Ciatta Thompson today.<span class="arrow"></span></div>
      </div>

      <div class="s29-foot">
        <span class="txt">NWOP · Ciatta Thompson</span>
        <span class="txt">2026</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
