<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 02 · Your community. Your voice. Your future. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s02 { position:absolute; inset:0; z-index:5; background:#f6f2e8; overflow:hidden; }
  .s02-bg { position:absolute; z-index:1; inset:0;
    background:
      radial-gradient(60% 40% at 82% 12%, rgba(90,112,96,.16), transparent 65%),
      radial-gradient(70% 45% at 10% 88%, rgba(107,90,66,.12), transparent 65%),
      linear-gradient(180deg, #f6f2e8 0%, #ece5cd 100%);
  }
  .s02-photo { position:absolute; z-index:2; right:70px; top:290px; width:480px; height:620px; overflow:hidden;
    border-radius:6px; box-shadow: 0 60px 100px -35px rgba(46,42,20,.4);
    transform:rotate(1.6deg);
  }
  .s02-photo img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(.9) contrast(1.05); }
  .s02-photo::after { content:''; position:absolute; inset:0; border:1px solid rgba(46,42,20,.15); border-radius:6px; }
  .s02-tape { position:absolute; z-index:3; top:275px; right:280px; width:120px; height:28px; background:rgba(224,214,188,.85); box-shadow:0 4px 10px rgba(0,0,0,.1); transform:rotate(-3deg); }
  .s02-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s02-mast img { height:56px; width:auto; }
  .s02-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,42,20,.65); display:flex; align-items:center; gap:18px; }
  .s02-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .s02-nums { position:absolute; z-index:8; left:96px; top:340px; display:flex; flex-direction:column; gap:60px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,42,20,.5); }
  .s02-stack { position:absolute; z-index:10; left:96px; right:96px; top:1020px; }
  .s02-line { display:flex; align-items:baseline; gap:32px; padding:26px 0; border-top:1px solid rgba(46,42,20,.22); }
  .s02-line:last-of-type { border-bottom:1px solid rgba(46,42,20,.22); }
  .s02-line .n { font-family:var(--font-mono); font-size:22px; letter-spacing:.4em; color:rgba(46,42,20,.55); min-width:80px; }
  .s02-line .w { font-family:var(--font-display); font-weight:500; font-size:108px; line-height:.95; letter-spacing:-.03em; color:#2e4538; }
  .s02-line .w em { font-style:italic; font-weight:400; color:#5A7060; }
  .s02-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; }
  .s02-cta { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:38px; color:#2e4538; letter-spacing:-.01em; }
  .s02-seal { display:flex; align-items:center; gap:14px; font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.5); }
  .s02-seal .dot { width:6px; height:6px; border-radius:50%; background:#2e4538; }
</style>
</head>
<body>
  <div class="canvas story s-sand">
    <div class="s02">
      <div class="s02-bg"></div>
      <div class="s02-photo"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="s02-tape"></div>

      <div class="s02-mast"><img src="../assets/nwop-logo-dark.png" alt="" /></div>

      <div class="s02-nums" aria-hidden="true">
        <span>001</span>
        <span>002</span>
        <span>003</span>
      </div>

      <div class="s02-stack">
        <div class="s02-line"><span class="n">001</span><span class="w">Your <em>community.</em></span></div>
        <div class="s02-line"><span class="n">002</span><span class="w">Your <em>voice.</em></span></div>
        <div class="s02-line"><span class="n">003</span><span class="w">Your <em>future.</em></span></div>
      </div>

      <div class="s02-foot">
        <span class="s02-cta">Support Northwest Oregon</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
