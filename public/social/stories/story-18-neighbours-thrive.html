<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 18 · Strong leadership and long-term investment. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />

<style>
  .s18 { position:absolute; inset:0; z-index:5; background:#0e1610; overflow:hidden; }
  .s18-photo { position:absolute; z-index:1; inset:0; }
  .s18-photo img { width:100%; height:100%; object-fit:cover; object-position:center 60%; filter:saturate(.75) contrast(1.15) brightness(.5); }
  .s18-photo::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(90% 60% at 50% 30%, rgba(46,69,56,.35), transparent 65%),
      linear-gradient(180deg, rgba(10,15,11,.4) 0%, rgba(10,15,11,.1) 40%, rgba(10,15,11,.9) 100%);
  }

  /* upper: two half-cards side-by-side */
  .s18-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s18-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.55)); }
  .s18-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s18-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  .s18-cards { position:absolute; z-index:10; left:96px; right:96px; top:340px; display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .s18-card { padding:44px 40px; background:rgba(224,214,188,.08); border:1px solid rgba(224,214,188,.25); backdrop-filter: blur(8px); }
  .s18-card .lbl { font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.7); margin-bottom:26px; }
  .s18-card .w { font-family:var(--font-display); font-weight:500; font-size:58px; line-height:1.0; letter-spacing:-.02em; color:#f6f2e8; }
  .s18-card .w em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .s18-card + .s18-card { transform:translateY(30px); }

  .s18-plus { position:absolute; z-index:11; left:50%; top:466px; transform:translate(-50%, 0); width:56px; height:56px; border:1.5px solid rgba(224,214,188,.6); background:#0e1610; border-radius:50%; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); color:#e0d6bc; font-size:24px; }

  /* Big equals result */
  .s18-eq { position:absolute; z-index:10; left:96px; right:96px; top:820px; text-align:center; font-family:var(--font-mono); font-size:22px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .s18-eq::before, .s18-eq::after { content:''; display:inline-block; width:80px; height:1px; background:currentColor; vertical-align:middle; margin:0 20px; opacity:.6; }

  .s18-result { position:absolute; z-index:10; left:96px; right:96px; top:920px;
    font-family:var(--font-display); font-weight:500; font-size:132px; line-height:.96; letter-spacing:-.03em; color:#f6f2e8; text-shadow:0 6px 32px rgba(0,0,0,.55);
  }
  .s18-result em { font-style:italic; font-weight:400; color:#e0d6bc; }

  .s18-bot { position:absolute; z-index:10; left:96px; right:96px; top:1420px; }
  .s18-bot .cap { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); display:flex; align-items:center; gap:14px; margin-bottom:32px; }
  .s18-bot .cap .bar { width:52px; height:1px; background:currentColor; }
  .s18-bot .h { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:70px; line-height:1.06; letter-spacing:-.02em; color:#e0d6bc; }

  .s18-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:32px; border-top:1px solid rgba(224,214,188,.22); }
  .s18-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.55); }
</style>
</head>
<body>
  <div class="canvas story s-ink on-photo">
    <div class="s18">
      <div class="s18-photo"><img src="../assets/img/hero.jpg" alt="" /></div>

      <div class="s18-mast"><img src="../assets/nwop-logo-light.png" alt="" /></div>

      <div class="s18-cards">
        <div class="s18-card">
          <div class="w">Strong <em>leadership</em></div>
        </div>
        <div class="s18-card">
          <div class="w">Long-term <em>investment</em></div>
        </div>
      </div>

      <h1 class="s18-result">Help communities <em>thrive.</em></h1>

      <div class="s18-bot">
        <p class="h">That's how lasting change begins.</p>
      </div>

      <div class="s18-foot">
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
