<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Story 21 · Leadership isn't about titles. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .s21 { position:absolute; inset:0; z-index:5; background:#2e4538; overflow:hidden; }
  .s21-bg { position:absolute; z-index:1; inset:0;
    background:
      radial-gradient(70% 40% at 20% 15%, rgba(90,112,96,.4), transparent 60%),
      radial-gradient(60% 35% at 90% 85%, rgba(20,32,25,.55), transparent 60%),
      linear-gradient(180deg, #33503f 0%, #1c2d24 100%);
  }
  .s21-mast { position:absolute; z-index:12; top:132px; left:96px; }
  .s21-mast img { height:56px; width:auto; }
  .s21-kick { position:absolute; z-index:10; top:150px; right:96px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); display:flex; align-items:center; gap:18px; }
  .s21-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Big struck-through statement */
  .s21-top { position:absolute; z-index:10; left:96px; right:96px; top:340px; }
  .s21-cap { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55); display:flex; align-items:center; gap:14px; margin-bottom:44px; }
  .s21-cap .bar { width:50px; height:1px; background:currentColor; }
  .s21-h { font-family:var(--font-display); font-weight:500; font-size:150px; line-height:.94; letter-spacing:-.035em; color:#f6f2e8; }
  .s21-h .strike { position:relative; display:inline-block; }
  .s21-h .strike::after { content:''; position:absolute; left:-2%; right:-2%; top:52%; height:6px; background:#c9432c; opacity:.7; transform:rotate(-2deg); }
  .s21-h em { font-style:italic; font-weight:400; color:#e0d6bc; }

  /* Divider with badge */
  .s21-div { position:absolute; z-index:10; left:96px; right:96px; top:1090px; display:flex; align-items:center; gap:22px; }
  .s21-div .line { flex:1; height:1px; background:rgba(224,214,188,.35); }
  .s21-div .badge { font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); padding:8px 20px; border:1px solid rgba(224,214,188,.35); }

  /* Big italic answer */
  .s21-bot { position:absolute; z-index:10; left:96px; right:96px; top:1220px; }
  .s21-lbl { font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55); margin-bottom:34px; display:flex; align-items:center; gap:14px; }
  .s21-lbl .bar { width:50px; height:1px; background:currentColor; }
  .s21-h2 { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:112px; line-height:.98; letter-spacing:-.028em; color:#e0d6bc; }
  .s21-h2 span { color:#f6f2e8; font-style:normal; font-weight:500; }

  .s21-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:150px; display:flex; align-items:center; justify-content:space-between; padding-top:32px; border-top:1px solid rgba(224,214,188,.25); }
  .s21-foot .txt { font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.55); }
</style>
</head>
<body>
  <div class="canvas story s-forest">
    <div class="s21">
      <div class="s21-bg"></div>

      <div class="s21-mast"><img src="../assets/nwop-logo-light.png" alt="" /></div>

      <div class="s21-top">
        <h1 class="s21-h">Leadership isn't about <span class="strike"><em>titles.</em></span></h1>
      </div>

      <div class="s21-div">
        <span class="line"></span>
        <span class="line"></span>
      </div>

      <div class="s21-bot">
        <h2 class="s21-h2"><span>It's about</span> serving your <span>community.</span></h2>
      </div>

      <div class="s21-foot">
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
