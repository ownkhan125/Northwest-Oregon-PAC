<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 59 · Northwest Oregon comes first. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Editorial cover w/ polaroid film-strip along bottom + multi-tier stacked text */
  .f59 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 100% 0%, rgba(107,90,66,.18) 0%, transparent 60%),
      radial-gradient(60% 45% at 0% 100%, rgba(90,112,96,.14) 0%, transparent 60%),
      linear-gradient(178deg, #f6f2e8 0%, #ece4cf 100%);
  }
  .f59-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(45deg, #6b5a42 1px, transparent 1px),
      linear-gradient(-45deg, #6b5a42 1px, transparent 1px);
    background-size:32px 32px;
  }

  /* Mast */
  .f59-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f59-mast img { height:56px; width:auto; }
  /* Small "Northwest Oregon" columnar mark right */
  .f59-north { position:absolute; z-index:14; top:110px; right:96px;
    writing-mode:vertical-rl;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.55em; text-transform:uppercase; color:rgba(46,69,56,.55);
  }

  /* Eyebrow row */
  .f59-eyebrow { position:absolute; z-index:10; top:236px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.55em; text-transform:uppercase; color:#5a7060; font-weight:600;
  }
  .f59-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }

  /* Big headline top */
  .f59-head { position:absolute; z-index:10; top:284px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:100px; line-height:.94; letter-spacing:-.036em; color:#2e4538;
  }
  .f59-head em { font-style:italic; font-weight:400; color:#5a7060; }

  /* Rule */
  .f59-rule { position:absolute; z-index:10; top:460px; left:96px; width:170px; height:2px; background:#2e4538; opacity:.55; }

  /* Tier 2: guiding question */
  .f59-tier { position:absolute; z-index:10; top:498px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-style:normal; font-size:26px; line-height:1.32; letter-spacing:-.006em; color:#6b5a42;
  }
  /* Tier 3: the italic centerpiece question */
  .f59-mid { position:absolute; z-index:10; top:568px; left:96px; right:96px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:56px; line-height:1.1; letter-spacing:-.022em; color:#2e4538;
  }
  /* Tier 4: closer */
  .f59-close { position:absolute; z-index:10; top:700px; left:96px; right:520px;
    font-family:var(--font-display); font-weight:600; font-size:34px; line-height:1.2; letter-spacing:-.012em; color:#2a2a26;
  }
  .f59-close em { font-style:italic; font-weight:500; color:#5a7060; }

  /* Polaroid film-strip bottom-right — 2 tiles */
  .f59-strip { position:absolute; z-index:6; right:96px; bottom:170px; width:340px; height:260px; }
  .f59-strip .card { position:absolute; padding:10px 10px 30px; background:#faf3d8;
    box-shadow:0 30px 60px -22px rgba(46,42,20,.5), 0 6px 14px rgba(46,42,20,.2);
    border:1px solid rgba(46,42,20,.08);
  }
  .f59-strip .card .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f59-strip .card .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.72) contrast(1.14); }
  .f59-strip .c1 { top:20px; right:170px; width:150px; transform:rotate(-5deg); z-index:6; }
  .f59-strip .c2 { top:60px; right:0; width:170px; transform:rotate(4deg); z-index:7; }

  /* Baseline meta */
  .f59-baseline { position:absolute; z-index:10; bottom:96px; left:96px; right:96px; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.5);
  }
  .f59-baseline .stars { display:flex; gap:12px; opacity:.7; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f59">
      <div class="f59-hatch"></div>

      <div class="f59-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f59-north"></div>

      <div class="f59-eyebrow"><span class="bar"></span></div>

      <h1 class="f59-head">Northwest Oregon <em>comes first.</em></h1>

      <div class="f59-rule"></div>

      <div class="f59-tier">Every decision we make is guided by one question:</div>
      <div class="f59-mid">Will this make our communities <em>stronger?</em></div>
      <div class="f59-close">If the answer is <em>yes,</em> we&rsquo;ll fight for it.</div>

      <div class="f59-strip">
        <div class="card c1"><div class="p"><img src="../assets/img/event.jpg" alt="" /></div></div>
        <div class="card c2"><div class="p"><img src="../assets/img/hero.jpg" alt="" /></div></div>
      </div>

      <div class="f59-baseline">
        <span></span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
