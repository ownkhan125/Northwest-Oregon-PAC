<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 36 · Strong Communities Begin with Strong Leadership. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Documentary poster — top half is a cinematic community/campaign photo (banded, not full bleed);
     bottom half is a cream editorial plate with a big serif sentence.
     A firm horizontal seam separates the two zones — no text over the photo. */
  .f36 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#f6f2e8; }
  /* Top photo band — occupies top ~48% */
  .f36-photo { position:absolute; z-index:2; top:0; left:0; right:0; height:520px; overflow:hidden; }
  .f36-photo img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(.7) contrast(1.2) brightness(.8); }
  .f36-photo::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 45% at 20% 20%, rgba(90,112,96,.32) 0%, transparent 65%),
      linear-gradient(180deg, rgba(20,30,22,.5) 0%, rgba(20,30,22,.15) 30%, rgba(20,30,22,.28) 100%);
  }
  /* Photo top-left mast */
  .f36-mast { position:absolute; z-index:14; top:64px; left:80px; }
  .f36-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.5)); }
  /* Stars top-right on photo */
  .f36-stars { position:absolute; z-index:14; top:80px; right:80px; display:grid; grid-template-columns:repeat(5,10px); gap:12px; opacity:.7; }
  /* Seam between panels */
  .f36-seam { position:absolute; z-index:6; left:0; right:0; top:520px; height:6px; background:#0a100c; }
  .f36-seam::before { content:''; position:absolute; left:0; right:0; top:6px; height:2px; background:linear-gradient(90deg, transparent, rgba(46,69,56,.5), transparent); }
  /* Bottom sand plate */
  .f36-plate { position:absolute; z-index:5; left:0; right:0; top:528px; bottom:0; padding:70px 96px 96px; display:flex; flex-direction:column; }
  /* Kicker line */
  .f36-kick { display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; margin-bottom:34px; }
  .f36-kick .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  /* Big serif sentence */
  .f36-h1 { font-family:var(--font-display); font-weight:500; font-size:80px; line-height:.98; letter-spacing:-.026em; color:#2e4538; max-width:100%; }
  .f36-h1 em { font-style:italic; color:#5a7060; }
  /* Bottom detail row */
  .f36-bot { margin-top:auto; display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.55); }
  .f36-bot .bar { flex:1; height:1px; background:currentColor; opacity:.5; }
  .f36-bot .star svg { display:block; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f36">
      <div class="f36-photo"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f36-seam"></div>

      <div class="f36-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f36-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f36-plate">
        <div class="f36-kick"><span class="bar"></span></div>
        <h1 class="f36-h1">Strong Communities <em>Begin with</em> Strong Leadership.</h1>
        <div class="f36-bot">
          <span class="bar"></span>
          <span class="star" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          </span>
          <span class="bar"></span>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
