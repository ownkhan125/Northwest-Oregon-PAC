<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 22 · Powered by innovation — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f22 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#f6f2e8; }
  /* Top photo panel — 52% */
  .f22-photo { position:absolute; z-index:1; top:0; left:0; right:0; height:52%; overflow:hidden; }
  .f22-photo img { width:100%; height:100%; object-fit:cover; object-position:50% 45%; filter:saturate(.65) contrast(1.2) brightness(.62); }
  .f22-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(15,26,19,.45) 0%, rgba(15,26,19,.25) 25%, rgba(15,26,19,.55) 65%, rgba(246,242,232,.35) 92%, #f6f2e8 100%),
      radial-gradient(60% 45% at 25% 30%, rgba(90,112,96,.28) 0%, transparent 70%);
  }
  /* Bottom light panel */
  .f22-lower { position:absolute; z-index:2; top:48%; left:0; right:0; bottom:0;
    background:
      radial-gradient(60% 55% at 0% 100%, rgba(224,214,188,.5) 0%, transparent 60%),
      linear-gradient(180deg, #f6f2e8 0%, #ece2c8 100%);
  }
  /* Diagonal seam */
  .f22-seam { position:absolute; z-index:4; left:-4%; right:-4%; top:52%; height:2px; background:rgba(46,69,56,.7); transform:rotate(-1.2deg); }
  /* Blueprint hairline on lower panel */
  .f22-blueprint { position:absolute; z-index:3; top:52%; left:0; right:0; bottom:0; opacity:.07; pointer-events:none;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Mast on photo (light) */
  .f22-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f22-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.5)); }
  .f22-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }
  /* Kicker on photo */
  .f22-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(246,242,232,.85);
  }
  .f22-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big headline on photo — positioned in upper photo area, well above the seam */
  .f22-h1 { position:absolute; z-index:10; left:96px; right:96px; top:270px;
    font-family:var(--font-display); font-weight:500; font-size:78px; line-height:1.02; letter-spacing:-.028em; color:#f6f2e8;
    text-shadow: 0 4px 16px rgba(0,0,0,.85), 0 10px 40px rgba(0,0,0,.65); max-width:900px;
  }
  .f22-h1 em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Body paragraph on light lower panel */
  .f22-body { position:absolute; z-index:10; left:96px; right:96px; top:640px;
    font-family:var(--font-display); font-weight:500; font-size:38px; line-height:1.24; letter-spacing:-.013em; color:#2e4538;
  }
  .f22-body em { font-style:italic; font-weight:400; color:#5a7060; }
  /* Icon strip — hydropower / forestry / agriculture / tech */
  .f22-strip { position:absolute; z-index:10; left:96px; right:96px; bottom:180px; display:flex; justify-content:space-between; align-items:center; gap:20px; padding-top:22px; border-top:1.5px solid rgba(46,69,56,.35); }
  .f22-strip .cell { display:flex; align-items:center; justify-content:center; width:64px; height:64px; border:1px solid rgba(46,69,56,.32); border-radius:50%; background:rgba(46,69,56,.05); }
  .f22-strip .cell svg { width:36px; height:36px; color:#2e4538; opacity:.85; }
  /* Baseline */
  .f22-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.6);
  }
  .f22-baseline .stars { display:flex; gap:12px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f22">
      <div class="f22-photo"><img src="../assets/img/bridge.png" alt="" /></div>
      <div class="f22-lower"></div>
      <div class="f22-blueprint"></div>
      <div class="f22-seam"></div>

      <div class="f22-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f22-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f22-kick"><span class="bar"></span></div>

      <h1 class="f22-h1">Northwest Oregon has always been powered by <em>innovation.</em></h1>

      <p class="f22-body">From hydropower and forestry to agriculture, manufacturing, and emerging technologies, our region succeeds when we build on the resources that make <em>Oregon unique.</em></p>

      <div class="f22-strip" aria-hidden="true">
        <div class="cell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 18 C7 14 10 18 14 14 C18 10 21 14 21 14"/><path d="M3 22 C7 18 10 22 14 18 C18 14 21 18 21 18"/></svg>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2 L18 12 h-3 L20 20 H4 L9 12 H6 z"/><path d="M12 20 v2"/></svg>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20 v-6 c0-3 3-5 8-5 s8 2 8 5 v6"/><path d="M4 20 h16"/><path d="M12 4 v5"/><path d="M9 6 c0 2 3 3 3 3 s3-1 3-3"/></svg>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="14" rx="1"/><path d="M8 10 h8 M8 14 h5"/></svg>
        </div>
        <div class="cell">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 3 v3 M12 18 v3 M3 12 h3 M18 12 h3 M5 5 l2 2 M17 17 l2 2 M5 19 l2-2 M17 7 l2-2"/></svg>
        </div>
      </div>

      <div class="f22-baseline">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
