<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 02 · Our Region. Our Voice. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f02 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; display:grid; grid-template-columns:1fr 1fr; }
  /* Left panel */
  .f02-l { position:relative; overflow:hidden; }
  .f02-l .p { position:absolute; inset:0; }
  .f02-l .p img { width:100%; height:100%; object-fit:cover; object-position:70% 45%; filter:saturate(.7) contrast(1.22) brightness(.78); }
  .f02-l .p::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 45% at 30% 15%, rgba(90,112,96,.32) 0%, transparent 70%),
      linear-gradient(180deg, rgba(20,30,22,.18) 0%, rgba(10,16,12,.45) 70%, rgba(10,16,12,.75) 100%);
  }
  /* Right panel */
  .f02-r { position:relative; overflow:hidden; }
  .f02-r .p { position:absolute; inset:0; }
  .f02-r .p img { width:100%; height:100%; object-fit:cover; object-position:35% 55%; filter:saturate(.62) contrast(1.28) brightness(.68); }
  .f02-r .p::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 55% at 70% 20%, rgba(107,90,66,.3) 0%, transparent 70%),
      linear-gradient(180deg, rgba(20,30,22,.25) 0%, rgba(6,10,7,.55) 65%, rgba(6,10,7,.9) 100%);
  }
  /* Vertical gap ribbon between panels */
  .f02-gap { position:absolute; z-index:8; left:50%; top:0; bottom:0; width:6px; transform:translateX(-3px); background:#0a100c; box-shadow:0 0 24px 6px rgba(0,0,0,.7); }
  .f02-gap::before { content:''; position:absolute; left:2px; top:0; bottom:0; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.45) 20%, rgba(224,214,188,.45) 80%, rgba(224,214,188,0)); }
  /* Kicker chips at top of each panel */
  .f02-kick { position:absolute; z-index:10; top:96px; display:flex; align-items:center; gap:18px; font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.72); }
  .f02-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f02-kick.l { left:80px; }
  .f02-kick.r { right:80px; flex-direction:row-reverse; }
  /* Star cluster mirroring */
  .f02-star { position:absolute; z-index:8; top:150px; opacity:.7; display:flex; gap:12px; }
  .f02-star.l { left:80px; }
  .f02-star.r { right:80px; }
  /* Mast — centered on the gap */
  .f02-mast { position:absolute; z-index:14; top:56px; left:50%; transform:translateX(-50%); padding:14px 26px; background:#0a100c; border-radius:999px; box-shadow:0 12px 40px rgba(0,0,0,.6); border:1px solid rgba(224,214,188,.16); }
  .f02-mast img { height:44px; width:auto; display:block; }
  /* Big words — vertically centered */
  .f02-word { position:absolute; z-index:10; top:50%; transform:translateY(-50%);
    font-family:var(--font-display); font-weight:500; color:#f6f2e8; letter-spacing:-.03em; line-height:.94; text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  .f02-word .a { display:block; }
  .f02-word .b { display:block; font-style:italic; font-weight:400; color:#e0d6bc; }
  .f02-word.l { left:80px; right:calc(50% + 60px); text-align:left; font-size:132px; }
  .f02-word.r { right:80px; left:calc(50% + 60px); text-align:right; font-size:132px; }
  /* Bottom credit rules */
  .f02-rule { position:absolute; z-index:10; bottom:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.5), rgba(224,214,188,0)); }
  .f02-rule.l { left:80px; right:calc(50% + 40px); }
  .f02-rule.r { right:80px; left:calc(50% + 40px); background:linear-gradient(-90deg, rgba(224,214,188,.5), rgba(224,214,188,0)); }
  /* Bottom labels */
  .f02-flag { position:absolute; z-index:10; bottom:130px; font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); }
  .f02-flag.l { left:80px; }
  .f02-flag.r { right:80px; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f02">
      <div class="f02-l">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>
      <div class="f02-r">
        <div class="p"><img src="../assets/img/banner.jpg" alt="" /></div>
      </div>
      <div class="f02-gap"></div>

      <div class="f02-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f02-kick l"><span class="bar"></span></div>
      <div class="f02-kick r"><span class="bar"></span></div>

      <div class="f02-star l" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
      <div class="f02-star r" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <h1 class="f02-word l"><span class="a">Our</span><span class="b">Region.</span></h1>
      <h1 class="f02-word r"><span class="a">Our</span><span class="b">Voice.</span></h1>

      <div class="f02-rule l"></div>
      <div class="f02-rule r"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
