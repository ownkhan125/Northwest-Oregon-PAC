<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 24 · Building the foundation — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f24 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 10% 12%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(107,90,66,.16) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #ece2c8 100%);
  }
  /* Registration marks - corners */
  .f24-reg { position:absolute; z-index:6; width:22px; height:22px; color:#2e4538; opacity:.55; }
  .f24-reg::before, .f24-reg::after { content:''; position:absolute; background:currentColor; }
  .f24-reg::before { left:50%; top:0; bottom:0; width:1.5px; margin-left:-.75px; }
  .f24-reg::after  { top:50%; left:0; right:0; height:1.5px; margin-top:-.75px; }
  .f24-reg.tl { top:60px; left:60px; }
  .f24-reg.tr { top:60px; right:60px; }
  .f24-reg.bl { bottom:60px; left:60px; }
  .f24-reg.br { bottom:60px; right:60px; }
  /* Mast */
  .f24-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f24-mast img { height:56px; width:auto; }
  .f24-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker */
  .f24-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .f24-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big display headline */
  .f24-h1 { position:absolute; z-index:10; left:96px; right:96px; top:284px;
    font-family:var(--font-display); font-weight:500; font-size:78px; line-height:.98; letter-spacing:-.028em; color:#2e4538;
  }
  .f24-h1 em { font-style:italic; font-weight:400; color:#5a7060; }
  /* Sub kicker */
  .f24-sub { position:absolute; z-index:10; left:96px; top:530px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  /* Rule */
  .f24-rule { position:absolute; z-index:10; left:96px; right:96px; top:570px; height:2px; background:rgba(46,69,56,.5); }
  /* Checklist */
  .f24-list { position:absolute; z-index:10; left:96px; right:96px; top:600px; display:flex; flex-direction:column; }
  .f24-item { display:flex; align-items:center; gap:32px; padding:16px 0; border-bottom:1px solid rgba(46,69,56,.22); }
  .f24-item:last-child { border-bottom:none; }
  .f24-item .roman { flex:none; width:64px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:36px; color:#5a7060; letter-spacing:.02em;
  }
  .f24-item .mark { flex:none; width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:1.5px solid #2e4538; color:#2e4538; border-radius:50%; font-family:var(--font-mono); font-weight:600; font-size:16px; }
  .f24-item .txt { flex:1;
    font-family:var(--font-display); font-weight:500; font-size:36px; line-height:1.14; letter-spacing:-.014em; color:#2e4538;
  }
  /* Baseline */
  .f24-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.55);
  }
  .f24-baseline .stars { display:flex; gap:12px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f24">
      <span class="f24-reg tl"></span>
      <span class="f24-reg tr"></span>
      <span class="f24-reg bl"></span>
      <span class="f24-reg br"></span>

      <div class="f24-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f24-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f24-kick"><span class="bar"></span></div>

      <h1 class="f24-h1">We're building the foundation for <em>Northwest Oregon's</em> future.</h1>

      <div class="f24-sub">Northwest Oregon PAC exists to</div>
      <div class="f24-rule"></div>

      <div class="f24-list">
        <div class="f24-item">
          <span class="roman">I.</span>
          <span class="mark">+</span>
          <span class="txt">Recruit leaders</span>
        </div>
        <div class="f24-item">
          <span class="roman">II.</span>
          <span class="mark">+</span>
          <span class="txt">Strengthen campaigns</span>
        </div>
        <div class="f24-item">
          <span class="roman">III.</span>
          <span class="mark">+</span>
          <span class="txt">Provide strategic messaging</span>
        </div>
        <div class="f24-item">
          <span class="roman">IV.</span>
          <span class="mark">+</span>
          <span class="txt">Support long-term electoral success</span>
        </div>
      </div>

      <div class="f24-baseline">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
