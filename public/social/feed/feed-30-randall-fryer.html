<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 30 · Randall Fryer — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Magazine-cover editorial — cream page, giant serif name at TOP running full-width,
     square portrait tile offset lower-right sits within its own dark plate, bio in lower-left column.
     Ornamental hairline dividers frame the composition. Fully distinct from feed-26 (full-bleed) and feed-27 (right portrait pane). */
  .f30 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 88%, rgba(224,214,188,.55) 0%, transparent 65%),
      linear-gradient(180deg, #f8f4ea 0%, #f0e7d1 100%);
  }
  /* Top hairline frame */
  .f30-topline { position:absolute; z-index:6; left:80px; right:80px; top:96px; height:1px; background:#2e4538; opacity:.35; }
  .f30-botline { position:absolute; z-index:6; left:80px; right:80px; bottom:96px; height:1px; background:#2e4538; opacity:.35; }
  /* Mast */
  .f30-mast { position:absolute; z-index:14; top:118px; left:80px; }
  .f30-mast img { height:52px; width:auto; }
  /* Top-right issue tag */
  .f30-issue { position:absolute; z-index:14; top:130px; right:80px; font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; text-align:right; }
  .f30-issue em { font-style:italic; color:#2e4538; opacity:.6; }
  /* Kicker */
  .f30-kick { position:absolute; z-index:10; left:80px; top:246px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f30-kick .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  /* GIANT serif name — top full-width */
  .f30-name { position:absolute; z-index:10; left:80px; right:80px; top:296px; font-family:var(--font-display); color:#2e4538; letter-spacing:-.035em; line-height:.86; }
  .f30-name .r { display:block; font-weight:500; font-size:196px; }
  .f30-name .f { display:block; font-weight:500; font-style:italic; font-size:196px; color:#5a7060; margin-top:6px; }
  /* Portrait square tile — offset lower-right, taped/framed feel */
  .f30-tile { position:absolute; z-index:8; right:80px; bottom:150px; width:420px; padding:16px 16px 60px; background:#f6f2e8;
    box-shadow: 0 40px 80px -28px rgba(46,42,20,.55), 0 6px 14px rgba(46,42,20,.18);
    transform:rotate(-2.5deg); border:1px solid rgba(46,42,20,.1);
  }
  .f30-tile .p { position:relative; width:100%; aspect-ratio:1/1.05; overflow:hidden; background:#0f1a13; }
  .f30-tile .p img { width:100%; height:100%; object-fit:cover; object-position:50% 22%; filter:saturate(.82) contrast(1.1) brightness(.98); }
  .f30-tile .cap { position:absolute; left:16px; right:16px; bottom:18px; font-family:var(--font-mono); font-size:11px; letter-spacing:.44em; text-transform:uppercase; color:#5a7060; text-align:center; }
  /* Bio column, lower-left */
  .f30-col { position:absolute; z-index:10; left:80px; bottom:150px; width:460px; }
  .f30-office { display:inline-flex; align-items:center; padding:14px 20px; background:#2e4538; color:#f6f2e8; font-family:var(--font-mono); font-size:13px; letter-spacing:.34em; text-transform:uppercase; }
  .f30-rule { margin-top:26px; height:2px; width:120px; background:#2e4538; opacity:.55; }
  .f30-bio { margin-top:22px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:28px; line-height:1.32; letter-spacing:-.008em; color:#2e4538; }
  .f30-bio em { font-style:normal; color:#5a7060; }
  /* Left spine — vertical ornamental rule */
  .f30-spine { position:absolute; z-index:6; top:220px; bottom:150px; left:48px; width:1px; background:linear-gradient(180deg, transparent, rgba(46,69,56,.5) 15%, rgba(46,69,56,.5) 85%, transparent); }
  /* Right spine */
  .f30-spine-r { position:absolute; z-index:6; top:220px; bottom:150px; right:48px; width:1px; background:linear-gradient(180deg, transparent, rgba(46,69,56,.5) 15%, rgba(46,69,56,.5) 85%, transparent); }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f30">
      <div class="f30-topline"></div>
      <div class="f30-botline"></div>
      <div class="f30-spine"></div>
      <div class="f30-spine-r"></div>

      <div class="f30-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f30-issue">Running for<em><br/>Oregon House District 28</em></div>

      <div class="f30-kick"><span class="bar"></span></div>

      <h1 class="f30-name">
        <span class="r">Randall</span>
        <span class="f">Fryer</span>
      </h1>

      <div class="f30-tile">
        <div class="p"><img src="../assets/img/randall-fryer.jpg" alt="" /></div>
      </div>

      <div class="f30-col">
        <div class="f30-office">Oregon House District 28</div>
        <div class="f30-rule"></div>
        <p class="f30-bio">Bringing decades of <em>professional experience</em> and a commitment to thoughtful, community-focused leadership.</p>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
