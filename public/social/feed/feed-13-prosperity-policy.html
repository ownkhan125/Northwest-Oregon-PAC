<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 13 · Economic Prosperity &amp; Small Business — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f13 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 8%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 55% at 100% 100%, rgba(107,90,66,.14) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #ece2c8 100%);
  }
  /* Editorial hairline grid */
  .f13-grid { position:absolute; inset:0; z-index:2; opacity:.09; pointer-events:none;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 90px 90px;
  }
  /* Mast + stars */
  .f13-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f13-mast img { height:56px; width:auto; }
  .f13-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Section eyebrow */
  .f13-eyebrow { position:absolute; z-index:10; top:224px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .f13-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f13-eyebrow .n { font-family:var(--font-mono); font-weight:600; }
  /* Section title (from spec — "Economic Prosperity & Small Business") */
  .f13-section { position:absolute; z-index:10; top:266px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-style:italic; font-size:56px; line-height:1; letter-spacing:-.02em; color:#5a7060;
  }
  /* Rule under section */
  .f13-rule { position:absolute; z-index:10; left:96px; top:352px; height:2px; width:200px; background:#2e4538; opacity:.55; }
  /* Big display headline */
  .f13-display { position:absolute; z-index:10; left:96px; right:96px; top:396px;
    font-family:var(--font-display); font-weight:500; font-size:46px; line-height:1.24; letter-spacing:-.015em; color:#2e4538;
    max-width:820px;
  }
  .f13-display em { font-style:italic; font-weight:400; color:#5a7060; }
  /* Photo tile aside — bottom right, well below body text */
  .f13-tile { position:absolute; z-index:7; right:110px; bottom:190px; width:200px; padding:12px 12px 40px; background:#faf3d8;
    box-shadow:0 30px 56px -20px rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.14);
    transform:rotate(3deg);
    border:1px solid rgba(0,0,0,.06);
  }
  .f13-tile .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f13-tile .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.82) contrast(1.08); }
  .f13-tile .cap { position:absolute; left:12px; right:12px; bottom:14px; text-align:center;
    font-family:var(--font-mono); font-size:9.5px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.5);
  }
  /* Footer baseline */
  .f13-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; padding-top:22px; border-top:1.5px solid rgba(46,69,56,.35); }
  .f13-baseline .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.6); }
  .f13-baseline .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f13-baseline .r { display:flex; gap:12px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f13">
      <div class="f13-grid"></div>

      <div class="f13-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f13-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f13-eyebrow"><span class="bar"></span></div>
      <h2 class="f13-section">Economic Prosperity &amp; Small Business</h2>
      <div class="f13-rule"></div>

      <p class="f13-display">We support policies that encourage entrepreneurship, strengthen local businesses, reduce unnecessary barriers, and create an environment where innovation and <em>hard work</em> can thrive across Northwest Oregon.</p>

      <div class="f13-tile">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>

      <div class="f13-baseline">
        <div class="l"><span class="bar"></span></div>
        <div class="r" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
