<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Will this make our communities — Northwest Oregon PAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;background:rgba(255,255,255,1);
    font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:rgba(241,238,228,1);border-radius:6px;"></div>
<img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:88px;width:162px;height:48px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:220px;width:339px;height:37px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Source Sans 3', system-ui, sans-serif;font-size:26px;font-weight:600;color:rgba(78,96,81,1);letter-spacing:0px;line-height:37.02400207519531px;text-align:left;white-space:pre-wrap;font-style:normal;text-transform:none;margin:0">Northwest Oregon comes first.</p></div>
<div style="position:absolute;left:68px;top:467px;width:751px;height:170px;background:rgba(224,214,188,1);"></div>
<div style="position:absolute;left:88px;top:315px;width:936px;height:312px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:62px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0px;line-height:78px;text-align:left;white-space:pre-wrap;font-style:normal;text-transform:none;margin:0">Every decision we make is guided by one question:
Will this make our communities stronger?</p></div>
<div style="position:absolute;left:88px;top:688px;width:414px;height:41px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Source Sans 3', system-ui, sans-serif;font-size:28px;font-weight:400;color:rgba(42,42,38,1);letter-spacing:0px;line-height:41px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">If the answer is yes, we'll fight for it.</p></div>
</div></div>
<script>(function(){var W=1080,H=1350,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
</body>
</html>
