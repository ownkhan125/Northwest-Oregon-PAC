<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 38 · Have a question? Reach the PAC directly. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f38 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 15% 10%, rgba(224,214,188,.9) 0%, transparent 60%),
      radial-gradient(80% 70% at 100% 105%, rgba(107,90,66,.2) 0%, transparent 60%),
      linear-gradient(180deg, #eae0c6 0%, #d4c8a7 100%);
  }
  /* Subtle print grid overlay */
  .f38-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.06;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Cross corner markers (like exhibition poster registration marks) */
  .f38-mark { position:absolute; z-index:6; width:24px; height:24px; }
  .f38-mark::before, .f38-mark::after { content:''; position:absolute; background:#2e4538; }
  .f38-mark::before { left:11px; top:0; width:2px; height:24px; }
  .f38-mark::after  { top:11px; left:0; width:24px; height:2px; }
  .f38-mark.tl { top:56px; left:56px; }
  .f38-mark.tr { top:56px; right:56px; }
  .f38-mark.bl { bottom:56px; left:56px; }
  .f38-mark.br { bottom:56px; right:56px; }
  /* Mast */
  .f38-mast { position:absolute; z-index:12; top:96px; left:120px; }
  .f38-mast img { height:60px; width:auto; }
  /* Seal — hand-drawn SVG official mark */
  .f38-seal { position:absolute; z-index:8; top:96px; right:120px; width:120px; height:120px; }
  .f38-seal svg { width:100%; height:100%; }
  /* Layout: two-column bottom, headline top */
  .f38-head { position:absolute; z-index:10; left:120px; right:120px; top:260px; }
  .f38-eyebrow { display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f38-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f38-title { margin-top:22px; font-family:var(--font-display); font-weight:500; font-size:78px; line-height:.98; letter-spacing:-.028em; color:#2e4538; }
  .f38-title em { font-style:italic; font-weight:400; color:#5a7060; display:block; margin-top:6px; }
  /* Big italic quote glyph as decorative background */
  .f38-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:820px; line-height:.7; color:rgba(46,69,56,.06); left:-40px; bottom:-320px; pointer-events:none; user-select:none; }
  /* Contact grid — two columns */
  .f38-grid-info { position:absolute; z-index:10; left:120px; right:120px; bottom:120px; display:grid; grid-template-columns: 1fr 1fr; gap:36px 60px; padding-top:32px; border-top:2px solid #2e4538; }
  .f38-row { display:flex; flex-direction:column; gap:8px; padding-bottom:16px; border-bottom:1px solid rgba(46,69,56,.2); }
  .f38-row.wide { grid-column:1 / -1; }
  .f38-row .k { display:flex; align-items:center; gap:14px; font-family:var(--font-mono); font-size:13px; letter-spacing:.4em; text-transform:uppercase; color:#6b5a42; }
  .f38-row .k .n { display:inline-block; padding:2px 8px; border:1px solid #6b5a42; font-size:11px; letter-spacing:.3em; }
  .f38-row .v { font-family:var(--font-display); font-weight:500; font-size:30px; letter-spacing:-.008em; color:#2e4538; line-height:1.24; }
  .f38-row .v em { font-style:italic; color:#5a7060; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f38">
      <div class="f38-grid"></div>
      <div class="f38-glyph">&rdquo;</div>

      <span class="f38-mark tl"></span>
      <span class="f38-mark tr"></span>
      <span class="f38-mark bl"></span>
      <span class="f38-mark br"></span>

      <div class="f38-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f38-seal" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="#2e4538" stroke-width="1.4">
          <circle cx="60" cy="60" r="56"/>
          <circle cx="60" cy="60" r="48" opacity=".6"/>
          <circle cx="60" cy="60" r="6" fill="#2e4538"/>
          <path d="M60 8 L62 40 L94 42 L64 60 L92 88 L60 68 L28 90 L56 60 L28 42 L58 40 Z" fill="#2e4538" opacity=".14"/>
          <text x="60" y="12" font-family="Source Sans 3" font-size="6" fill="#2e4538" text-anchor="middle" letter-spacing="2">★</text>
          <text x="60" y="112" font-family="Source Sans 3" font-size="6" fill="#2e4538" text-anchor="middle" letter-spacing="2">★</text>
        </svg>
      </div>

      <div class="f38-head">
        <div class="f38-eyebrow"><span class="bar"></span></div>
        <h1 class="f38-title">Have a question? Reach the PAC<em>directly.</em></h1>
      </div>

      <div class="f38-grid-info">
        <div class="f38-row">
          <div class="k"><span class="n">01</span>General Inquiries</div>
          <div class="v">info@northwestoregon.com</div>
        </div>
        <div class="f38-row">
          <div class="k"><span class="n">02</span>Program Director</div>
          <div class="v"><em>Cynthia Sawyer</em><br/>503-490-4139</div>
        </div>
        <div class="f38-row wide">
          <div class="k"><span class="n">03</span>Mailing Address</div>
          <div class="v">10700 SW Beaverton-Hillsdale Highway, Suite 212, Beaverton, Oregon 97005</div>
        </div>
        <div class="f38-row wide" style="border-bottom:none;">
          <div class="k"><span class="n">04</span>Region</div>
          <div class="v"><em>Northwest Oregon</em> · Pacific Time</div>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
