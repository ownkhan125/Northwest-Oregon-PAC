<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 20 · Northwest Oregon deserves more than campaign promises. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f20 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Off-set full-bleed photo — takes right 60% */
  .f20-bg { position:absolute; z-index:1; top:0; bottom:0; left:0; right:0; }
  .f20-bg img { position:absolute; right:-6%; top:0; width:92%; height:100%; object-fit:cover; object-position:50% 55%; filter:saturate(.55) contrast(1.32) brightness(.4); }
  .f20-bg::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(6,10,7,.98) 0%, rgba(6,10,7,.85) 22%, rgba(20,30,22,.55) 42%, rgba(20,30,22,.2) 62%, rgba(6,10,7,.85) 100%),
      radial-gradient(40% 30% at 15% 20%, rgba(90,112,96,.28) 0%, transparent 65%);
  }
  /* Fine editorial scanlines */
  .f20-scan { position:absolute; z-index:2; inset:0; opacity:.06; pointer-events:none;
    background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(0,0,0,.5) 4px 5px);
    mix-blend-mode:multiply;
  }
  /* Mast + stars */
  .f20-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f20-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f20-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker */
  .f20-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); }
  .f20-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Giant italic opening quote in background */
  .f20-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:820px; line-height:.66; color:rgba(90,112,96,.16); left:-20px; top:280px; pointer-events:none; user-select:none; }
  /* Left column headline — big cinematic serif */
  .f20-head { position:absolute; z-index:10; left:96px; right:96px; top:340px;
    font-family:var(--font-display); font-weight:500; font-size:98px; line-height:.98; letter-spacing:-.03em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.7); max-width:920px;
  }
  /* Separator with tag */
  .f20-sep { position:absolute; z-index:10; left:96px; top:698px; display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f20-sep .bar { width:64px; height:1px; background:currentColor; opacity:.7; }
  /* Italic pull-quote below */
  .f20-pull { position:absolute; z-index:10; left:96px; right:96px; top:750px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:54px; line-height:1.1; letter-spacing:-.018em;
    color:#e0d6bc; max-width:900px; text-shadow: 0 4px 24px rgba(0,0,0,.6);
  }
  /* Bottom detail bar */
  .f20-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f20-baseline .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f20-baseline .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f20-baseline .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f20">
      <div class="f20-bg"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f20-scan"></div>
      <div class="f20-glyph">&ldquo;</div>

      <div class="f20-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f20-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f20-kick"><span class="bar"></span></div>
      <h1 class="f20-head">Northwest Oregon deserves more than campaign promises.</h1>
      <div class="f20-sep"><span class="bar"></span></div>
      <p class="f20-pull">It deserves people willing to stay after Election Day.</p>

      <div class="f20-baseline">
        <div class="l"><span class="bar"></span></div>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
