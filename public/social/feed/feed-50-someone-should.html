<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 50 · Someone should do something. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f50 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 8% 8%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 55% at 100% 100%, rgba(107,90,66,.14) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #ede4cf 100%);
  }
  /* Vertical faint rules — editorial baseline grid */
  .f50-rules { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.09;
    background-image: linear-gradient(90deg, #2e4538 1px, transparent 1px);
    background-size: 90px 100%;
  }
  /* Mast */
  .f50-mast { position:absolute; z-index:12; top:96px; left:96px; }
  .f50-mast img { height:56px; width:auto; }
  .f50-star { position:absolute; z-index:12; top:112px; right:96px; display:flex; gap:12px; opacity:.55; }
  /* Eyebrow — mono LEADERSHIP */
  .f50-eyebrow { position:absolute; z-index:10; top:250px; left:96px; right:96px;
    padding-bottom:22px; border-bottom:2px solid #2e4538;
    display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:15px; letter-spacing:.6em; text-transform:uppercase; color:#2e4538;
  }
  .f50-eyebrow .bar { flex:1; height:1px; background:currentColor; opacity:.45; margin:0 22px; }
  /* Big italic serif quote */
  .f50-quote { position:absolute; z-index:10; left:96px; right:96px; top:370px;
    font-family:var(--font-display); font-weight:500; font-size:70px; line-height:1.06; letter-spacing:-.022em; color:#2e4538;
  }
  .f50-quote em { font-style:italic; font-weight:400; color:#5a7060; }
  .f50-quote .oq, .f50-quote .cq { font-family:var(--font-display); font-style:italic; color:rgba(46,69,56,.35); }
  /* Attribution dash */
  .f50-attrib { position:absolute; z-index:10; left:96px; right:96px; top:calc(370px + 460px);
    display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .f50-attrib .bar { width:80px; height:2px; background:#5a7060; opacity:.6; }
  /* CTA — mono text (NOT a button) at bottom */
  .f50-cta { position:absolute; z-index:10; left:96px; right:96px; bottom:96px;
    padding-top:26px; border-top:1px solid rgba(46,69,56,.35);
    display:flex; align-items:center; justify-content:space-between;
  }
  .f50-cta .lbl {
    font-family:var(--font-mono); font-weight:600; font-size:22px; letter-spacing:.55em; text-transform:uppercase; color:#2e4538;
  }
  .f50-cta .lbl::before { content:''; display:inline-block; width:44px; height:2px; background:#2e4538; vertical-align:middle; margin-right:22px; }
  .f50-cta .arrow svg { display:block; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f50">
      <div class="f50-rules"></div>

      <div class="f50-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f50-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f50-eyebrow">
        <span>LEADERSHIP</span>
        <span class="bar"></span>
        <span aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </span>
      </div>

      <p class="f50-quote">The person saying, <em>&ldquo;Someone should do something&rdquo;</em> might be the person who should run.</p>

      <div class="f50-cta">
        <span class="lbl">START THE CONVERSATION</span>
        <span class="arrow" aria-hidden="true">
          <svg width="80" height="14" viewBox="0 0 80 14" fill="none" stroke="#2e4538" stroke-width="1.4"><path d="M0 7 L68 7"/><path d="M62 2 L72 7 L62 12"/></svg>
        </span>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
