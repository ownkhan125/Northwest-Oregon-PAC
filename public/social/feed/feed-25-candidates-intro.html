<style>
  .f25 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 8% 12%, rgba(90,112,96,.4) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(24,34,27,.9) 0%, transparent 60%),
      linear-gradient(178deg, #1c2b23 0%, #0c1712 100%);
  }
  /* Hatch */
  .f25-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Mast + stars */
  .f25-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f25-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f25-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }
  /* Kicker — issue-style */
  .f25-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f25-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big serif title */
  .f25-h1 { position:absolute; z-index:10; left:96px; right:96px; top:280px;
    font-family:var(--font-display); font-weight:500; font-size:88px; line-height:.98; letter-spacing:-.028em; color:#f6f2e8;
    max-width:900px;
  }
  .f25-h1 em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Portrait collage — layered tiles */
  .f25-collage { position:absolute; z-index:6; left:96px; right:96px; top:540px; height:280px; }
  .f25-portrait { position:absolute; width:150px; padding:8px 8px 32px; background:#faf3d8;
    box-shadow:0 30px 56px -20px rgba(0,0,0,.5), 0 4px 10px rgba(0,0,0,.3);
    border:1px solid rgba(0,0,0,.08);
  }
  .f25-portrait .p { position:relative; width:100%; aspect-ratio:1/1.15; overflow:hidden; background:#0f1a13; }
  .f25-portrait .p img { width:100%; height:100%; object-fit:cover; object-position:50% 20%; filter:saturate(.88) contrast(1.06); }
  .f25-portrait .cap { position:absolute; left:6px; right:6px; bottom:8px; text-align:center;
    font-family:var(--font-mono); font-size:8px; letter-spacing:.34em; text-transform:uppercase; color:rgba(46,42,20,.55);
  }
  .f25-portrait.p1 { left:0; top:0; transform:rotate(-6deg); z-index:5; }
  .f25-portrait.p2 { left:170px; top:20px; transform:rotate(3deg); z-index:6; }
  .f25-portrait.p3 { left:340px; top:-10px; transform:rotate(-3deg); z-index:5; }
  .f25-portrait.p4 { left:510px; top:24px; transform:rotate(5deg); z-index:6; }
  .f25-portrait.p5 { left:680px; top:-6px; transform:rotate(-4deg); z-index:5; }
  /* Divider before body */
  .f25-rule { position:absolute; z-index:10; left:96px; right:96px; top:844px; height:1.5px; background:rgba(224,214,188,.4); }
  /* Body paragraph */
  .f25-body { position:absolute; z-index:10; left:96px; right:96px; top:872px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:24px; line-height:1.34; letter-spacing:-.008em; color:#e0d6bc;
    max-width:920px;
  }
  /* This element is the sub-headline before the paragraph — pull it out */
  /* Baseline */
  .f25-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
  .f25-baseline .stars { display:flex; gap:12px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f25">
      <div class="f25-hatch"></div>

      <div class="f25-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f25-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>

        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f25-kick"><span class="bar"></span></div>

      <h1 class="f25-h1">Candidates standing up for <em>Northwest Oregon.</em></h1>

      <div class="f25-collage" aria-hidden="true">
        <div class="f25-portrait p1"><div class="p"><img src="../assets/img/mark-norman.jpg" alt="" /></div></div>
        <div class="f25-portrait p2"><div class="p"><img src="../assets/img/brian-schimmel.jpg" alt="" /></div></div>
        <div class="f25-portrait p3"><div class="p"><img src="../assets/img/barbara-kahl.jpg" alt="" /></div></div>
        <div class="f25-portrait p4"><div class="p"><img src="../assets/img/ciatta-thompson.jpg" alt="" /></div></div>
        <div class="f25-portrait p5"><div class="p"><img src="../assets/img/randall-fryer.jpg" alt="" /></div></div>
      </div>

      <div class="f25-rule"></div>

      <p class="f25-body">This election, we're supporting candidates who are prepared to listen, serve, and work for the communities they represent, not just during campaign season, but long after Election Day.</p>

      <div class="f25-baseline">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
