<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 47 · Every voter deserves a real choice. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f47 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(80% 65% at 100% 100%, rgba(90,112,96,.4) 0%, transparent 60%),
      radial-gradient(80% 65% at 0% 0%, rgba(107,90,66,.3) 0%, transparent 55%),
      linear-gradient(178deg, #2e4538 0%, #1a2820 100%);
    color:#f6f2e8;
  }
  /* Fine blueprint grid */
  .f47-grid { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.08;
    background-image:
      linear-gradient(90deg, #f6f2e8 1px, transparent 1px),
      linear-gradient(180deg, #f6f2e8 1px, transparent 1px);
    background-size: 90px 90px;
  }
  /* Giant italic closing quote glyph — bottom-right */
  .f47-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:1200px; line-height:.7; color:rgba(224,214,188,.09);
    right:-160px; bottom:-360px; pointer-events:none; user-select:none;
  }
  /* Mast */
  .f47-mast { position:absolute; z-index:12; top:96px; left:96px; }
  .f47-mast img { height:56px; width:auto; filter:brightness(1.05); }
  .f47-star { position:absolute; z-index:12; top:112px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Editorial rules */
  .f47-toprule { position:absolute; z-index:8; top:240px; left:96px; right:96px; height:1px; background:rgba(246,242,232,.35); }
  /* Composition: text is centered vertically with rule accents */
  .f47-quote { position:absolute; z-index:10; left:96px; right:400px; top:50%; transform:translateY(-52%);
    font-family:var(--font-display); font-weight:500; font-size:74px; line-height:1.06; letter-spacing:-.022em; color:#f6f2e8;
  }
  .f47-quote em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .f47-quote .pre { display:block; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); margin-bottom:34px; }
  .f47-quote .pre::before { content:''; display:inline-block; width:52px; height:1px; background:currentColor; vertical-align:middle; margin-right:18px; opacity:.7; }
  /* Foot */
  .f47-foot { position:absolute; z-index:12; left:96px; right:96px; bottom:96px;
    padding-top:22px; border-top:1px solid rgba(246,242,232,.28);
    display:flex; align-items:center; justify-content:space-between;
  }
  .f47-foot .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f47">
      <div class="f47-grid"></div>
      <div class="f47-glyph" aria-hidden="true">&rdquo;</div>

      <div class="f47-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f47-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f47-toprule"></div>

      <p class="f47-quote"><span class="pre"></span>Every voter deserves a <em>real choice,</em> not a race decided before the first ballot is cast.</p>

      <div class="f47-foot">
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
        <div aria-hidden="true">
          <svg width="60" height="10" viewBox="0 0 60 10" fill="none" stroke="#e0d6bc" stroke-width="1"><path d="M0 5 L50 5"/><path d="M46 1 L54 5 L46 9"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
