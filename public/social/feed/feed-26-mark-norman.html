<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 26 · The candidate. Mark Norman. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f26 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Full-bleed portrait */
  .f26-portrait { position:absolute; z-index:1; inset:0; }
  .f26-portrait img { width:100%; height:100%; object-fit:cover; object-position:52% 22%; filter:saturate(.7) contrast(1.24) brightness(.72); }
  /* Cinematic grade layer 1: warm side vignette + darkening bottom */
  .f26-grade { position:absolute; z-index:2; inset:0;
    background:
      radial-gradient(80% 65% at 25% 20%, rgba(90,112,96,.28) 0%, transparent 60%),
      linear-gradient(180deg, rgba(20,30,22,.35) 0%, rgba(20,30,22,.05) 30%, rgba(10,16,12,.85) 78%, rgba(6,10,7,.98) 100%);
  }
  /* Bottom hairline rule */
  .f26-hairline { position:absolute; z-index:6; left:96px; right:96px; bottom:620px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.55), rgba(224,214,188,0)); }
  /* Right-side vertical rule */
  .f26-spine { position:absolute; z-index:6; top:96px; bottom:96px; right:56px; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.35) 30%, rgba(224,214,188,.35) 70%, rgba(224,214,188,0)); }
  /* Mast */
  .f26-mast { position:absolute; z-index:12; top:64px; left:96px; }
  .f26-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Star field top-right */
  .f26-stars { position:absolute; z-index:8; top:96px; right:96px; display:grid; grid-template-columns:repeat(5,10px); gap:12px; opacity:.65; }
  /* Office kicker */
  .f26-kicker { position:absolute; z-index:10; left:96px; bottom:530px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:16px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.85); }
  .f26-kicker .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Two-line poster name */
  .f26-name { position:absolute; z-index:10; left:96px; right:96px; bottom:280px; font-family:var(--font-display); color:#f6f2e8; letter-spacing:-.03em; }
  .f26-name .the { display:block; font-size:56px; font-style:italic; font-weight:400; color:#e0d6bc; letter-spacing:-.02em; margin-bottom:12px; text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .f26-name .name { display:block; font-weight:500; font-size:184px; line-height:.9; letter-spacing:-.038em; text-shadow:0 8px 40px rgba(0,0,0,.7); }
  .f26-name .name em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Bio pull quote */
  .f26-bio { position:absolute; z-index:10; left:96px; right:520px; bottom:110px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:26px; line-height:1.34; letter-spacing:-.01em; color:rgba(246,242,232,.92); text-shadow:0 2px 14px rgba(0,0,0,.7); padding-top:22px; border-top:1px solid rgba(224,214,188,.35); }
  /* Signature stamp right */
  .f26-stamp { position:absolute; z-index:10; right:96px; bottom:120px; width:170px; padding:16px 18px 18px; border:1.5px solid rgba(224,214,188,.55); text-align:center; color:#e0d6bc; font-family:var(--font-mono); letter-spacing:.32em; text-transform:uppercase; }
  .f26-stamp .cy { display:block; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:60px; letter-spacing:-.03em; text-transform:none; color:#f6f2e8; margin-bottom:6px; line-height:1; }
  .f26-stamp .lbl { display:block; font-size:11px; letter-spacing:.44em; opacity:.85; }
  /* Ghost numeral */
  .f26-num { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:900px; line-height:.78; color:rgba(224,214,188,.07); left:-80px; top:80px; pointer-events:none; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f26">
      <div class="f26-portrait"><img src="../assets/img/mark-norman.jpg" alt="" /></div>
      <div class="f26-grade"></div>

      <div class="f26-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f26-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f26-hairline"></div>
      <div class="f26-spine"></div>

      <div class="f26-kicker"><span class="bar"></span>Oregon House District 27</div>

      <div class="f26-name">
        <span class="the">The candidate.</span>
        <span class="name"><em>Mark Norman.</em></span>
      </div>

      <p class="f26-bio">From military service to caring for animals and serving his community, Mark Norman has built a career around helping others, and now he's ready to bring that same commitment to Salem.</p>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
