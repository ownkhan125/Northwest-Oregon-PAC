<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 21 · Affordable energy — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f21 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 15% 8%, rgba(90,112,96,.4) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(24,34,27,.9) 0%, transparent 60%),
      linear-gradient(178deg, #2a3d33 0%, #1a2820 60%, #0f1913 100%);
  }
  /* Fine blueprint grid overlay */
  .f21-grid { position:absolute; inset:0; z-index:2; opacity:.06; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Mast + stars */
  .f21-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f21-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f21-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker */
  .f21-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f21-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big energy icon lockup — top right */
  .f21-icon { position:absolute; z-index:6; right:96px; top:280px; width:180px; height:180px; display:flex; align-items:center; justify-content:center;
    border:1.5px solid rgba(224,214,188,.35); border-radius:50%; background:rgba(224,214,188,.05);
  }
  .f21-icon svg { width:96px; height:96px; color:#e0d6bc; }
  /* Block A — big headline */
  .f21-block-a { position:absolute; z-index:10; left:96px; right:340px; top:310px;
    font-family:var(--font-display); font-weight:500; font-size:64px; line-height:1.08; letter-spacing:-.025em; color:#f6f2e8;
  }
  .f21-block-a em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Divider rule with metric detail */
  .f21-divider { position:absolute; z-index:10; left:96px; right:96px; top:730px; display:flex; align-items:center; gap:22px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
  .f21-divider .line { flex:1; height:1px; background:rgba(224,214,188,.35); }
  /* Block B — italic pull statement */
  .f21-block-b { position:absolute; z-index:10; left:96px; right:96px; top:790px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:52px; line-height:1.14; letter-spacing:-.018em; color:#e0d6bc;
  }
  /* Baseline */
  .f21-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
  .f21-baseline .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f21">
      <div class="f21-grid"></div>

      <div class="f21-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f21-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f21-kick"><span class="bar"></span></div>

      <div class="f21-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
          <path d="M13 2 L4 14 h7 L10 22 L20 10 h-7 z"/>
        </svg>
      </div>

      <p class="f21-block-a">Affordable energy isn't just an economic issue. It's a family issue. When utility bills rise, <em>every household feels it.</em></p>

      <div class="f21-divider"><span class="line"></span></div>

      <p class="f21-block-b">Oregon can protect both affordability and reliability.</p>

      <div class="f21-baseline">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
