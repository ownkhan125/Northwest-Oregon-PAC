<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 54 · Northwest Oregon deserves to compete. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Bold poster: forest ground, headline top, 3 stacked dash-bullets */
  .f54 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 20% 100%, rgba(90,112,96,.4) 0%, transparent 60%),
      radial-gradient(60% 55% at 100% 0%, rgba(24,34,27,.85) 0%, transparent 55%),
      linear-gradient(178deg, #223528 0%, #14201a 100%);
  }
  /* Photo band bottom-right — small, tightly bounded */
  .f54-band { position:absolute; z-index:2; right:0; bottom:0; width:100%; height:38%; overflow:hidden; opacity:.35;
    -webkit-mask-image: linear-gradient(180deg, transparent, black 40%, black);
            mask-image: linear-gradient(180deg, transparent, black 40%, black);
  }
  .f54-band img { width:100%; height:100%; object-fit:cover; object-position:center 60%; filter:saturate(.55) contrast(1.14) brightness(.5); }

  .f54-hatch { position:absolute; inset:0; z-index:3; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(45deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(-45deg, #e0d6bc 1px, transparent 1px);
    background-size:36px 36px;
  }

  /* Mast */
  .f54-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f54-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }

  /* Corner brackets */
  .f54-br { position:absolute; z-index:8; width:36px; height:36px; border-color:rgba(224,214,188,.5); }
  .f54-br.tr { top:96px; right:96px; border-top:2px solid; border-right:2px solid; }
  .f54-br.bl { bottom:96px; left:96px; border-bottom:2px solid; border-left:2px solid; }

  /* Eyebrow */
  .f54-eyebrow { position:absolute; z-index:10; top:240px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.65); font-weight:600;
  }
  .f54-eyebrow .bar { width:60px; height:1px; background:currentColor; opacity:.7; }

  /* Big headline */
  .f54-head { position:absolute; z-index:10; top:290px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:96px; line-height:.98; letter-spacing:-.032em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  .f54-head em { display:block; font-style:italic; font-weight:400; color:#e0d6bc; }

  /* Divider under headline */
  .f54-div { position:absolute; z-index:10; left:96px; top:678px; width:180px; height:3px; background:#e0d6bc; }

  /* Dash bullets */
  .f54-bullets { position:absolute; z-index:10; left:96px; right:96px; top:720px; display:flex; flex-direction:column; gap:20px; }
  .f54-bullet {
    display:flex; align-items:baseline; gap:24px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:44px; line-height:1.05; letter-spacing:-.02em; color:#f6f2e8;
  }
  .f54-bullet .dash {
    flex:none; display:inline-block; width:48px; height:5px; background:#e0d6bc; align-self:center; transform:translateY(-2px);
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }

  /* Bottom baseline */
  .f54-baseline { position:absolute; z-index:10; bottom:96px; left:180px; right:150px; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f54">
      <div class="f54-band"><img src="../assets/img/bridge.png" alt="" /></div>
      <div class="f54-hatch"></div>

      <div class="f54-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f54-br tr"></div>
      <div class="f54-br bl"></div>

      <div class="f54-eyebrow"><span class="bar"></span></div>

      <h1 class="f54-head">Northwest Oregon<em>deserves to compete.</em></h1>

      <div class="f54-div"></div>

      <div class="f54-bullets">
        <div class="f54-bullet"><span class="dash"></span>Every district.</div>
        <div class="f54-bullet"><span class="dash"></span>Every voter.</div>
        <div class="f54-bullet"><span class="dash"></span>Every election.</div>
      </div>

      <div class="f54-baseline">
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
