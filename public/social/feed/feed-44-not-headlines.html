<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 44 · We don't measure success by headlines. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f44 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 15% 10%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(107,90,66,.14) 0%, transparent 55%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Fine editorial dot grid */
  .f44-grid { position:absolute; inset:0; z-index:2; opacity:.08; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 22px 22px;
  }
  /* Huge italic quote glyph as background art */
  .f44-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:1080px; line-height:.66; color:rgba(90,112,96,.16);
    left:-90px; top:-160px; pointer-events:none; user-select:none;
  }
  /* Small photo tile — editorial aside */
  .f44-tile { position:absolute; z-index:6; right:96px; top:170px; width:210px; padding:12px 12px 42px; background:#f6f2e8;
    box-shadow:0 30px 56px -20px rgba(0,0,0,.35), 0 6px 12px rgba(0,0,0,.14);
    transform:rotate(-3deg);
    border:1px solid rgba(0,0,0,.06);
  }
  .f44-tile .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f44-tile .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.72) contrast(1.14) brightness(.92); }
  .f44-tile .cap { position:absolute; left:14px; right:14px; bottom:12px; text-align:center; font-family:var(--font-mono); font-size:10px; letter-spacing:.4em; text-transform:uppercase; color:rgba(46,42,20,.55); }
  /* Mast */
  .f44-mast { position:absolute; z-index:12; top:96px; left:96px; }
  .f44-mast img { height:60px; width:auto; }
  /* Column rule */
  .f44-rule { position:absolute; z-index:6; left:96px; top:230px; height:2px; width:180px; background:#2e4538; opacity:.6; }
  .f44-issue { position:absolute; z-index:6; left:96px; top:250px; display:flex; align-items:center; gap:18px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6); }
  /* Body — two-part typography */
  .f44-body { position:absolute; z-index:10; left:96px; right:96px; top:350px; }
  .f44-p1 { font-family:var(--font-display); font-weight:500; font-size:96px; line-height:.98; letter-spacing:-.03em; color:#2e4538; }
  .f44-p2 { margin-top:34px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:56px; line-height:1.12; letter-spacing:-.015em; color:#5a7060; max-width:900px; padding-top:34px; border-top:1px solid rgba(46,69,56,.35); position:relative; }
  .f44-p2::before { content:''; position:absolute; left:0; top:-2px; width:120px; height:3px; background:#2e4538; }
  /* Bottom badge signature */
  .f44-sig { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f44-sig .left { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:#5a7060; }
  .f44-sig .left .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f44-sig .right { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:44px; color:#2e4538; letter-spacing:-.02em; line-height:1; }
  .f44-sig .num { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:96px; color:rgba(46,69,56,.18); letter-spacing:-.02em; line-height:.8; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f44">
      <div class="f44-grid"></div>
      <div class="f44-glyph">&ldquo;</div>

      <div class="f44-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f44-tile">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>

      <div class="f44-rule"></div>

      <div class="f44-body">
        <p class="f44-p1">We don't measure success by headlines.</p>
        <p class="f44-p2">We measure it by stronger communities, better candidates, and more engaged citizens.</p>
      </div>

      <div class="f44-sig">
        <div class="left"><span class="bar"></span></div>
        <div class="right" aria-hidden="true">
          <svg width="60" height="14" viewBox="0 0 60 14" fill="none" stroke="#2e4538" stroke-width="1.2">
            <path d="M0 7 L44 7"/>
            <path d="M40 2 L52 7 L40 12"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
