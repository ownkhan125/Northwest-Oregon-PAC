<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 11 · Responsible government starts with responsible stewardship. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f11 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 10%, rgba(90,112,96,.42) 0%, transparent 60%),
      radial-gradient(80% 60% at 100% 100%, rgba(20,30,22,.5) 0%, transparent 60%),
      linear-gradient(180deg, #263a2e 0%, #131e17 100%);
  }
  /* Blueprint grid overlay */
  .f11-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.11;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Mast + stars */
  .f11-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f11-mast img { height:60px; width:auto; }
  .f11-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.65; }
  /* Roman numeral II top center */
  .f11-num { position:absolute; z-index:8; top:220px; left:50%; transform:translateX(-50%);
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:96px; line-height:1;
    color:rgba(224,214,188,.55); letter-spacing:-.02em;
  }
  /* Top rule spanning full width */
  .f11-toprule { position:absolute; z-index:6; top:355px; left:96px; right:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.1) 0%, rgba(224,214,188,.55) 20%, rgba(224,214,188,.55) 80%, rgba(224,214,188,.1) 100%); }
  /* Large centered headline statement */
  .f11-head { position:absolute; z-index:10; left:96px; right:96px; top:410px;
    font-family:var(--font-display); font-weight:500; font-size:82px; line-height:1.02; letter-spacing:-.028em; color:#f6f2e8;
    text-shadow: 0 6px 32px rgba(0,0,0,.55);
  }
  .f11-head em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Middle divider — hairline + centered star */
  .f11-mid { position:absolute; z-index:8; left:96px; right:96px; top:720px; display:flex; align-items:center; gap:20px; }
  .f11-mid .l, .f11-mid .r { flex:1; height:1px; background:linear-gradient(90deg, rgba(224,214,188,0), rgba(224,214,188,.5) 40%, rgba(224,214,188,.5) 60%, rgba(224,214,188,0)); }
  .f11-mid .star { flex:none; opacity:.7; }
  /* Sub-statement below */
  .f11-sub { position:absolute; z-index:10; left:96px; right:96px; top:770px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:36px; line-height:1.22; letter-spacing:-.014em; color:#e0d6bc;
    max-width:920px; text-shadow: 0 4px 22px rgba(0,0,0,.55);
  }
  /* Baseline signature */
  .f11-base { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; padding-top:22px; border-top:1px solid rgba(224,214,188,.35);
    display:flex; align-items:center; justify-content:space-between;
  }
  .f11-base .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.6); }
  .f11-base .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f11-base .r { display:flex; gap:8px; opacity:.55; }
  /* Corner registration marks */
  .f11-reg { position:absolute; z-index:6; width:34px; height:34px; }
  .f11-reg::before, .f11-reg::after { content:''; position:absolute; background:rgba(224,214,188,.4); }
  .f11-reg::before { left:16px; top:0; width:2px; height:34px; }
  .f11-reg::after  { top:16px; left:0; width:34px; height:2px; }
  .f11-reg.tl { top:200px; left:96px; }
  .f11-reg.tr { top:200px; right:96px; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f11">
      <div class="f11-grid"></div>

      <span class="f11-reg tl"></span>
      <span class="f11-reg tr"></span>

      <div class="f11-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f11-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f11-num" aria-hidden="true">II</div>
      <div class="f11-toprule"></div>

      <h1 class="f11-head">Responsible government starts with <em>responsible stewardship.</em></h1>

      <div class="f11-mid">
        <span class="l"></span>
        <span class="star" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </span>
        <span class="r"></span>
      </div>

      <p class="f11-sub">Every taxpayer deserves transparency, measurable results, and confidence that public dollars are being spent wisely.</p>

      <div class="f11-base">
        <div class="l"><span class="bar"></span></div>
        <div class="r" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
