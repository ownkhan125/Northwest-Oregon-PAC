<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 56 · We are building beyond Election Day. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Documentary poster w/ blueprint grid + 2x2 tile grid of items */
  .f56 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 8%, rgba(90,112,96,.5) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(24,34,27,.9) 0%, transparent 55%),
      linear-gradient(178deg, #2e4538 0%, #1a2820 60%, #131e17 100%);
  }
  .f56-blueprint { position:absolute; inset:0; z-index:2; opacity:.11; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size:60px 60px;
  }

  /* Mast */
  .f56-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f56-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }

  /* Registration + and dossier tag right */
  .f56-tag { position:absolute; z-index:14; top:112px; right:96px; display:flex; align-items:center; gap:14px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65);
  }
  .f56-tag .plus { font-size:20px; color:rgba(224,214,188,.55); }

  /* Eyebrow */
  .f56-eyebrow { position:absolute; z-index:10; top:242px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); font-weight:600;
  }
  .f56-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }

  /* Headline */
  .f56-head { position:absolute; z-index:10; top:284px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:88px; line-height:.96; letter-spacing:-.032em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.4);
  }
  .f56-head em { font-style:italic; font-weight:400; color:#e0d6bc; }

  /* Rule + short body */
  .f56-rule { position:absolute; z-index:10; left:96px; top:520px; width:140px; height:2px; background:rgba(224,214,188,.6); }

  /* Tile grid — 2x2, filling bottom */
  .f56-grid { position:absolute; z-index:10; left:96px; right:96px; bottom:170px; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:22px; }
  .f56-tile {
    position:relative;
    padding:34px 34px;
    border:1px solid rgba(224,214,188,.28);
    background:rgba(224,214,188,.045);
    border-radius:10px;
    display:flex; flex-direction:column; justify-content:space-between; gap:24px;
    min-height:130px;
  }
  .f56-tile .n {
    font-family:var(--font-mono); font-size:12px; letter-spacing:.4em; text-transform:uppercase; color:rgba(224,214,188,.55); font-weight:700;
  }
  .f56-tile .lbl {
    font-family:var(--font-display); font-weight:500; font-size:38px; line-height:1.08; letter-spacing:-.02em; color:#f6f2e8;
  }
  .f56-tile.hi { background:rgba(224,214,188,.08); border-color:rgba(224,214,188,.42); }
  .f56-tile.hi .lbl { font-style:italic; color:#e0d6bc; }
  .f56-tile .corner { position:absolute; top:14px; right:14px; width:18px; height:18px; }
  .f56-tile .corner::before, .f56-tile .corner::after { content:''; position:absolute; background:rgba(224,214,188,.35); }
  .f56-tile .corner::before { top:0; right:0; width:10px; height:1px; }
  .f56-tile .corner::after { top:0; right:0; width:1px; height:10px; }

  /* Bottom baseline */
  .f56-baseline { position:absolute; z-index:10; bottom:96px; left:96px; right:96px; display:flex; justify-content:space-between;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f56">
      <div class="f56-blueprint"></div>

      <div class="f56-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f56-tag"><span class="plus">+</span></div>

      <div class="f56-eyebrow"><span class="bar"></span></div>

      <h1 class="f56-head">We are building <em>beyond Election Day.</em></h1>

      <div class="f56-rule"></div>

      <div class="f56-grid">
        <div class="f56-tile hi">
          <div class="corner"></div>
          <div class="n">01</div>
          <div class="lbl">More candidates.</div>
        </div>
        <div class="f56-tile">
          <div class="corner"></div>
          <div class="n">02</div>
          <div class="lbl">More campaign support</div>
        </div>
        <div class="f56-tile">
          <div class="corner"></div>
          <div class="n">03</div>
          <div class="lbl">Stronger campaigns.</div>
        </div>
        <div class="f56-tile hi">
          <div class="corner"></div>
          <div class="n">04</div>
          <div class="lbl">A lasting regional voice.</div>
        </div>
      </div>

      <div class="f56-baseline">
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
