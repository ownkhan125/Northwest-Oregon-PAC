<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 46 · Raised here. Invested here. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f46 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#eae0c6; }
  /* Diptych — top half sand w/ photo, bottom half forest */
  .f46-top { position:absolute; z-index:2; top:0; left:0; right:0; height:50%; overflow:hidden;
    background:linear-gradient(180deg, #f0e7cf 0%, #e0d6bc 100%);
  }
  .f46-top .p { position:absolute; z-index:2; inset:0; }
  .f46-top .p img { width:100%; height:100%; object-fit:cover; object-position:50% 60%;
    filter:saturate(.72) contrast(1.14) brightness(.86);
    opacity:.75; mix-blend-mode:multiply;
  }
  .f46-top::after { content:''; position:absolute; z-index:3; inset:0;
    background:
      linear-gradient(180deg, rgba(240,231,207,.4) 0%, rgba(240,231,207,.1) 40%, rgba(240,231,207,.9) 100%);
  }
  .f46-bot { position:absolute; z-index:2; top:50%; left:0; right:0; bottom:0; overflow:hidden;
    background:
      radial-gradient(90% 80% at 50% 100%, rgba(90,112,96,.35) 0%, transparent 60%),
      linear-gradient(180deg, #2e4538 0%, #1c2b23 100%);
  }
  .f46-bot .p { position:absolute; z-index:2; inset:0; }
  .f46-bot .p img { width:100%; height:100%; object-fit:cover; object-position:50% 40%;
    filter:saturate(.55) contrast(1.2) brightness(.5);
    opacity:.45;
  }
  .f46-bot::after { content:''; position:absolute; z-index:3; inset:0;
    background:linear-gradient(180deg, rgba(15,26,19,.6) 0%, rgba(15,26,19,.2) 40%, rgba(15,26,19,.8) 100%);
  }
  /* Center horizontal seam w/ registration diamond */
  .f46-seam { position:absolute; z-index:8; left:0; right:0; top:50%; height:1px; background:rgba(46,69,56,.55); }
  .f46-seam::before { content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); width:16px; height:16px; background:#eae0c6; border:1.5px solid #2e4538; }
  /* Mast — top left over top panel */
  .f46-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f46-mast img { height:56px; width:auto; }
  /* Bottom mast — logo light echo */
  .f46-star { position:absolute; z-index:14; top:112px; right:96px; display:flex; gap:12px; opacity:.55; }
  /* Panel titles — mirrored composition */
  .f46-panel-top { position:absolute; z-index:10; left:96px; right:96px; top:230px; height:calc(50% - 260px); display:flex; flex-direction:column; justify-content:center; }
  .f46-panel-bot { position:absolute; z-index:10; left:96px; right:96px; top:calc(50% + 30px); bottom:180px; display:flex; flex-direction:column; justify-content:center; }
  .f46-kick { display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; }
  .f46-panel-top .f46-kick { color:#5a7060; }
  .f46-panel-bot .f46-kick { color:#e0d6bc; }
  .f46-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f46-word { margin-top:26px;
    font-family:var(--font-display); font-weight:500; font-size:140px; line-height:.92; letter-spacing:-.04em;
  }
  .f46-panel-top .f46-word { color:#2e4538; }
  .f46-panel-bot .f46-word { color:#f6f2e8; font-style:italic; font-weight:400; }
  /* Sub paragraph — centered under seam over bottom panel */
  .f46-sub { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; padding-top:22px; border-top:1px solid rgba(246,242,232,.35);
    font-family:var(--font-display); font-weight:500; font-size:30px; line-height:1.28; letter-spacing:-.008em; color:#f6f2e8;
    max-width:820px;
  }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f46">
      <div class="f46-top">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>
      <div class="f46-bot">
        <div class="p"><img src="../assets/img/campaign.jpg" alt="" /></div>
      </div>
      <div class="f46-seam"></div>

      <div class="f46-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f46-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f46-panel-top">
        <div class="f46-kick"><span class="bar"></span></div>
        <div class="f46-word">Raised here.</div>
      </div>

      <div class="f46-panel-bot">
        <div class="f46-kick"><span class="bar"></span></div>
        <div class="f46-word">Invested here.</div>
      </div>

      <p class="f46-sub">Local contributions help Northwest Oregon candidates organize, communicate, and compete.</p>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
