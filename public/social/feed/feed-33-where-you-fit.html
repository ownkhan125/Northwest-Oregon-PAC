<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 33 · Candidate Recruitment Starts Here — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Editorial spec-sheet — sand background, corner brackets, big centered stacked serif.
     No photo. Ornamental sub-rules and dot markers echo museum-poster ID plate style. */
  .f33 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(65% 55% at 50% 45%, rgba(246,242,232,.85) 0%, transparent 65%),
      linear-gradient(180deg, #e6dcc0 0%, #d5c9a8 100%);
  }
  /* Corner brackets — chunky editorial */
  .f33-brackTL { position:absolute; z-index:6; top:96px; left:96px; width:60px; height:60px; border-top:3px solid #2e4538; border-left:3px solid #2e4538; }
  .f33-brackTR { position:absolute; z-index:6; top:96px; right:96px; width:60px; height:60px; border-top:3px solid #2e4538; border-right:3px solid #2e4538; }
  .f33-brackBL { position:absolute; z-index:6; bottom:96px; left:96px; width:60px; height:60px; border-bottom:3px solid #2e4538; border-left:3px solid #2e4538; }
  .f33-brackBR { position:absolute; z-index:6; bottom:96px; right:96px; width:60px; height:60px; border-bottom:3px solid #2e4538; border-right:3px solid #2e4538; }
  /* Central spec plate */
  .f33-plate { position:absolute; z-index:10; left:130px; right:130px; top:250px; bottom:250px; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:40px 20px; }
  /* Mast within plate */
  .f33-mast img { height:52px; width:auto; }
  /* Upper rule */
  .f33-topmark { display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:12px; letter-spacing:.6em; text-transform:uppercase; color:#5a7060; margin-top:10px; }
  .f33-topmark .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  .f33-topmark .dot { width:6px; height:6px; border-radius:50%; background:#2e4538; }
  /* Big stacked serif */
  .f33-h1 { text-align:center; font-family:var(--font-display); color:#2e4538; letter-spacing:-.034em; line-height:.88; font-weight:500; }
  .f33-h1 .l1 { display:block; font-size:130px; }
  .f33-h1 .l2 { display:block; font-size:130px; font-style:italic; color:#5a7060; margin-top:4px; }
  .f33-h1 .l3 { display:block; font-size:130px; margin-top:4px; }
  /* Ornamental base marker */
  .f33-base { display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f33-base .bar { width:90px; height:1px; background:currentColor; opacity:.6; }
  .f33-base .star svg { display:block; }
  /* Center compass ornament */
  .f33-compass { display:flex; gap:24px; align-items:center; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f33">
      <span class="f33-brackTL"></span>
      <span class="f33-brackTR"></span>
      <span class="f33-brackBL"></span>
      <span class="f33-brackBR"></span>

      <div class="f33-plate">
        <div class="f33-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

        <div class="f33-topmark">
          <span class="bar"></span>
          <span class="dot"></span>
          <span class="bar"></span>
        </div>

        <h1 class="f33-h1">
          <span class="l1">Candidate</span>
          <span class="l2">Recruitment</span>
          <span class="l3">Starts Here</span>
        </h1>

        <div class="f33-base">
          <span class="bar"></span>
          <span class="star" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          </span>
          <span class="bar"></span>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
