<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 35 · Meet the Candidates — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Photo-strip composition — five candidate portraits as a horizontal filmstrip band across the middle,
     big italic "Meet the Candidates" type stacked above/below the strip.
     Sand/cream editorial ground, dark filmstrip perforations. */
  .f35 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 50% 50%, rgba(246,242,232,.8) 0%, transparent 60%),
      linear-gradient(180deg, #ede4cf 0%, #d8ccae 100%);
  }
  /* Mast top-left */
  .f35-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f35-mast img { height:56px; width:auto; }
  /* Stars top-right */
  .f35-stars { position:absolute; z-index:14; top:112px; right:96px; display:flex; gap:14px; opacity:.6; }
  /* Kicker under mast */
  .f35-kick { position:absolute; z-index:12; left:96px; top:224px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f35-kick .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  /* Big italic type — "Meet" on top */
  .f35-top { position:absolute; z-index:10; left:96px; right:96px; top:272px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:160px; color:#2e4538; letter-spacing:-.032em; line-height:.92; }
  /* Filmstrip band */
  .f35-strip { position:absolute; z-index:8; left:60px; right:60px; top:498px; height:280px; background:#14100a; padding:26px 20px; display:flex; gap:14px; align-items:center; box-shadow:0 30px 60px -22px rgba(46,42,20,.4); }
  .f35-strip::before, .f35-strip::after { content:''; position:absolute; left:14px; right:14px; height:12px; background-image:radial-gradient(circle at 8px 6px, #ede4cf 4px, transparent 4.5px); background-size:24px 12px; }
  .f35-strip::before { top:4px; }
  .f35-strip::after { bottom:4px; }
  .f35-tile { flex:1; height:100%; overflow:hidden; background:#0f1a13; position:relative; }
  .f35-tile img { width:100%; height:100%; object-fit:cover; filter:saturate(.82) contrast(1.14) brightness(.92); }
  .f35-tile::after { content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,30,22,0) 55%, rgba(6,10,7,.55) 100%); }
  /* Big italic bottom */
  .f35-bot { position:absolute; z-index:10; left:96px; right:96px; top:810px; font-family:var(--font-display); font-weight:500; font-size:140px; color:#2e4538; letter-spacing:-.03em; line-height:.9; text-align:right; }
  .f35-bot em { font-style:italic; color:#5a7060; }
  /* Bottom rule */
  .f35-rule { position:absolute; z-index:12; left:96px; right:96px; bottom:96px; height:1px; background:linear-gradient(90deg, rgba(46,69,56,.5), transparent 60%); }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f35">
      <div class="f35-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f35-stars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
      <div class="f35-kick"><span class="bar"></span></div>

      <div class="f35-top">Meet the</div>

      <div class="f35-strip">
        <div class="f35-tile"><img src="../assets/img/mark-norman.jpg" alt="" /></div>
        <div class="f35-tile"><img src="../assets/img/brian-schimmel.jpg" alt="" /></div>
        <div class="f35-tile" style="display:none"><img src="../assets/img/barbara-kahl.jpg" alt="" /></div>
        <div class="f35-tile"><img src="../assets/img/ciatta-thompson.jpg" alt="" /></div>
        <div class="f35-tile"><img src="../assets/img/randall-fryer.jpg" alt="" /></div>
      </div>

      <div class="f35-bot"><em>Candidates</em></div>

      <div class="f35-rule"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
