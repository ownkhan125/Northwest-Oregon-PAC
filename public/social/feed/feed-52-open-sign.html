<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 52 · Local Economy — Every Open Sign — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Cinematic quote poster w/ giant italic glyph in background */
  .f52 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  .f52-bg { position:absolute; inset:0; z-index:1; }
  .f52-bg img { width:100%; height:100%; object-fit:cover; object-position:center; filter:saturate(.5) contrast(1.25) brightness(.42); }
  .f52-bg::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 45% at 12% 20%, rgba(107,90,66,.32) 0%, transparent 65%),
      radial-gradient(70% 55% at 100% 100%, rgba(24,34,27,.85) 0%, transparent 55%),
      linear-gradient(180deg, rgba(20,30,22,.55) 0%, rgba(20,30,22,.35) 45%, rgba(10,16,12,.9) 100%);
  }

  /* Giant italic glyph background — quotation mark */
  .f52-glyph { position:absolute; z-index:2; left:-40px; top:180px;
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:900px; line-height:.7; color:rgba(224,214,188,.09);
    pointer-events:none;
  }

  /* Blueprint grid overlay */
  .f52-grid { position:absolute; inset:0; z-index:2; opacity:.06; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size:72px 72px;
  }

  /* Mast */
  .f52-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f52-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.7)); }

  /* Top-right stars */
  .f52-stars { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }

  /* Eyebrow tag */
  .f52-eyebrow { position:absolute; z-index:10; top:284px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:15px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.75); font-weight:600;
  }
  .f52-eyebrow .bar { width:60px; height:1px; background:currentColor; opacity:.75; }

  /* Rule under eyebrow */
  .f52-eyerule { position:absolute; z-index:10; top:322px; left:96px; right:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.35), rgba(224,214,188,0) 65%); }

  /* Centerpiece quote — italic, big */
  .f52-quote { position:absolute; z-index:10; left:96px; right:96px; top:400px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:92px; line-height:1; letter-spacing:-.032em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  .f52-quote .open { display:inline-block; font-style:normal; font-weight:600; padding:2px 22px 6px; margin:0 12px;
    background:#e0d6bc; color:#2e4538; letter-spacing:.02em;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
    vertical-align: baseline;
  }

  /* Body */
  .f52-rule { position:absolute; z-index:10; left:96px; top:740px; width:140px; height:2px; background:rgba(224,214,188,.65); }
  .f52-body { position:absolute; z-index:10; left:96px; right:96px; top:772px;
    font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1.36; letter-spacing:-.006em; color:rgba(246,242,232,.9);
  }
  .f52-body em { font-style:italic; color:#e0d6bc; }

  /* Baseline credit */
  .f52-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55);
  }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f52">
      <div class="f52-bg"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f52-grid"></div>
      <div class="f52-glyph">&ldquo;</div>

      <div class="f52-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f52-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f52-eyebrow"><span class="bar"></span>LOCAL ECONOMY</div>
      <div class="f52-eyerule"></div>

      <h1 class="f52-quote">Every <span class="open">Open</span> sign represents someone&rsquo;s dream.</h1>

      <div class="f52-rule"></div>
      <p class="f52-body">Strong communities are built by <em>entrepreneurs, family businesses,</em> and people willing to take a chance on Northwest Oregon.</p>

      <div class="f52-baseline">
        <span>Manifesto &middot; No. 52</span>
        <span>Northwest Oregon PAC</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
