<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 23 · Our priorities aren't chosen in Salem. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f23 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#efe8d5; }
  /* Left photo pane — full-height cropped Oregon community */
  .f23-photo { position:absolute; z-index:2; top:0; bottom:0; left:0; width:44%; overflow:hidden; }
  .f23-photo img { width:100%; height:100%; object-fit:cover; object-position:35% 40%; filter:saturate(.68) contrast(1.2) brightness(.78); }
  .f23-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(31,47,38,.35) 0%, transparent 40%, transparent 65%, rgba(239,232,213,.4) 100%),
      linear-gradient(180deg, rgba(20,30,22,.55) 0%, rgba(20,30,22,.15) 30%, rgba(20,30,22,.55) 100%);
  }
  /* Torn / hand-drawn edge between photo and text */
  .f23-tear { position:absolute; z-index:4; top:0; bottom:0; left:44%; width:16px; transform:translateX(-8px);
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='1080' viewBox='0 0 16 1080'><path d='M8 0 L10 40 L6 90 L11 150 L5 220 L9 290 L7 360 L10 430 L6 500 L9 570 L7 640 L10 710 L6 780 L9 850 L7 920 L10 990 L8 1080' stroke='%23efe8d5' stroke-width='4' fill='none' opacity='.9'/></svg>") repeat-y center;
  }
  /* Photo overlay — small label + kicker on photo */
  .f23-photo-label { position:absolute; z-index:6; left:56px; top:96px; }
  .f23-photo-label img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Right editorial column */
  .f23-col { position:absolute; z-index:5; top:120px; right:80px; bottom:120px; left:calc(44% + 60px); display:flex; flex-direction:column; }
  .f23-eyebrow { display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:#5a7060; }
  .f23-eyebrow .bar { width:52px; height:1px; background:currentColor; opacity:.75; }
  .f23-head { margin-top:24px; font-family:var(--font-display); font-weight:500; font-size:64px; line-height:1; letter-spacing:-.024em; color:#2e4538; }
  .f23-sub { margin-top:22px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:32px; line-height:1.22; letter-spacing:-.015em; color:#5a7060; }
  .f23-orn { margin-top:34px; height:2px; width:80px; background:#2e4538; opacity:.5; }
  .f23-list { margin-top:30px; display:flex; flex-direction:column; gap:22px; }
  .f23-item { display:flex; align-items:center; gap:22px; padding:14px 0; border-bottom:1px solid rgba(46,69,56,.16); }
  .f23-item:last-child { border-bottom:none; }
  .f23-item .n { flex:none; width:44px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:24px; letter-spacing:-.01em; color:#5a7060; text-align:right; }
  .f23-item .ico { flex:none; width:44px; height:44px; display:flex; align-items:center; justify-content:center; color:#2e4538; opacity:.75; }
  .f23-item .ico svg { width:38px; height:38px; }
  .f23-item .txt { flex:1; font-family:var(--font-display); font-weight:500; font-size:26px; line-height:1.2; letter-spacing:-.008em; color:#2e4538; }
  /* Ghost numeral */
  .f23-num { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:640px; line-height:.8; color:rgba(46,69,56,.06); right:-40px; bottom:-120px; pointer-events:none; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f23">
      <div class="f23-photo"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="f23-tear"></div>

      <div class="f23-photo-label">
        <img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" />
      </div>

      <div class="f23-col">
        <div class="f23-eyebrow"><span class="bar"></span></div>
        <h1 class="f23-head">Our priorities aren't chosen in Salem.</h1>
        <p class="f23-sub">They're shaped by conversations across Northwest Oregon.</p>
        <div class="f23-orn"></div>

        <div class="f23-list">
          <div class="f23-item">
            <span class="n">i.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-8h6v8"/></svg></span>
            <span class="txt">Supporting local businesses</span>
          </div>
          <div class="f23-item">
            <span class="n">ii.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="12" rx="1"/><path d="M7 7V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2"/><path d="M12 12v3"/></svg></span>
            <span class="txt">Responsible public spending</span>
          </div>
          <div class="f23-item">
            <span class="n">iii.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 4 5v7c0 5 3.5 8.5 8 10 4.5-1.5 8-5 8-10V5l-8-3z"/></svg></span>
            <span class="txt">Safe communities</span>
          </div>
          <div class="f23-item">
            <span class="n">iv.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 19V9l8-5 8 5v10"/><path d="M2 22h20"/><path d="M9 22v-6h6v6"/></svg></span>
            <span class="txt">Preparing students for tomorrow</span>
          </div>
          <div class="f23-item">
            <span class="n">v.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 4 14h7l-1 8 9-12h-7l1-8z"/></svg></span>
            <span class="txt">Affordable, dependable energy</span>
          </div>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
