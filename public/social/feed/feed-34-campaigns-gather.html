<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 34 · Campaign Events That Matter — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Theater-poster / event-poster composition — photo mounted center as a tall panel with cream frame,
     poster-style vertical stacked type above and below the panel, ornamental double-rule frame,
     small tickets/coordinates row at bottom for texture. */
  .f34 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(80% 60% at 50% 40%, rgba(107,90,66,.28) 0%, transparent 65%),
      linear-gradient(180deg, #1f1a12 0%, #14100a 100%);
  }
  /* Outer double frame */
  .f34-frame1 { position:absolute; z-index:5; top:60px; left:60px; right:60px; bottom:60px; border:1px solid rgba(224,214,188,.28); }
  .f34-frame2 { position:absolute; z-index:5; top:72px; left:72px; right:72px; bottom:72px; border:1px solid rgba(224,214,188,.16); }
  /* Mast top-center */
  .f34-mast { position:absolute; z-index:14; top:100px; left:50%; transform:translateX(-50%); }
  .f34-mast img { height:50px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Upper mono row */
  .f34-mono-top { position:absolute; z-index:12; left:0; right:0; top:180px; text-align:center; font-family:var(--font-mono); font-size:12px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.55); display:flex; justify-content:center; align-items:center; gap:22px; }
  .f34-mono-top .bar { width:70px; height:1px; background:currentColor; opacity:.5; }
  .f34-mono-top .dot { width:5px; height:5px; border-radius:50%; background:#e0d6bc; opacity:.7; }
  /* Big top word — constrained inside the double-frame border */
  .f34-top-word { position:absolute; z-index:12; left:120px; right:120px; top:230px; text-align:center; font-family:var(--font-display); font-weight:500; font-size:104px; color:#f6f2e8; letter-spacing:-.03em; line-height:.94; text-shadow:0 6px 30px rgba(0,0,0,.6); }
  .f34-top-word em { font-style:italic; color:#e0d6bc; }
  /* Center image panel — narrow vertical stripe */
  .f34-panel { position:absolute; z-index:8; left:50%; transform:translateX(-50%); top:392px; width:440px; height:340px; overflow:hidden;
    box-shadow:0 40px 90px -30px rgba(0,0,0,.75), inset 0 0 0 8px #f6f2e8, inset 0 0 0 10px rgba(46,42,20,.35);
  }
  .f34-panel img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(.75) contrast(1.18) brightness(.86); }
  .f34-panel::after { content:''; position:absolute; inset:10px; background:linear-gradient(180deg, rgba(20,30,22,.05) 0%, rgba(20,30,22,.25) 60%, rgba(6,10,7,.55) 100%); pointer-events:none; }
  /* Ornament divider under panel */
  .f34-divider { position:absolute; z-index:12; left:0; right:0; top:770px; text-align:center; }
  .f34-divider svg { display:inline-block; opacity:.7; }
  /* Bottom stacked type — matched to top word width */
  .f34-bot-word { position:absolute; z-index:12; left:120px; right:120px; top:800px; text-align:center; font-family:var(--font-display); font-weight:500; font-style:italic; font-size:88px; color:#e0d6bc; letter-spacing:-.028em; line-height:.94; text-shadow:0 6px 30px rgba(0,0,0,.6); }
  /* Lowest mono coordinates */
  .f34-mono-bot { position:absolute; z-index:12; left:0; right:0; bottom:130px; text-align:center; font-family:var(--font-mono); font-size:12px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.55); display:flex; justify-content:center; align-items:center; gap:22px; }
  .f34-mono-bot .bar { width:80px; height:1px; background:currentColor; opacity:.5; }
  .f34-mono-bot .dot { width:5px; height:5px; border-radius:50%; background:#e0d6bc; opacity:.7; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f34">
      <span class="f34-frame1"></span>
      <span class="f34-frame2"></span>

      <div class="f34-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f34-mono-top">
        <span class="bar"></span>
        <span class="dot"></span>
        <span class="bar"></span>
      </div>

      <h1 class="f34-top-word">Campaign <em>Events</em></h1>

      <div class="f34-panel"><img src="../assets/img/event.jpg" alt="" /></div>

      <div class="f34-divider" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f34-bot-word">That Matter</div>

      <div class="f34-mono-bot">
        <span class="bar"></span>
        <span class="dot"></span>
        <span class="bar"></span>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
