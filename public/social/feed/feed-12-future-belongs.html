<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 12 · The Future Belongs to Those Who Lead. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f12 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Top hero image (60% of height) */
  .f12-hero { position:absolute; z-index:1; top:0; left:0; right:0; height:56%; overflow:hidden; }
  .f12-hero img { width:100%; height:100%; object-fit:cover; object-position:center 60%; filter:saturate(.62) contrast(1.22) brightness(.62); }
  .f12-hero::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(60% 45% at 15% 15%, rgba(90,112,96,.28) 0%, transparent 65%),
      linear-gradient(180deg, rgba(20,30,22,.45) 0%, rgba(20,30,22,.05) 40%, rgba(20,30,22,.65) 80%, #1a2820 100%);
  }
  /* Bottom dark forest area (46% of height, overlaps a bit) */
  .f12-lower { position:absolute; z-index:2; left:0; right:0; top:52%; bottom:0;
    background:
      radial-gradient(80% 65% at 100% 105%, rgba(24,34,27,.9) 0%, transparent 55%),
      linear-gradient(178deg, #1a2820 0%, #0f1a13 100%);
  }
  /* Diagonal seam */
  .f12-seam { position:absolute; z-index:4; left:-4%; right:-4%; top:52%; height:3px; background:rgba(224,214,188,.55); transform:rotate(-1.5deg); box-shadow: 0 0 24px rgba(224,214,188,.15); }
  /* Mast */
  .f12-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f12-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Stars top right */
  .f12-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }
  /* Kicker */
  .f12-kick { position:absolute; z-index:10; top:220px; left:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); }
  .f12-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  /* Big headline on the seam */
  .f12-h1 { position:absolute; z-index:10; left:96px; right:200px; top:290px;
    font-family:var(--font-display); font-weight:500; font-size:104px; line-height:.94; letter-spacing:-.03em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .f12-h1 em { font-style:italic; font-weight:400; color:#e0d6bc; display:block; }
  /* CTA list */
  .f12-cta { position:absolute; z-index:10; left:96px; right:96px; top:670px; display:flex; flex-direction:column; gap:0; padding-top:20px; border-top:1.5px solid rgba(224,214,188,.35); }
  .f12-item { display:flex; align-items:center; gap:28px; padding:18px 0; border-bottom:1px solid rgba(224,214,188,.16); }
  .f12-item:last-child { border-bottom:none; }
  .f12-item .n { flex:none; width:54px; font-family:var(--font-mono); font-size:15px; letter-spacing:.32em; text-transform:uppercase; color:rgba(224,214,188,.55); text-align:right; }
  .f12-item .txt { flex:1; font-family:var(--font-display); font-weight:500; font-size:38px; line-height:1.1; letter-spacing:-.014em; color:#f6f2e8; }
  .f12-item .txt em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .f12-item .arrow { flex:none; color:rgba(224,214,188,.55); }
  .f12-item .arrow svg { display:block; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f12">
      <div class="f12-hero"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f12-lower"></div>
      <div class="f12-seam"></div>

      <div class="f12-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f12-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f12-kick"><span class="bar"></span></div>

      <h1 class="f12-h1">The Future Belongs to <em>Those Who Lead.</em></h1>

      <div class="f12-cta">
        <div class="f12-item">
          <span class="n">01</span>
          <span class="txt">Support strong <em>candidates.</em></span>
          <span class="arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </div>
        <div class="f12-item">
          <span class="n">02</span>
          <span class="txt">Stay <em>informed.</em></span>
          <span class="arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </div>
        <div class="f12-item">
          <span class="n">03</span>
          <span class="txt">Invest in <em>Northwest Oregon.</em></span>
          <span class="arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </div>
        <div class="f12-item">
          <span class="n">04</span>
          <span class="txt">Run for <em>office.</em></span>
          <span class="arrow" aria-hidden="true"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
