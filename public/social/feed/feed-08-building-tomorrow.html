<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 08 · Building Tomorrow. Starting Today. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f08 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#1f2f26; }
  /* Full-bleed image */
  .f08-bg { position:absolute; z-index:1; inset:0; }
  .f08-bg img { width:100%; height:100%; object-fit:cover; object-position:center 35%; filter:saturate(.55) contrast(1.28) brightness(.5); }
  .f08-bg::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(20,30,22,.75) 0%, rgba(20,30,22,.2) 25%, rgba(20,30,22,.55) 60%, rgba(6,10,7,.98) 100%),
      radial-gradient(50% 40% at 20% 20%, rgba(90,112,96,.28) 0%, transparent 65%);
  }
  /* Blueprint grid overlay */
  .f08-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.14;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 80px 80px;
  }
  /* Corner cross-mark measurements */
  .f08-cross { position:absolute; z-index:6; width:40px; height:40px; }
  .f08-cross::before, .f08-cross::after { content:''; position:absolute; background:rgba(224,214,188,.35); }
  .f08-cross::before { left:19px; top:0; width:2px; height:40px; }
  .f08-cross::after  { top:19px; left:0; width:40px; height:2px; }
  .f08-cross.tl { top:200px; left:80px; }
  .f08-cross.br { bottom:200px; right:80px; }
  /* Angular architectural line — between the two typography blocks */
  .f08-line { position:absolute; z-index:6; left:80px; right:80px; top:604px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.6), rgba(224,214,188,.15) 60%, transparent); }
  .f08-line-2 { position:absolute; z-index:6; left:80px; top:604px; width:60px; height:1px; background:#e0d6bc; }
  /* Mast + kicker top */
  .f08-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f08-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f08-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }
  /* Category dimension */
  .f08-dim { position:absolute; z-index:10; top:240px; left:96px; padding:8px 16px; border:1px solid rgba(224,214,188,.45); font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.75); }
  /* Huge typography — split across composition */
  .f08-b1 { position:absolute; z-index:10; left:96px; right:96px; top:330px;
    font-family:var(--font-display); font-weight:500; font-size:140px; line-height:.92; letter-spacing:-.036em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .f08-b2 { position:absolute; z-index:10; left:96px; right:96px; top:640px;
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:140px; line-height:.92; letter-spacing:-.036em; color:#e0d6bc;
    text-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  /* Bottom detail — dimensioning lines */
  .f08-detail { position:absolute; z-index:10; left:96px; right:96px; bottom:130px; display:flex; align-items:center; gap:24px; }
  .f08-detail .l { flex:1; height:1px; background:linear-gradient(90deg, rgba(224,214,188,0), rgba(224,214,188,.5) 30%, rgba(224,214,188,.5) 70%, rgba(224,214,188,0)); }
  .f08-detail .m { display:flex; gap:14px; opacity:.7; }
  /* Bottom rule */
  .f08-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; height:2px; background:linear-gradient(90deg, rgba(224,214,188,.65) 0%, transparent 70%); }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f08">
      <div class="f08-bg"><img src="../assets/img/bridge.png" alt="" /></div>
      <div class="f08-grid"></div>

      <span class="f08-cross tl"></span>
      <span class="f08-cross br"></span>

      <div class="f08-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f08-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <h1 class="f08-b1">Building<br/>Tomorrow.</h1>
      <div class="f08-line-2"></div>
      <div class="f08-line"></div>
      <div class="f08-b2">Starting<br/>Today.</div>

      <div class="f08-detail">
        <span class="l"></span>
        <div class="m" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
        <span class="l"></span>
      </div>

      <div class="f08-baseline"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
