<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 05 · Meet Northwest Oregon. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f05 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 92% 8%, rgba(224,214,188,.5) 0%, transparent 60%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Dot grid backdrop */
  .f05-grid-bg { position:absolute; inset:0; z-index:2; opacity:.055; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 26px 26px;
  }
  /* Mast + stars */
  .f05-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f05-mast img { height:60px; width:auto; }
  .f05-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker + top rule */
  .f05-kick { position:absolute; z-index:10; top:240px; left:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f05-kick .bar { width:56px; height:1px; background:currentColor; opacity:.75; }
  /* Big italic title top-left */
  .f05-title { position:absolute; z-index:10; left:96px; right:96px; top:290px;
    font-family:var(--font-display); font-weight:500; font-size:104px; line-height:.98; letter-spacing:-.032em; color:#2e4538;
  }
  .f05-title .a { display:block; }
  .f05-title .b { display:block; font-style:italic; font-weight:400; color:#5a7060; margin-top:6px; }
  .f05-title .c { display:block; font-style:italic; font-weight:400; color:#5a7060; }
  /* Bento mosaic photo grid — bottom half, cleared from the title */
  .f05-mosaic { position:absolute; z-index:6; left:96px; right:96px; bottom:200px; top:680px;
    display:grid; grid-template-columns: 1.5fr 1fr 1fr; grid-template-rows:1fr 1fr; gap:14px;
  }
  .f05-panel { position:relative; overflow:hidden; background:#0f1a13; border-radius:6px;
    box-shadow:0 24px 44px -22px rgba(46,42,20,.4);
  }
  .f05-panel img { width:100%; height:100%; object-fit:cover; filter:saturate(.72) contrast(1.18) brightness(.88); }
  .f05-panel::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,30,22,.05) 0%, rgba(20,30,22,.42) 100%);
  }
  .f05-panel .lbl { position:absolute; left:14px; bottom:12px; z-index:2; font-family:var(--font-mono); font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:rgba(246,242,232,.9); text-shadow:0 2px 12px rgba(0,0,0,.5); }
  .f05-panel .no { position:absolute; right:14px; top:10px; z-index:2; font-family:var(--font-display); font-style:italic; font-size:22px; color:#e0d6bc; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  .f05-panel.tall { grid-row:1 / span 2; }
  .f05-panel.wide { grid-column:2 / span 2; }
  /* Bottom baseline */
  .f05-base { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; padding-top:22px; border-top:1px solid rgba(46,69,56,.35); }
  .f05-base .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.6); }
  .f05-base .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f05-base .r { display:flex; gap:6px; opacity:.5; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f05">
      <div class="f05-grid-bg"></div>

      <div class="f05-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f05-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f05-kick"><span class="bar"></span></div>
      <h1 class="f05-title"><span class="a">Meet</span><span class="b">Northwest</span><span class="c">Oregon.</span></h1>

      <div class="f05-mosaic">
        <div class="f05-panel tall">
          <img src="../assets/img/banner.jpg" alt="" />
        </div>
        <div class="f05-panel">
          <img src="../assets/img/community.jpg" alt="" />
        </div>
        <div class="f05-panel">
          <img src="../assets/img/bridge.png" alt="" />
        </div>
        <div class="f05-panel wide">
          <img src="../assets/img/who-we-are.jpg" alt="" />
        </div>
      </div>

      <div class="f05-base">
        <div class="l"><span class="bar"></span></div>
        <div class="r" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
