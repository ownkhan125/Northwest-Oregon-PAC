<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 31 · Northwest Oregon needs good leaders. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* 2-line manifesto — display serif "Northwest Oregon / needs good leaders." dominates the upper 2/3,
     hairline rule, then smaller italic imperative "Run for office." below. Forest ground with warm radial glow,
     capitol icon detail lower-right, star row upper-right. NO photo — pure typographic poster. */
  .f31 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(75% 55% at 22% 25%, rgba(90,112,96,.42) 0%, transparent 65%),
      radial-gradient(60% 45% at 88% 80%, rgba(107,90,66,.32) 0%, transparent 70%),
      linear-gradient(180deg, #253a2e 0%, #182620 100%);
  }
  /* Corner registration marks */
  .f31-mark { position:absolute; z-index:6; width:32px; height:32px; }
  .f31-mark::before, .f31-mark::after { content:''; position:absolute; background:rgba(224,214,188,.55); }
  .f31-mark::before { left:15px; top:0; width:2px; height:32px; }
  .f31-mark::after  { top:15px; left:0; width:32px; height:2px; }
  .f31-mark.tl { top:80px; left:80px; }
  .f31-mark.tr { top:80px; right:80px; }
  .f31-mark.bl { bottom:80px; left:80px; }
  .f31-mark.br { bottom:80px; right:80px; }
  /* Mast — centered under top marks */
  .f31-mast { position:absolute; z-index:14; top:150px; left:50%; transform:translateX(-50%); }
  .f31-mast img { height:52px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.5)); }
  /* Ornament stars top center */
  .f31-topstars { position:absolute; z-index:12; top:236px; left:50%; transform:translateX(-50%); display:flex; gap:20px; opacity:.6; }
  /* MANIFESTO — big serif, two lines, left aligned in a generous column */
  .f31-h1 { position:absolute; z-index:10; left:130px; right:130px; top:322px;
    font-family:var(--font-display); font-weight:500; color:#f6f2e8; letter-spacing:-.032em; line-height:.92; text-align:center;
    font-size:118px; text-shadow:0 6px 30px rgba(0,0,0,.4);
  }
  .f31-h1 em { display:block; font-style:italic; font-weight:500; color:#e0d6bc; margin-top:8px; }
  /* Divider rule */
  .f31-rule { position:absolute; z-index:10; left:50%; transform:translateX(-50%); top:702px; width:180px; height:1px; background:rgba(224,214,188,.5); }
  .f31-rule::before { content:''; position:absolute; left:50%; top:-4px; transform:translateX(-50%); width:9px; height:9px; background:#e0d6bc; border-radius:50%; }
  /* Imperative "Run for office." — smaller italic, offset below rule */
  .f31-imperative { position:absolute; z-index:10; left:0; right:0; top:770px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:80px; letter-spacing:-.022em; color:#e0d6bc; text-align:center; line-height:1;
  }
  /* Bottom mono label */
  .f31-mono { position:absolute; z-index:10; left:0; right:0; bottom:170px; text-align:center; font-family:var(--font-mono); font-size:14px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.6); }
  /* Star row bottom center */
  .f31-botstars { position:absolute; z-index:12; bottom:130px; left:50%; transform:translateX(-50%); display:flex; gap:18px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f31">
      <span class="f31-mark tl"></span>
      <span class="f31-mark tr"></span>
      <span class="f31-mark bl"></span>
      <span class="f31-mark br"></span>

      <div class="f31-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f31-topstars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <h1 class="f31-h1">Northwest Oregon<em>needs good leaders.</em></h1>

      <div class="f31-rule"></div>

      <div class="f31-imperative">Run for office.</div>

      <div class="f31-botstars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
