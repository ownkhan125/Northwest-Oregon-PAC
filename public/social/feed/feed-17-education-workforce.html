<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 17 · Education &amp; Workforce Development — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f17 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 90% 8%, rgba(224,214,188,.5) 0%, transparent 60%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Right full-height photo panel — asymmetric */
  .f17-photo { position:absolute; z-index:3; top:80px; bottom:80px; right:80px; width:400px; overflow:hidden; border-radius:12px;
    box-shadow: 0 40px 90px -40px rgba(46,42,20,.5), 0 12px 24px rgba(46,42,20,.2);
  }
  .f17-photo img { width:100%; height:100%; object-fit:cover; object-position:center; filter:saturate(.72) contrast(1.18) brightness(.88); }
  .f17-photo::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(20,30,22,.14) 0%, rgba(20,30,22,.3) 70%, rgba(10,16,12,.62) 100%);
  }
  .f17-photo .cap { position:absolute; left:20px; right:20px; bottom:24px; color:#e0d6bc; font-family:var(--font-mono); font-size:12px; letter-spacing:.44em; text-transform:uppercase; opacity:.85; }
  /* Overlapping polaroid tile — offset in front of photo */
  .f17-tile { position:absolute; z-index:6; right:340px; top:670px; width:190px; padding:12px 12px 36px; background:#faf3d8;
    box-shadow:0 26px 46px -18px rgba(46,42,20,.4);
    transform:rotate(-4deg); border:1px solid rgba(46,42,20,.08);
  }
  .f17-tile .p { width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f17-tile .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.72) contrast(1.15); }
  /* Left editorial column */
  .f17-col { position:absolute; z-index:5; top:96px; left:96px; bottom:96px; right:540px; display:flex; flex-direction:column; }
  .f17-mast { }
  .f17-mast img { height:56px; width:auto; }
  .f17-kick { margin-top:110px; display:flex; align-items:center; gap:18px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f17-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f17-orn { margin-top:28px; height:2px; width:140px; background:#2e4538; opacity:.6; }
  .f17-h1 { margin-top:36px; font-family:var(--font-display); font-weight:500; font-size:82px; line-height:.98; letter-spacing:-.028em; color:#2e4538; }
  .f17-h1 .amp { font-style:italic; font-weight:400; color:#5a7060; }
  .f17-h1 .b { display:block; font-style:italic; font-weight:400; color:#5a7060; margin-top:6px; }
  .f17-sub { margin-top:30px; padding-top:24px; border-top:1px solid rgba(46,69,56,.35); font-family:var(--font-display); font-style:italic; font-weight:500; font-size:34px; line-height:1.24; letter-spacing:-.012em; color:#2e4538; max-width:460px; }
  /* Bottom signature */
  .f17-sig { margin-top:auto; display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.55); }
  .f17-sig .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f17-sig .stars { margin-left:auto; display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f17">
      <div class="f17-photo">
        <img src="../assets/img/us-elections.jpg" alt="" />
        <div class="cap" aria-hidden="true"></div>
      </div>

      <div class="f17-tile">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>

      <div class="f17-col">
        <div class="f17-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
        <div class="f17-kick"><span class="bar"></span></div>
        <div class="f17-orn"></div>
        <h1 class="f17-h1">Education <span class="amp">&amp;</span> <span class="b">Workforce Development</span></h1>
        <p class="f17-sub">Preparing today's students for tomorrow's opportunities</p>
        <div class="f17-sig">
          <span class="bar"></span>
          <span class="stars" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          </span>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
