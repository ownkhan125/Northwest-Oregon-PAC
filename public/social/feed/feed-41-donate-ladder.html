<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 41 · Every contribution builds a stronger Northwest Oregon. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f41 { position:absolute; inset:0; z-index:5; overflow:hidden; }
  /* Top 42% hero image */
  .f41-hero { position:absolute; z-index:1; top:0; left:0; right:0; height:44%; overflow:hidden; }
  .f41-hero img { width:100%; height:100%; object-fit:cover; object-position:center 55%; filter:saturate(.62) contrast(1.22) brightness(.62); }
  .f41-hero::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(20,30,22,.35) 0%, rgba(20,30,22,.12) 40%, rgba(31,47,38,.55) 78%, #1f2f26 100%),
      radial-gradient(70% 55% at 25% 20%, rgba(90,112,96,.35) 0%, transparent 70%);
  }
  /* Bottom dark forest area */
  .f41-lower { position:absolute; z-index:2; left:0; right:0; top:44%; bottom:0;
    background:
      radial-gradient(90% 70% at 12% 8%, rgba(90,112,96,.32) 0%, transparent 55%),
      radial-gradient(90% 80% at 100% 105%, rgba(24,34,27,.9) 0%, transparent 55%),
      linear-gradient(178deg, #1f2f26 0%, #16241c 62%, #0f1a13 100%);
  }
  /* Diagonal accent slash through the image */
  .f41-slash { position:absolute; z-index:3; top:38%; left:-4%; right:-4%; height:8px; background:linear-gradient(90deg, rgba(224,214,188,0), rgba(224,214,188,.35) 20%, rgba(224,214,188,.35) 80%, rgba(224,214,188,0)); transform:rotate(-2deg); }
  /* Mast */
  .f41-mast { position:absolute; z-index:12; top:64px; left:96px; }
  .f41-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Star cluster on hero */
  .f41-stars { position:absolute; z-index:6; top:96px; right:96px; display:grid; grid-template-columns:repeat(5,10px); gap:12px; opacity:.7; }
  /* Eyebrow */
  .f41-eyebrow { position:absolute; z-index:10; left:96px; top:200px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); }
  .f41-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big headline sits below the seam */
  .f41-head { position:absolute; z-index:10; left:96px; right:96px; top:490px;
    font-family:var(--font-display); font-weight:500; font-size:66px; line-height:1.06; letter-spacing:-.026em;
    color:#f6f2e8; text-shadow: 0 6px 30px rgba(0,0,0,.6);
  }
  .f41-head em { font-style:italic; font-weight:400; color:#e0d6bc; display:block; margin-top:8px; }
  /* Amount chips — pushed clear below headline */
  .f41-amounts { position:absolute; z-index:10; left:96px; right:96px; top:770px; display:flex; align-items:center; gap:18px; }
  .f41-chip { position:relative; padding:18px 32px; border:1.5px solid rgba(224,214,188,.42); background:rgba(224,214,188,.06); border-radius:999px;
    font-family:var(--font-display); font-weight:500; font-style:italic; letter-spacing:-.015em; color:#f6f2e8; line-height:1;
    box-shadow: 0 20px 40px -18px rgba(0,0,0,.7);
  }
  .f41-chip.a { font-size:44px; padding:16px 26px; }
  .f41-chip.b { font-size:50px; padding:18px 30px; background:rgba(224,214,188,.09); }
  .f41-chip.c { font-size:58px; padding:20px 34px; background:rgba(224,214,188,.12); }
  .f41-chip.d { font-size:66px; padding:22px 38px; background:rgba(224,214,188,.16); border-color:rgba(224,214,188,.6); }
  /* CTA button */
  .f41-cta { position:absolute; z-index:10; left:96px; bottom:88px;
    display:inline-flex; align-items:center; gap:24px; padding:24px 52px;
    background:#e0d6bc; color:#1f2f26;
    font-family:var(--font-mono); font-weight:600; font-size:24px; letter-spacing:.44em; text-transform:uppercase;
    box-shadow: 0 24px 44px -18px rgba(0,0,0,.7);
  }
  .f41-cta .arrow { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:28px; letter-spacing:0; }
  /* Corner detail: right ornament */
  .f41-orn { position:absolute; z-index:10; right:96px; bottom:110px; }
  .f41-orn svg { display:block; opacity:.42; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f41">
      <div class="f41-hero"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="f41-lower"></div>
      <div class="f41-slash"></div>

      <div class="f41-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f41-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f41-eyebrow"><span class="bar"></span></div>

      <h1 class="f41-head">Every contribution builds a <em>stronger Northwest Oregon.</em></h1>

      <div class="f41-amounts">
        <div class="f41-chip a">$25</div>
        <div class="f41-chip b">$100</div>
        <div class="f41-chip c">$500</div>
        <div class="f41-chip d">$1,000</div>
      </div>

      <div class="f41-cta">Donate Today <span class="arrow">↗</span></div>

      <div class="f41-orn" aria-hidden="true">
        <svg width="120" height="60" viewBox="0 0 120 60" fill="none" stroke="#e0d6bc" stroke-width="1.2">
          <path d="M0 30 L120 30" opacity=".7"/>
          <path d="M60 6 L60 54" opacity=".6"/>
          <circle cx="60" cy="30" r="6" fill="#e0d6bc"/>
          <circle cx="60" cy="30" r="14" opacity=".6"/>
          <circle cx="60" cy="30" r="24" opacity=".35"/>
        </svg>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
