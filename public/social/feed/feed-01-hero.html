<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 01 · A Stronger Voice for Northwest Oregon — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />

<style>
  .f01 { position:absolute; inset:0; z-index:5; overflow:hidden; }
  .f01-bg { position:absolute; inset:0; z-index:1; }
  .f01-bg img { width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(.6) contrast(1.28) brightness(.42); }
  .f01-bg::after { content:''; position:absolute; inset:0; background:
    radial-gradient(70% 55% at 22% 18%, rgba(90,112,96,.35) 0%, transparent 65%),
    radial-gradient(90% 80% at 100% 100%, rgba(10,16,12,.9) 0%, transparent 65%),
    linear-gradient(178deg, rgba(31,47,38,.35) 0%, rgba(20,30,22,.6) 55%, rgba(8,12,10,.95) 100%);
  }
  .f01-scan { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.12;
    background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.5) 3px 4px);
    mix-blend-mode:multiply;
  }
  /* Polaroid tile — small candid photo tilted */
  .f01-tile { position:absolute; z-index:6; top:96px; right:72px; width:230px; padding:14px 14px 60px; background:#f6f2e8;
    box-shadow:0 34px 60px -22px rgba(0,0,0,.7), 0 6px 14px rgba(0,0,0,.4);
    transform:rotate(-4deg);
    border:1px solid rgba(0,0,0,.08);
  }
  .f01-tile .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f01-tile .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.7) contrast(1.14) brightness(.9); }
  .f01-tile .cap { position:absolute; left:0; right:0; bottom:14px; text-align:center; font-family:var(--font-mono); font-size:11px; letter-spacing:.42em; text-transform:uppercase; color:rgba(46,42,20,.6); }
  /* Second tile — behind, further tilted */
  .f01-tile-b { position:absolute; z-index:5; top:126px; right:280px; width:180px; padding:12px 12px 46px; background:#e9dfc8;
    box-shadow:0 24px 44px -18px rgba(0,0,0,.6);
    transform:rotate(7deg);
    border:1px solid rgba(0,0,0,.08);
  }
  .f01-tile-b .p { position:relative; width:100%; aspect-ratio:4/5; overflow:hidden; background:#0f1a13; }
  .f01-tile-b .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.6) contrast(1.15) brightness(.82); }
  /* Editorial spine — right vertical rule */
  .f01-spine { position:absolute; z-index:8; right:56px; top:96px; bottom:96px; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.45) 22%, rgba(224,214,188,.45) 78%, rgba(224,214,188,0)); }
  /* Star cluster (American flag nod, subtle) */
  .f01-stars { position:absolute; z-index:8; top:120px; left:96px; display:grid; grid-template-columns:repeat(5, 12px); gap:14px; opacity:.7; }
  .f01-stars svg { display:block; }
  .f01-stars-2 { position:absolute; z-index:8; top:150px; left:110px; display:grid; grid-template-columns:repeat(4, 12px); gap:14px; opacity:.55; }
  /* Ghost giant numeral */
  .f01-num { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:1180px; line-height:.7; color:rgba(224,214,188,.06);
    right:-140px; bottom:-320px; user-select:none; pointer-events:none;
  }
  /* Ornament — hairline chevron above title */
  .f01-orn { position:absolute; z-index:10; left:96px; bottom:668px; display:flex; align-items:center; gap:22px; color:rgba(224,214,188,.7); font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; }
  .f01-orn .rule { width:64px; height:1px; background:currentColor; opacity:.7; }
  /* Title — HUGE, breaking off the right edge, italic tail */
  .f01-title { position:absolute; z-index:10; left:96px; bottom:280px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:140px; line-height:.95; letter-spacing:-.032em;
    color:#f6f2e8; text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  .f01-title em { font-style:italic; font-weight:400; color:#e0d6bc; display:block; }
  /* Bottom band — three-part tagline as premium editorial chips */
  .f01-tags { position:absolute; z-index:10; left:96px; right:96px; bottom:120px; display:flex; align-items:center; gap:20px; }
  .f01-tag { flex:1; padding:22px 20px 24px; border-top:1px solid rgba(224,214,188,.45); font-family:var(--font-display); font-style:italic; font-weight:500; font-size:36px; letter-spacing:-.015em; color:#e0d6bc; text-align:center; }
  .f01-tag .n { display:block; margin-bottom:8px; font-family:var(--font-mono); font-style:normal; font-size:13px; letter-spacing:.42em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  /* Mast lockup */
  .f01-mast { position:absolute; z-index:12; top:64px; left:96px; }
  .f01-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
</style>
</head>
<body>
  <div class="canvas on-photo" style="background:#0a100c;">
    <div class="f01">
      <div class="f01-bg"><img src="../assets/img/banner.jpg" alt="" /></div>
      <div class="f01-scan"></div>

      <div class="f01-tile-b">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>
      <div class="f01-tile">

      </div>

      <div class="f01-mast">
        <img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" />
      </div>

      <div class="f01-stars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f01-spine"></div>

      <h1 class="f01-title">A Stronger Voice for<em>Northwest Oregon.</em></h1>

      <div class="f01-tags">
        <div class="f01-tag"><span class="n">— i</span>Prosperity</div>
        <div class="f01-tag"><span class="n">— ii</span>Accountability</div>
        <div class="f01-tag"><span class="n">— iii</span>Opportunity</div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
