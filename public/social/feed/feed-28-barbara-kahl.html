<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />

<style>
  /* Congressional campaign-poster composition — full bleed portrait, left-column dark plate, big stacked serif name, flag-inspired star band */
  .f28 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  .f28-portrait { position:absolute; z-index:1; inset:0; }
  .f28-portrait img { width:100%; height:100%; object-fit:cover; object-position:65% 22%; filter:saturate(.72) contrast(1.22) brightness(.72); }
  .f28-wash { position:absolute; z-index:2; inset:0;
    background:
      linear-gradient(90deg, rgba(6,10,7,.94) 0%, rgba(10,16,12,.82) 34%, rgba(10,16,12,.22) 58%, rgba(0,0,0,.05) 78%, rgba(6,10,7,.5) 100%),
      radial-gradient(70% 55% at 18% 30%, rgba(90,112,96,.28) 0%, transparent 65%),
      linear-gradient(180deg, rgba(20,30,22,.35) 0%, rgba(20,30,22,.05) 20%, rgba(6,10,7,.75) 100%);
  }
  /* Left thin spine */
  .f28-spine { position:absolute; z-index:6; top:280px; bottom:96px; left:56px; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.4) 25%, rgba(224,214,188,.4) 75%, rgba(224,214,188,0)); }
  /* Mast */
  .f28-mast { position:absolute; z-index:14; top:64px; left:96px; }
  .f28-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Star cluster top-right — flag nod */
  .f28-stars { position:absolute; z-index:14; top:92px; right:96px; display:grid; grid-template-columns:repeat(7,12px); gap:14px; opacity:.78; }
  /* Star band across upper third */
  .f28-band { position:absolute; z-index:6; left:96px; right:96px; top:206px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.55), rgba(224,214,188,.18) 60%, transparent); }
  .f28-band-2 { position:absolute; z-index:6; left:96px; right:96px; top:246px; height:1px; background:linear-gradient(90deg, transparent, rgba(224,214,188,.18) 40%, rgba(224,214,188,.55)); }
  .f28-band-stars { position:absolute; z-index:8; left:96px; right:96px; top:212px; height:28px; display:flex; align-items:center; justify-content:center; gap:26px; opacity:.6; }
  /* Stacked serif name block */
  .f28-name { position:absolute; z-index:10; left:96px; right:120px; top:322px; font-family:var(--font-display); color:#f6f2e8; letter-spacing:-.035em; line-height:.88; }
  .f28-name .meet { display:block; font-size:52px; font-style:italic; font-weight:400; color:#e0d6bc; margin-bottom:14px; letter-spacing:-.02em; text-shadow:0 4px 24px rgba(0,0,0,.7); }
  .f28-name .dr { font-style:italic; font-weight:400; color:#e0d6bc; }
  .f28-name .first { display:block; font-weight:500; font-size:172px; text-shadow:0 8px 40px rgba(0,0,0,.75); }
  .f28-name .last  { display:block; font-weight:500; font-style:italic; font-size:172px; color:#e0d6bc; text-shadow:0 8px 40px rgba(0,0,0,.75); }
  /* Office plate */
  .f28-office { position:absolute; z-index:10; left:96px; right:120px; top:770px; padding:22px 26px; background:rgba(6,10,7,.7); border:1px solid rgba(224,214,188,.42); border-left:3px solid #e0d6bc;
    font-family:var(--font-display); font-weight:500; font-size:30px; line-height:1.22; letter-spacing:-.015em; color:#f6f2e8;
  }
  .f28-office em { font-style:italic; color:#e0d6bc; }
  /* Bio line */
  .f28-bio { position:absolute; z-index:10; left:96px; right:120px; bottom:110px; padding-top:20px; border-top:1px solid rgba(224,214,188,.35);
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:28px; line-height:1.36; letter-spacing:-.01em; color:rgba(246,242,232,.94); text-shadow:0 2px 14px rgba(0,0,0,.7);
  }
</style>
</head>

        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
      <div class="f28-band-2"></div>

      <div class="f28-spine"></div>

      <div class="f28-name">
        <span class="meet">Meet <span class="dr">Dr.</span></span>
        <span class="first">Barbara</span>
        <span class="last">Kahl</span>

      <div class="f28-office">Candidate for U.S. House <em>·</em> Oregon's 1st Congressional District</div>

    </div>
