<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 15 · Be Part of Something Bigger for Oregon — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f15 { position:absolute; inset:0; z-index:5; overflow:hidden; }
  /* Right-side bleed image */
  .f15-bg { position:absolute; inset:0; z-index:1; }
  .f15-bg img { position:absolute; right:-8%; top:0; width:78%; height:100%; object-fit:cover; object-position:center; filter:saturate(.68) contrast(1.24) brightness(.7); }
  .f15-bg::before { content:''; position:absolute; inset:0; z-index:2;
    background:
      linear-gradient(90deg, #1a2820 0%, rgba(26,40,32,.98) 34%, rgba(26,40,32,.35) 55%, rgba(0,0,0,.05) 72%, rgba(0,0,0,.5) 100%),
      radial-gradient(70% 55% at 20% 20%, rgba(90,112,96,.35) 0%, transparent 70%);
  }
  /* Diagonal architectural line — accent through composition */
  .f15-diag { position:absolute; z-index:3; top:0; bottom:0; left:32%; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.35) 30%, rgba(224,214,188,.35) 70%, rgba(224,214,188,0)); transform:rotate(-7deg); transform-origin:center; }
  .f15-diag-2 { position:absolute; z-index:3; top:0; bottom:0; left:34%; width:1px; background:linear-gradient(180deg, rgba(224,214,188,0), rgba(224,214,188,.14) 30%, rgba(224,214,188,.14) 70%, rgba(224,214,188,0)); transform:rotate(-7deg); }
  /* Mast */
  .f15-mast { position:absolute; z-index:12; top:64px; left:96px; }
  .f15-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Star cluster */
  .f15-stars { position:absolute; z-index:8; top:96px; right:96px; display:grid; grid-template-columns:repeat(6, 12px); gap:14px; opacity:.7; }
  /* Kicker index */
  .f15-index { position:absolute; z-index:10; left:96px; top:210px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.6); }
  .f15-index .bar { width:56px; height:1px; background:currentColor; opacity:.6; }
  /* Huge poster typography — left half, stacked */
  .f15-word { position:absolute; z-index:10; left:96px; font-family:var(--font-display); color:#f6f2e8; letter-spacing:-.035em; line-height:.86; }
  .f15-w1 { top:290px; font-weight:500; font-size:172px; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .f15-w2 { top:462px; font-style:italic; font-weight:400; font-size:172px; color:#e0d6bc; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .f15-w3 { top:634px; font-weight:500; font-size:172px; text-shadow: 0 8px 40px rgba(0,0,0,.5); }
  .f15-for { position:absolute; z-index:10; left:96px; top:838px; font-family:var(--font-mono); font-size:18px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.7); display:flex; align-items:center; gap:18px; }
  .f15-for .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f15-oregon { position:absolute; z-index:10; left:96px; top:872px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:96px; letter-spacing:-.03em; color:#e0d6bc; line-height:1; }
  /* Bottom left corner ornament — small floating photo tile */
  .f15-tile { position:absolute; z-index:6; right:96px; bottom:170px; width:220px; padding:12px 12px 40px; background:#f6f2e8;
    box-shadow:0 30px 56px -20px rgba(0,0,0,.7), 0 6px 12px rgba(0,0,0,.4);
    transform:rotate(3deg); border:1px solid rgba(0,0,0,.08);
  }
  .f15-tile .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f15-tile .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.7) contrast(1.14); }
  /* Ghost numeral, deep right */
  .f15-num { position:absolute; z-index:2; font-family:var(--font-display); font-style:italic; font-weight:400; font-size:1200px; line-height:.72; color:rgba(224,214,188,.05); right:-260px; top:-260px; pointer-events:none; }
  /* Bottom credit rule */
  .f15-rule { position:absolute; z-index:8; left:96px; right:96px; bottom:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.4) 0%, transparent 55%); }
</style>
</head>
<body>
  <div class="canvas on-photo" style="background:#0a100c;">
    <div class="f15">
      <div class="f15-bg"><img src="../assets/img/bridge.png" alt="" /></div>
      <div class="f15-diag"></div>
      <div class="f15-diag-2"></div>

      <div class="f15-mast">
        <img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" />
      </div>

      <div class="f15-stars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f15-tile">
        <div class="p"><img src="../assets/img/community.jpg" alt="" /></div>
      </div>

      <h1 class="f15-word f15-w1">Be Part of</h1>
      <div class="f15-word f15-w2">Something</div>
      <div class="f15-word f15-w3">Bigger</div>
      <div class="f15-for"><span class="bar"></span>for</div>
      <div class="f15-oregon">Oregon</div>

      <div class="f15-rule"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
