<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 55 · Support the leaders shaping Northwest Oregon&rsquo;s future. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Cinematic full-bleed photo cover with centered stacked headline */
  .f55 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  .f55-bg { position:absolute; inset:0; z-index:1; }
  .f55-bg img { width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:saturate(.62) contrast(1.2) brightness(.6); }
  .f55-bg::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(70% 60% at 50% 55%, rgba(20,30,22,.15) 0%, rgba(20,30,22,.7) 65%, rgba(10,16,12,.92) 100%),
      linear-gradient(180deg, rgba(20,30,22,.65) 0%, rgba(20,30,22,.15) 30%, rgba(20,30,22,.15) 70%, rgba(10,16,12,.85) 100%);
  }
  /* Vignette letterbox bars */
  .f55-lbtop, .f55-lbbot { position:absolute; z-index:3; left:0; right:0; height:110px; background:#0a100c; }
  .f55-lbtop { top:0; }
  .f55-lbbot { bottom:0; }
  .f55-lbtop::after, .f55-lbbot::before { content:''; position:absolute; left:0; right:0; height:1px; background:rgba(224,214,188,.35); }
  .f55-lbtop::after { bottom:0; }
  .f55-lbbot::before { top:0; }

  /* Mast top-left inside letterbox */
  .f55-mast { position:absolute; z-index:14; top:36px; left:96px; }
  .f55-mast img { height:44px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Top-right small mono tag */
  .f55-tag { position:absolute; z-index:14; top:52px; right:96px; display:flex; align-items:center; gap:14px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f55-tag .dot { width:6px; height:6px; border-radius:50%; background:#e0d6bc; }

  /* Centered stacked headline */
  .f55-frame { position:absolute; z-index:10; inset:180px 96px 180px 96px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .f55-eyebrow { display:flex; align-items:center; gap:20px; margin-bottom:52px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.75);
  }
  .f55-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f55-headline {
    font-family:var(--font-display); font-weight:500; font-size:110px; line-height:.98; letter-spacing:-.032em; color:#f6f2e8;
    text-shadow: 0 12px 40px rgba(0,0,0,.6);
    max-width:960px;
  }
  .f55-headline em { display:inline; font-style:italic; font-weight:400; color:#e0d6bc; }
  .f55-headline .last { display:block; }

  .f55-underrule { margin-top:52px; width:120px; height:2px; background:rgba(224,214,188,.65); }

  /* Bottom letterbox meta */
  .f55-meta { position:absolute; z-index:14; bottom:36px; left:96px; right:96px; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55);
  }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f55">
      <div class="f55-bg"><img src="../assets/img/community.jpg" alt="" /></div>

      <div class="f55-lbtop"></div>
      <div class="f55-lbbot"></div>

      <div class="f55-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f55-tag"><span class="dot"></span>Support &middot; No. 55</div>

      <div class="f55-frame">
        <div class="f55-eyebrow"><span class="bar"></span>Northwest Oregon<span class="bar"></span></div>
        <h1 class="f55-headline">Support the leaders <em>shaping</em> <span class="last">Northwest Oregon&rsquo;s future.</span></h1>
        <div class="f55-underrule"></div>
      </div>

      <div class="f55-meta">
        <span>Northwest Oregon PAC</span>
        <span>MMXXVI</span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
