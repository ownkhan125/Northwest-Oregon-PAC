<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 32 · Support Northwest Oregon's Future — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Huge stacked cinematic type — one line ("Support Northwest Oregon's Future") split into stacked words
     over the community photo, dark wash for legibility, no accent text beyond mast + hairline. */
  .f32 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  .f32-bg { position:absolute; z-index:1; inset:0; }
  .f32-bg img { width:100%; height:100%; object-fit:cover; object-position:center 42%; filter:saturate(.6) contrast(1.28) brightness(.62); }
  .f32-wash { position:absolute; z-index:2; inset:0;
    background:
      radial-gradient(60% 45% at 40% 40%, rgba(20,30,22,0) 0%, rgba(6,10,7,.35) 60%, rgba(6,10,7,.72) 100%),
      linear-gradient(180deg, rgba(20,30,22,.55) 0%, rgba(20,30,22,.15) 26%, rgba(6,10,7,.55) 74%, rgba(6,10,7,.92) 100%);
  }
  /* Mast top-left */
  .f32-mast { position:absolute; z-index:14; top:64px; left:96px; }
  .f32-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Star cluster top-right */
  .f32-stars { position:absolute; z-index:14; top:92px; right:96px; display:flex; gap:14px; opacity:.7; }
  /* Corner brackets */
  .f32-brackTL { position:absolute; z-index:6; top:200px; left:80px; width:26px; height:26px; border-top:2px solid rgba(224,214,188,.55); border-left:2px solid rgba(224,214,188,.55); }
  .f32-brackBR { position:absolute; z-index:6; bottom:180px; right:80px; width:26px; height:26px; border-bottom:2px solid rgba(224,214,188,.55); border-right:2px solid rgba(224,214,188,.55); }
  /* Huge stacked poster type — one word per line */
  .f32-poster { position:absolute; z-index:10; left:96px; right:96px; top:262px; text-align:center; font-family:var(--font-display); color:#f6f2e8; letter-spacing:-.035em; line-height:.88; text-shadow: 0 10px 40px rgba(0,0,0,.65); }
  .f32-poster .l1 { display:block; font-weight:500; font-size:150px; }
  .f32-poster .l2 { display:block; font-weight:500; font-size:130px; margin-top:-4px; color:#e0d6bc; }
  .f32-poster .l3 { display:block; font-weight:500; font-size:130px; margin-top:-4px; }
  .f32-poster .l4 { display:block; font-style:italic; font-weight:500; font-size:150px; margin-top:2px; color:#e0d6bc; }
  /* Bottom hairline centered */
  .f32-rule { position:absolute; z-index:10; left:50%; transform:translateX(-50%); bottom:130px; width:220px; height:1px; background:rgba(224,214,188,.55); }
  .f32-rule::before, .f32-rule::after { content:''; position:absolute; top:50%; width:6px; height:6px; background:#e0d6bc; border-radius:50%; transform:translateY(-50%); }
  .f32-rule::before { left:-16px; }
  .f32-rule::after  { right:-16px; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f32">
      <div class="f32-bg"><img src="../assets/img/bridge.png" alt="" /></div>
      <div class="f32-wash"></div>

      <div class="f32-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f32-stars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <span class="f32-brackTL"></span>
      <span class="f32-brackBR"></span>

      <h1 class="f32-poster">
        <span class="l1">Support</span>
        <span class="l2">Northwest</span>
        <span class="l3">Oregon's</span>
        <span class="l4">Future</span>
      </h1>

      <div class="f32-rule"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
