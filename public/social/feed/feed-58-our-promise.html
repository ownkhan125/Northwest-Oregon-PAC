<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 58 · This is our promise. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Manifesto scroll — sand ground; headline top, 4 promises center, big italic For Northwest Oregon bottom */
  .f58 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 0% 100%, rgba(107,90,66,.16) 0%, transparent 60%),
      radial-gradient(70% 50% at 100% 0%, rgba(90,112,96,.15) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #e0d6bc 100%);
  }
  /* Torn paper edges — subtle scroll effect via gradient bands top+bottom */
  .f58-topfade { position:absolute; z-index:2; left:0; right:0; top:0; height:12px; background:linear-gradient(180deg, rgba(107,90,66,.18), transparent); }
  .f58-botfade { position:absolute; z-index:2; left:0; right:0; bottom:0; height:12px; background:linear-gradient(0deg, rgba(107,90,66,.18), transparent); }

  /* Deckle vertical rule center */
  .f58-spine { position:absolute; z-index:3; top:230px; bottom:230px; left:100px; width:2px;
    background: repeating-linear-gradient(180deg, rgba(46,69,56,.4) 0 4px, transparent 4px 10px);
  }

  /* Mast */
  .f58-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f58-mast img { height:56px; width:auto; }
  .f58-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.55; }

  /* Eyebrow */
  .f58-eyebrow { position:absolute; z-index:10; top:236px; left:150px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.55em; text-transform:uppercase; color:#6b5a42; font-weight:600;
  }
  .f58-eyebrow .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Headline */
  .f58-head { position:absolute; z-index:10; top:280px; left:150px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:96px; line-height:.98; letter-spacing:-.032em; color:#2e4538;
  }
  .f58-head em { font-style:italic; font-weight:400; color:#5a7060; }

  /* Rule */
  .f58-rule { position:absolute; z-index:10; top:432px; left:150px; width:120px; height:2px; background:#2e4538; opacity:.6; }

  /* Promise list */
  .f58-list { position:absolute; z-index:10; top:472px; left:150px; right:96px; display:flex; flex-direction:column; gap:6px; }
  .f58-item { display:flex; align-items:baseline; gap:24px; padding:16px 0; border-bottom:1px dashed rgba(46,69,56,.22); }
  .f58-item:last-child { border-bottom:none; }
  .f58-item .dash {
    flex:none; display:inline-block; width:42px; height:3px; background:#2e4538; align-self:center;
  }
  .f58-item .txt {
    flex:1; font-family:var(--font-display); font-weight:500; font-size:38px; line-height:1.06; letter-spacing:-.018em; color:#2a2a26;
  }
  .f58-item .txt em { font-style:italic; color:#5a7060; }

  /* Bottom stamp — big italic FOR NORTHWEST OREGON */
  .f58-for { position:absolute; z-index:10; bottom:150px; left:150px; right:96px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:70px; line-height:1; letter-spacing:-.028em; color:#2e4538;
    display:flex; align-items:baseline; gap:24px;
  }
  .f58-for::before { content:''; display:inline-block; width:60px; height:2px; background:#2e4538; align-self:center; }

  /* Baseline meta */
  .f58-baseline { position:absolute; z-index:10; bottom:86px; left:150px; right:96px; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.5);
  }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f58">
      <div class="f58-topfade"></div>
      <div class="f58-botfade"></div>
      <div class="f58-spine"></div>

      <div class="f58-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f58-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f58-eyebrow"><span class="bar"></span></div>

      <h1 class="f58-head">This is <em>our promise.</em></h1>

      <div class="f58-rule"></div>

      <div class="f58-list">
        <div class="f58-item"><span class="dash"></span><span class="txt">We&rsquo;ll keep <em>recruiting.</em></span></div>
        <div class="f58-item"><span class="dash"></span><span class="txt">We&rsquo;ll keep <em>supporting candidates.</em></span></div>
        <div class="f58-item"><span class="dash"></span><span class="txt">We&rsquo;ll keep <em>building.</em></span></div>
        <div class="f58-item"><span class="dash"></span><span class="txt">We&rsquo;ll keep <em>showing up.</em></span></div>
      </div>

      <div class="f58-for">For Northwest Oregon.</div>

      <div class="f58-baseline">
        <span></span>
        <span></span>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
