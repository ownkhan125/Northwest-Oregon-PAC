<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 07 · Small Actions. Big Impact. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f07 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 78% 12%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 55% at 5% 100%, rgba(107,90,66,.2) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #e7ddc7 100%);
  }
  /* Cross-hatch background pattern */
  .f07-hatch { position:absolute; inset:0; z-index:2; opacity:.08; pointer-events:none;
    background-image:
      linear-gradient(45deg, #2e4538 1px, transparent 1px),
      linear-gradient(-45deg, #2e4538 1px, transparent 1px);
    background-size: 32px 32px;
  }
  /* Mast top-left */
  .f07-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f07-mast img { height:60px; width:auto; }
  /* Kicker under mast */
  .f07-kick { position:absolute; z-index:12; top:220px; left:96px; display:flex; align-items:center; gap:18px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f07-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Polaroid stack — pinned to top-right, well above headline */
  .f07-stack { position:absolute; z-index:6; top:88px; right:76px; width:280px; height:340px; }
  .f07-stack .card { position:absolute; padding:10px 10px 32px; background:#faf3d8;
    box-shadow:0 30px 60px -22px rgba(46,42,20,.42), 0 6px 14px rgba(46,42,20,.18);
    border:1px solid rgba(46,42,20,.08);
  }
  .f07-stack .card .p { position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:#0f1a13; }
  .f07-stack .card .p img { width:100%; height:100%; object-fit:cover; filter:saturate(.75) contrast(1.15) brightness(.9); }
  .f07-stack .c1 { top:0; right:130px; width:150px; transform:rotate(-6deg); z-index:5; }
  .f07-stack .c2 { top:60px; right:0; width:170px; transform:rotate(5deg); z-index:6; }
  .f07-stack .c3 { top:170px; right:90px; width:140px; transform:rotate(-2deg); z-index:7; }
  /* Headline — full width, positioned below the polaroid stack */
  .f07-h1 { position:absolute; z-index:10; left:96px; right:96px; top:490px;
    font-family:var(--font-display); font-weight:500; font-size:110px; line-height:.94; letter-spacing:-.032em; color:#2e4538;
  }
  .f07-h1 .b { display:block; font-style:italic; font-weight:400; color:#5a7060; }
  /* Rule below headline */
  .f07-rule { position:absolute; z-index:10; left:96px; top:730px; height:2px; width:180px; background:#2e4538; opacity:.6; }
  /* Subhead */
  .f07-sub { position:absolute; z-index:10; left:96px; right:96px; top:762px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:46px; line-height:1.14; letter-spacing:-.02em; color:#2e4538;
  }
  .f07-sub em { font-style:normal; font-weight:500; color:#5a7060; }
  /* Bottom signature */
  .f07-sig { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f07-sig .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.6); }
  .f07-sig .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f07-sig .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f07">
      <div class="f07-hatch"></div>

      <div class="f07-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f07-stack">
        <div class="card c1"><div class="p"><img src="../assets/img/event.jpg" alt="" /></div></div>
        <div class="card c2"><div class="p"><img src="../assets/img/community.jpg" alt="" /></div></div>
        <div class="card c3"><div class="p"><img src="../assets/img/campaign.jpg" alt="" /></div></div>
      </div>

      <div class="f07-kick"><span class="bar"></span></div>

      <h1 class="f07-h1">
        <span>Small Actions.</span>
        <span class="b">Big Impact.</span>
      </h1>

      <div class="f07-rule"></div>

      <p class="f07-sub">Every <em>Contribution Matters.</em></p>

      <div class="f07-sig">
        <div class="l"><span class="bar"></span></div>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
