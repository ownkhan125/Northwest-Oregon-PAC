<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 43 · Strong Campaigns Are Built With Strong Support. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f43 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0f1a13; }
  /* Cinematic full-bleed photo */
  .f43-photo { position:absolute; z-index:2; inset:0; }
  .f43-photo img { width:100%; height:100%; object-fit:cover; object-position:50% 55%;
    filter:saturate(.55) contrast(1.24) brightness(.5);
  }
  /* Vignette + duotone washes */
  .f43-wash { position:absolute; z-index:3; inset:0;
    background:
      radial-gradient(60% 55% at 50% 50%, rgba(0,0,0,0) 0%, rgba(0,0,0,.55) 100%),
      linear-gradient(180deg, rgba(46,69,56,.4) 0%, rgba(15,26,19,.85) 100%),
      linear-gradient(90deg, rgba(0,0,0,.3), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.3));
  }
  /* Corner registration marks */
  .f43-reg { position:absolute; z-index:6; width:32px; height:32px; }
  .f43-reg::before, .f43-reg::after { content:''; position:absolute; background:rgba(246,242,232,.6); }
  .f43-reg::before { left:15px; top:0; width:2px; height:32px; }
  .f43-reg::after  { top:15px; left:0; width:32px; height:2px; }
  .f43-reg.tl { top:56px; left:56px; }
  .f43-reg.tr { top:56px; right:56px; }
  .f43-reg.bl { bottom:56px; left:56px; }
  .f43-reg.br { bottom:56px; right:56px; }
  /* Mast */
  .f43-mast { position:absolute; z-index:10; top:112px; left:120px; }
  .f43-mast img { height:56px; width:auto; filter:brightness(1.05); }
  /* Big stacked cinematic typography — center-anchored, sized so no line wraps */
  .f43-poster { position:absolute; z-index:10; left:96px; right:96px; top:50%; transform:translateY(-50%);
    text-align:center;
    font-family:var(--font-display); font-weight:600; font-size:92px; line-height:1.02; letter-spacing:-.032em; color:#f6f2e8;
    text-shadow:0 8px 40px rgba(0,0,0,.4);
  }
  .f43-poster .r1 { display:block; }
  .f43-poster .r2 { display:block; font-style:italic; font-weight:500; color:#e0d6bc; }
  .f43-poster .r3 { display:block; }
  .f43-poster .r4 { display:block; font-style:italic; font-weight:500; color:#e0d6bc; }
  /* Ornamental rules flanking — pushed out to leave room for the poster */
  .f43-topbar, .f43-botbar { position:absolute; z-index:10; left:120px; right:120px; height:1px; background:rgba(246,242,232,.35); }
  .f43-topbar { top:280px; }
  .f43-botbar { bottom:280px; }
  .f43-topbar::before, .f43-botbar::before { content:''; position:absolute; left:50%; transform:translateX(-50%); width:10px; height:10px; background:#e0d6bc; }
  .f43-topbar::before { top:-4px; transform:translateX(-50%) rotate(45deg); }
  .f43-botbar::before { bottom:-4px; transform:translateX(-50%) rotate(45deg); }
  /* Foot */
  .f43-foot { position:absolute; z-index:10; left:120px; right:120px; bottom:112px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .f43-foot .stars { display:flex; gap:10px; opacity:.85; }
</style>
</head>
<body>
  <div class="canvas s-ink on-photo">
    <div class="f43">
      <div class="f43-photo"><img src="../assets/img/us-elections.jpg" alt="" /></div>
      <div class="f43-wash"></div>

      <span class="f43-reg tl"></span>
      <span class="f43-reg tr"></span>
      <span class="f43-reg bl"></span>
      <span class="f43-reg br"></span>

      <div class="f43-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f43-topbar"></div>

      <h1 class="f43-poster">
        <span class="r1">Strong</span>
        <span class="r2">Campaigns</span>
        <span class="r3">Are Built With</span>
        <span class="r4">Strong Support.</span>
      </h1>

      <div class="f43-botbar"></div>

      <div class="f43-foot">
        <span class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </span>
        <span aria-hidden="true">
          <svg width="60" height="10" viewBox="0 0 60 10" fill="none" stroke="#e0d6bc" stroke-width="1"><path d="M0 5 L50 5"/><path d="M46 1 L54 5 L46 9"/></svg>
        </span>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
