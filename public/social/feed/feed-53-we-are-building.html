<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 53 · We are building — For Oregon — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Editorial checklist — sand ground, numbered rows, "FOR OREGON" bottom stamp */
  .f53 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 40% at 100% 0%, rgba(90,112,96,.15) 0%, transparent 65%),
      radial-gradient(60% 45% at 0% 100%, rgba(107,90,66,.14) 0%, transparent 60%),
      linear-gradient(180deg, #f6f2e8 0%, #ece4cf 100%);
  }
  .f53-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }

  /* Mast */
  .f53-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f53-mast img { height:56px; width:auto; }
  .f53-stars { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }

  /* Eyebrow / dossier tag */
  .f53-tag { position:absolute; z-index:10; top:240px; left:96px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.55); font-weight:600;
  }
  .f53-tag .bar { width:52px; height:1px; background:currentColor; opacity:.7; }

  /* Headline */
  .f53-head { position:absolute; z-index:10; top:280px; left:96px; right:96px;
    font-family:var(--font-display); font-weight:500; font-size:110px; line-height:.94; letter-spacing:-.035em; color:#2e4538;
  }
  .f53-head em { font-style:italic; font-weight:400; color:#5a7060; }

  /* Rule */
  .f53-rule { position:absolute; z-index:10; top:452px; left:96px; width:100%; height:2px;
    background:linear-gradient(90deg, #2e4538 0%, #2e4538 60px, rgba(46,69,56,.35) 60px, rgba(46,69,56,.35) 300px, rgba(46,69,56,.08) 300px);
  }

  /* Numbered list */
  .f53-list { position:absolute; z-index:10; top:490px; left:96px; right:96px; display:flex; flex-direction:column; }
  .f53-item { display:flex; align-items:baseline; gap:32px; padding:20px 0; border-bottom:1px solid rgba(46,69,56,.18); }
  .f53-item:last-child { border-bottom:none; }
  .f53-item .n {
    flex:none; width:76px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.32em; text-transform:uppercase; color:#6b5a42; font-weight:700;
  }
  .f53-item .lbl {
    flex:1; font-family:var(--font-display); font-weight:500; font-size:40px; line-height:1.1; letter-spacing:-.018em; color:#2a2a26;
  }
  .f53-item.hi .lbl { font-style:italic; font-weight:500; color:#2e4538; }

  /* Bottom stamp: FOR OREGON */
  .f53-stamp { position:absolute; z-index:10; bottom:82px; right:96px;
    display:inline-flex; align-items:center; gap:14px;
    padding:14px 26px 14px 26px;
    border:2px solid #2e4538;
    background:rgba(255,255,255,.0);
    font-family:var(--font-mono); font-size:20px; letter-spacing:.5em; text-transform:uppercase; color:#2e4538; font-weight:700;
    transform: rotate(-2deg);
    box-shadow: 0 4px 0 rgba(46,69,56,.14);
  }
  .f53-stamp::before { content:''; display:inline-block; width:8px; height:8px; background:#5a7060; border-radius:50%; }

  /* Bottom credit */
  .f53-credit { position:absolute; z-index:10; bottom:96px; left:96px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.5);
  }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f53">
      <div class="f53-hatch"></div>

      <div class="f53-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f53-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f53-tag"><span class="bar"></span>Field Report &middot; 2026</div>

      <h1 class="f53-head">We are <em>building</em></h1>
      <div class="f53-rule"></div>

      <div class="f53-list">
        <div class="f53-item hi"><span class="n">i</span><span class="lbl">Stronger candidates</span></div>
        <div class="f53-item"><span class="n">ii</span><span class="lbl">Better organization</span></div>
        <div class="f53-item hi"><span class="n">iii</span><span class="lbl">More campaign support</span></div>
        <div class="f53-item"><span class="n">iv</span><span class="lbl">Local momentum</span></div>
        <div class="f53-item hi"><span class="n">v</span><span class="lbl">A lasting regional voice</span></div>
      </div>

      <div class="f53-credit">Report &middot; No. 53</div>
      <div class="f53-stamp">FOR OREGON</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
