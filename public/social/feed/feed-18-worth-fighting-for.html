<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 18 · Northwest Oregon is worth fighting for. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f18 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 90% 8%, rgba(224,214,188,.5) 0%, transparent 60%),
      radial-gradient(70% 60% at 0% 100%, rgba(107,90,66,.14) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #e6dbc2 60%, #d9caa2 100%);
  }
  /* Bold diagonal stripes as backdrop */
  .f18-stripes { position:absolute; z-index:2; inset:0; opacity:.06; pointer-events:none;
    background: repeating-linear-gradient(115deg, #2e4538 0 3px, transparent 3px 44px);
  }
  /* Mast + stars */
  .f18-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f18-mast img { height:56px; width:auto; }
  .f18-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker */
  .f18-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .f18-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Pennant / flag SVG — large decorative element, right side */
  .f18-pennant { position:absolute; z-index:6; right:56px; top:340px; width:340px; height:auto; opacity:.9;
    filter:drop-shadow(0 30px 40px rgba(46,69,56,.25));
  }
  /* Big poster headline — left aligned, stacked */
  .f18-h1 { position:absolute; z-index:10; left:96px; right:96px; top:340px;
    font-family:var(--font-display); font-weight:600; font-size:140px; line-height:.92; letter-spacing:-.04em; color:#2e4538;
  }
  .f18-h1 .l1 { display:block; }
  .f18-h1 .l2 { display:block; font-style:italic; font-weight:500; color:#5a7060; padding-left:60px; }
  .f18-h1 .l3 { display:block; }
  /* Bottom baseline */
  .f18-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; padding-top:22px; border-top:2px solid rgba(46,69,56,.55); display:flex; align-items:center; justify-content:space-between;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:#5a7060;
  }
  .f18-baseline .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f18">
      <div class="f18-stripes"></div>

      <div class="f18-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f18-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f18-kick"><span class="bar"></span></div>

      <!-- Pennant / flag decoration -->
      <svg class="f18-pennant" viewBox="0 0 340 200" fill="none" aria-hidden="true">
        <!-- Pole -->
        <rect x="16" y="12" width="4" height="180" fill="#2e4538"/>
        <circle cx="18" cy="10" r="6" fill="#2e4538"/>
        <!-- Pennant triangle -->
        <path d="M20 24 L320 30 L240 78 L320 126 L20 132 Z" fill="#2e4538"/>
        <!-- Star cluster on pennant -->
        <g fill="#e0d6bc" transform="translate(60 62)">
          <path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/>
        </g>
        <g fill="#e0d6bc" transform="translate(96 62)">
          <path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/>
        </g>
        <g fill="#e0d6bc" transform="translate(132 62)">
          <path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/>
        </g>
      </svg>

      <h1 class="f18-h1">
        <span class="l1">Northwest</span>
        <span class="l2">Oregon is</span>
        <span class="l3">worth</span>
        <span class="l2">fighting for.</span>
      </h1>

      <div class="f18-baseline">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
