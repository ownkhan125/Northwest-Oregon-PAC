<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 29 · Ciatta Thompson — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Editorial candidate spread — MIRROR of feed-27: portrait on LEFT, editorial column on RIGHT.
     Name shown ONCE (as huge headline in right column). Top name-band on portrait replaced with a "Candidate" tag.
     Sand cream background, forest ink text. */
  .f29 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(55% 42% at 88% 88%, rgba(224,214,188,.7) 0%, transparent 60%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Left portrait pane */
  .f29-portrait { position:absolute; z-index:3; top:80px; bottom:80px; left:80px; width:440px; overflow:hidden;
    box-shadow: 0 40px 90px -40px rgba(46,42,20,.55);
    border-radius:4px; background:#0f1a13;
  }
  .f29-portrait img { width:100%; height:100%; object-fit:cover; object-position:50% 25%; filter:saturate(.78) contrast(1.15) brightness(.94); }
  .f29-portrait::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(20,30,22,.05) 0%, rgba(20,30,22,.15) 55%, rgba(6,10,7,.55) 100%);
  }
  /* Corner marks — different pair from feed-27 (TL + BR are used in 27; here use BL + TR) */
  .f29-portrait .cornerBL { position:absolute; z-index:6; bottom:14px; left:14px; width:22px; height:22px; border-bottom:2px solid rgba(224,214,188,.78); border-left:2px solid rgba(224,214,188,.78); }
  .f29-portrait .cornerTR { position:absolute; z-index:6; top:14px; right:14px; width:22px; height:22px; border-top:2px solid rgba(224,214,188,.78); border-right:2px solid rgba(224,214,188,.78); }

  /* Right editorial column — right aligned typography */
  .f29-col { position:absolute; z-index:5; top:96px; right:96px; bottom:96px; left:560px; display:flex; flex-direction:column; text-align:right; align-items:flex-end; }
  .f29-mast img { height:56px; width:auto; }
  .f29-kick { margin-top:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; flex-direction:row-reverse; }
  .f29-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Pretitle */
  .f29-pre { margin-top:26px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:34px; letter-spacing:-.015em; color:#5a7060; }
  /* Big name headline */
  .f29-h1 { margin-top:8px; font-family:var(--font-display); font-weight:500; font-size:88px; line-height:.98; letter-spacing:-.03em; color:#2e4538; text-align:right; }
  .f29-h1 em { font-style:italic; font-weight:500; color:#5a7060; }
  /* Office square-tag */
  .f29-office { margin-top:32px; display:inline-flex; align-items:center; padding:14px 22px; border:1.5px solid rgba(46,69,56,.55); background:rgba(255,255,255,.55);
    font-family:var(--font-mono); font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:#2e4538;
  }
  .f29-rule { margin-top:32px; height:2px; width:140px; background:#2e4538; opacity:.55; align-self:flex-end; }
  .f29-bio { margin-top:26px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:28px; line-height:1.32; letter-spacing:-.008em; color:#2e4538; max-width:420px; text-align:right; }
  .f29-bio em { font-style:normal; color:#5a7060; }
  /* Bottom signature row */
  .f29-sig { margin-top:auto; display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.55); flex-direction:row-reverse; }
  .f29-sig .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f29-sig .stars { margin-right:auto; display:flex; gap:12px; opacity:.5; }
  /* Diagonal accent line between columns */
  .f29-accent { position:absolute; z-index:4; top:120px; bottom:120px; left:544px; width:1px; background:linear-gradient(180deg, rgba(46,69,56,0), rgba(46,69,56,.5) 20%, rgba(46,69,56,.5) 80%, rgba(46,69,56,0)); }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f29">
      <div class="f29-portrait">
        <img src="../assets/img/ciatta-thompson.jpg" alt="" />
        <span class="cornerBL"></span>
        <span class="cornerTR"></span>
      </div>

      <div class="f29-accent"></div>

      <div class="f29-col">
        <div class="f29-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
        <div class="f29-kick"><span class="bar"></span></div>
        <div class="f29-pre">Running for</div>
        <h1 class="f29-h1">Ciatta<br/><em>Thompson</em></h1>
        <div class="f29-office">Oregon House District 33</div>
        <div class="f29-rule"></div>
        <p class="f29-bio">Committed to <em>practical leadership,</em> stronger communities, and putting the people of District 33 first.</p>
        <div class="f29-sig">
          <span class="bar"></span>
          <span class="stars" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          </span>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
