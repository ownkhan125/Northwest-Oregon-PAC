<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 10 · Economic opportunity isn't created by government — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f10 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 92% 10%, rgba(224,214,188,.5) 0%, transparent 60%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Left tall photo panel */
  .f10-photo { position:absolute; z-index:3; top:0; bottom:0; left:0; width:42%; overflow:hidden; }
  .f10-photo img { width:100%; height:100%; object-fit:cover; object-position:center 40%; filter:saturate(.7) contrast(1.2) brightness(.75); }
  .f10-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(20,30,22,.55) 0%, rgba(20,30,22,.2) 30%, rgba(20,30,22,.62) 100%),
      linear-gradient(90deg, transparent 0%, transparent 65%, rgba(237,228,207,.42) 100%);
  }
  /* Mast (on photo panel — light logo) */
  .f10-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f10-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Small photo caption tag lower left */
  .f10-tag { position:absolute; z-index:10; left:96px; bottom:96px; display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.75); }
  .f10-tag .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  /* Right column — editorial */
  .f10-col { position:absolute; z-index:6; top:96px; bottom:96px; left:calc(42% + 72px); right:96px; display:flex; flex-direction:column; }
  /* Stars top-right */
  .f10-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker + rule inside column */
  .f10-kick { margin-top:76px; display:flex; align-items:center; gap:18px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f10-kick .bar { width:56px; height:1px; background:currentColor; opacity:.75; }
  .f10-orn { margin-top:28px; height:2px; width:140px; background:#2e4538; opacity:.55; }
  /* Giant italic open-quote glyph */
  .f10-glyph { position:absolute; z-index:4; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:520px; line-height:.6; color:rgba(46,69,56,.1); left:calc(42% + 40px); top:130px; pointer-events:none; user-select:none; }
  /* Body statement — main quote */
  .f10-body { margin-top:38px; font-family:var(--font-display); font-weight:500; font-size:44px; line-height:1.16; letter-spacing:-.018em; color:#2e4538; }
  .f10-body em { font-style:italic; color:#5a7060; }
  /* Divider between body and pull */
  .f10-div { margin-top:auto; padding-top:26px; border-top:1.5px solid rgba(46,69,56,.4); }
  /* Pull-quote — italic emphasis at bottom */
  .f10-pull { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:36px; line-height:1.22; letter-spacing:-.015em; color:#2e4538; }
  .f10-pull em { font-style:normal; color:#6b5a42; }
  /* Bottom stars in column */
  .f10-colstars { margin-top:22px; display:flex; gap:10px; opacity:.55; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f10">
      <div class="f10-photo"><img src="../assets/img/who-we-are.jpg" alt="" /></div>

      <div class="f10-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f10-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f10-tag"><span class="bar"></span></div>

      <div class="f10-glyph">&ldquo;</div>

      <div class="f10-col">
        <div class="f10-kick"><span class="bar"></span></div>
        <div class="f10-orn"></div>
        <p class="f10-body">Economic opportunity <em>isn't created by government,</em> it is created by the people willing to work hard, take risks, and build something meaningful.</p>
        <div class="f10-div">
          <p class="f10-pull">Our job is to remove barriers so they can succeed.</p>
          <div class="f10-colstars" aria-hidden="true">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
            <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
