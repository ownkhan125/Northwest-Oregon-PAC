<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Northwest Oregon deserves to compete — Northwest Oregon PAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;background:rgba(255,255,255,1);
    font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:rgba(241,238,228,1);border-radius:6px;"></div>
<img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:88px;width:162px;height:48px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:525px;width:904px;height:184px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:72px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0px;line-height:92.15999603271484px;text-align:left;white-space:pre-wrap;font-style:normal;text-transform:none;margin:0">Northwest Oregon deserves to <span style="color:rgba(78,96,81,1);">compete.</span></p></div>
<div style="position:absolute;left:88px;top:781px;width:223px;height:44px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:34px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0px;line-height:43.52000045776367px;text-align:center;white-space:pre;font-style:normal;text-transform:none;margin:0">Every district</p></div>
<div style="position:absolute;left:350px;top:781px;width:301px;height:44px;border-right:1px solid rgba(78,96,81,1);border-left:1px solid rgba(78,96,81,1);"></div>
<div style="position:absolute;left:407px;top:781px;width:188px;height:44px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:34px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0px;line-height:43.52000045776367px;text-align:center;white-space:pre;font-style:normal;text-transform:none;margin:0">Every voter</p></div>
<div style="position:absolute;left:686px;top:781px;width:233px;height:44px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:34px;font-weight:700;color:rgba(42,42,38,1);letter-spacing:0px;line-height:43.52000045776367px;text-align:center;white-space:pre;font-style:normal;text-transform:none;margin:0">Every election</p></div>
</div></div>
<script>(function(){var W=1080,H=1350,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
</body>
</html>
