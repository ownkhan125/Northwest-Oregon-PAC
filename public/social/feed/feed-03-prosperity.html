<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 03 · Prosperity Starts Here. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f03 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Full-bleed cinematic hero */
  .f03-bg { position:absolute; z-index:1; inset:0; }
  .f03-bg img { width:100%; height:100%; object-fit:cover; object-position:center 55%; filter:saturate(.6) contrast(1.3) brightness(.5); }
  .f03-bg::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(10,16,12,.85) 0%, rgba(10,16,12,.2) 22%, rgba(10,16,12,.35) 55%, rgba(6,10,7,.98) 100%),
      radial-gradient(60% 45% at 90% 12%, rgba(224,214,188,.14) 0%, transparent 65%);
  }
  /* Vertical film scan */
  .f03-scan { position:absolute; z-index:2; inset:0; opacity:.08; pointer-events:none;
    background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(0,0,0,.55) 4px 5px);
    mix-blend-mode:multiply;
  }
  /* Mast + stars */
  .f03-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f03-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.7)); }
  .f03-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.65; }
  /* Corner registration marks */
  .f03-reg { position:absolute; z-index:6; width:38px; height:38px; }
  .f03-reg::before, .f03-reg::after { content:''; position:absolute; background:rgba(224,214,188,.4); }
  .f03-reg::before { left:18px; top:0; width:2px; height:38px; }
  .f03-reg::after  { top:18px; left:0; width:38px; height:2px; }
  .f03-reg.tr { top:200px; right:96px; }
  .f03-reg.bl { bottom:200px; left:96px; }
  /* Editorial hairline spanning wide */
  .f03-rule-top { position:absolute; z-index:6; left:96px; right:96px; top:1080px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.6), rgba(224,214,188,0) 78%); }
  /* Low editorial title lockup */
  .f03-kick { position:absolute; z-index:10; left:96px; bottom:520px; display:flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7); }
  .f03-kick .bar { width:64px; height:1px; background:currentColor; opacity:.75; }
  .f03-title { position:absolute; z-index:10; left:96px; right:96px; bottom:220px;
    font-family:var(--font-display); font-weight:500; font-size:172px; line-height:.92; letter-spacing:-.036em; color:#f6f2e8;
    text-shadow: 0 8px 44px rgba(0,0,0,.7);
  }
  .f03-title .starts { display:block; font-style:italic; font-weight:400; color:#e0d6bc; margin-top:6px; }
  .f03-title .dot { color:#e0d6bc; }
  /* Divider hairline above kicker */
  .f03-divider { position:absolute; z-index:8; left:96px; right:520px; bottom:585px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.55) 0%, rgba(224,214,188,0) 90%); }
  /* Baseline signature */
  .f03-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f03-baseline .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f03-baseline .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f03-baseline .r { font-family:var(--font-mono); font-size:13px; letter-spacing:.42em; text-transform:uppercase; color:rgba(224,214,188,.55); }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f03">
      <div class="f03-bg"><img src="../assets/img/hero.jpg" alt="" /></div>
      <div class="f03-scan"></div>

      <span class="f03-reg tr"></span>
      <span class="f03-reg bl"></span>

      <div class="f03-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f03-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f03-divider"></div>
      <div class="f03-kick"><span class="bar"></span></div>
      <h1 class="f03-title">Prosperity<span class="starts">Starts Here<span class="dot">.</span></span></h1>

      <div class="f03-baseline">
        <div class="l"><span class="bar"></span></div>
        <div class="r"></div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
