<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 06 · We Exist For NorthWest Oregon — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f06 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 88% 12%, rgba(224,214,188,.55) 0%, transparent 60%),
      linear-gradient(180deg, #f4ecd1 0%, #dfd0a3 100%);
  }
  /* Subtle ribbon accent — moved BELOW the title, no overlap */
  .f06-ribbon { position:absolute; z-index:3; left:-100px; right:-100px; bottom:170px; height:8px; background:#6b5a42; opacity:.55; transform:rotate(-3deg); pointer-events:none; }
  /* Manifesto stripes on left edge (american flag nod, muted) */
  .f06-stripes { position:absolute; z-index:2; left:0; top:0; bottom:0; width:16px;
    background:repeating-linear-gradient(180deg, #2e4538 0 40px, transparent 40px 80px);
    opacity:.7;
  }
  /* Mast + stars */
  .f06-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f06-mast img { height:60px; width:auto; }
  .f06-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.65; }
  /* Corner registration marks (all 4) */
  .f06-reg { position:absolute; z-index:6; width:34px; height:34px; }
  .f06-reg::before, .f06-reg::after { content:''; position:absolute; background:rgba(46,69,56,.45); }
  .f06-reg::before { left:16px; top:0; width:2px; height:34px; }
  .f06-reg::after  { top:16px; left:0; width:34px; height:2px; }
  .f06-reg.tl { top:200px; left:96px; }
  .f06-reg.tr { top:200px; right:96px; }
  .f06-reg.bl { bottom:200px; left:96px; }
  .f06-reg.br { bottom:200px; right:96px; }
  /* Massive stacked poster title */
  .f06-title { position:absolute; z-index:12; left:96px; right:96px; top:280px;
    font-family:var(--font-display); font-weight:600; font-size:158px; line-height:.86; letter-spacing:-.038em; color:#2e4538;
  }
  .f06-title .r1 { display:block; }
  .f06-title .r2 { display:block; font-weight:500; color:#2e4538; }
  .f06-title .r3 { display:block; font-style:italic; font-weight:400; color:#5a7060;
    letter-spacing:-.03em;
    margin-top:12px;
  }
  .f06-title .r4 { display:block; font-style:italic; font-weight:400; color:#5a7060;
    letter-spacing:-.03em;
  }
  /* Baseline signature row */
  .f06-base { position:absolute; z-index:14; left:96px; right:96px; bottom:96px; padding-top:22px; border-top:1.5px solid rgba(46,69,56,.5);
    display:flex; align-items:center; justify-content:space-between;
  }
  .f06-base .l, .f06-base .r { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(46,69,56,.65); }
  .f06-base .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f06-base .r { gap:6px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f06">
      <div class="f06-stripes"></div>
      <div class="f06-ribbon"></div>

      <span class="f06-reg tl"></span>
      <span class="f06-reg tr"></span>
      <span class="f06-reg bl"></span>
      <span class="f06-reg br"></span>

      <div class="f06-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f06-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <h1 class="f06-title">
        <span class="r1">We</span>
        <span class="r2">Exist For</span>
        <span class="r3">NorthWest</span>
        <span class="r4">Oregon</span>
      </h1>

      <div class="f06-base">
        <div class="l"><span class="bar"></span></div>
        <div class="r" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
