<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 48 · A credible candidate should never have to build alone. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f48 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#efe8d5; }
  /* Left tall portrait photo panel (40%) */
  .f48-photo { position:absolute; z-index:2; top:0; bottom:0; left:0; width:40%; overflow:hidden; }
  .f48-photo img { width:100%; height:100%; object-fit:cover; object-position:50% 40%;
    filter:saturate(.72) contrast(1.15) brightness(.82);
  }
  .f48-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(15,26,19,.55) 0%, rgba(15,26,19,.15) 30%, rgba(15,26,19,.55) 100%),
      linear-gradient(90deg, transparent 60%, rgba(239,232,213,.35) 100%);
  }
  /* Photo mast */
  .f48-photo-mast { position:absolute; z-index:8; left:56px; top:96px; }
  .f48-photo-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Photo caption bottom */
  .f48-photo-cap { position:absolute; z-index:8; left:56px; right:60px; bottom:96px;
    padding-top:18px; border-top:1px solid rgba(246,242,232,.5);
    display:flex; align-items:center; gap:14px;
  }
  .f48-photo-cap .dot { width:8px; height:8px; background:#e0d6bc; }
  .f48-photo-cap .rule { flex:1; height:1px; background:rgba(246,242,232,.35); }
  /* Right editorial column */
  .f48-col { position:absolute; z-index:6; top:120px; right:80px; bottom:120px; left:calc(40% + 60px);
    display:flex; flex-direction:column;
  }
  .f48-eyebrow { display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f48-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f48-head { margin-top:26px; font-family:var(--font-display); font-weight:500; font-size:64px; line-height:1; letter-spacing:-.028em; color:#2e4538; }
  .f48-head em { font-style:italic; font-weight:400; color:#5a7060; }
  .f48-orn { margin-top:30px; height:2px; width:100px; background:#2e4538; opacity:.55; }
  .f48-intro { margin-top:30px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:26px; line-height:1.24; letter-spacing:-.008em; color:#5a7060; padding-bottom:22px; border-bottom:1px solid rgba(46,69,56,.22); }
  .f48-list { margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .f48-item { display:flex; align-items:center; gap:18px; padding:12px 0; border-bottom:1px solid rgba(46,69,56,.14); }
  .f48-item:last-child { border-bottom:none; }
  .f48-item .n { flex:none; width:34px; font-family:var(--font-display); font-style:italic; font-weight:500; font-size:22px; color:#5a7060; text-align:right; }
  .f48-item .ico { flex:none; width:40px; height:40px; display:flex; align-items:center; justify-content:center; color:#2e4538; opacity:.75; }
  .f48-item .ico svg { width:32px; height:32px; }
  .f48-item .txt { flex:1; font-family:var(--font-display); font-weight:500; font-size:32px; line-height:1.14; letter-spacing:-.01em; color:#2e4538; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f48">
      <div class="f48-photo"><img src="../assets/img/event.jpg" alt="" /></div>
      <div class="f48-photo-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f48-photo-cap">
        <span class="dot"></span><span class="rule"></span>
      </div>

      <div class="f48-col">
        <div class="f48-eyebrow"><span class="bar"></span></div>
        <h1 class="f48-head">A credible candidate should never have to <em>build alone.</em></h1>
        <div class="f48-orn"></div>
        <p class="f48-intro">We help candidates with</p>

        <div class="f48-list">
          <div class="f48-item">
            <span class="n">i.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20 L12 6 L20 20 z"/><path d="M8 15 L16 15"/></svg></span>
            <span class="txt">campaign strategy,</span>
          </div>
          <div class="f48-item">
            <span class="n">ii.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="7" width="18" height="12" rx="1"/><circle cx="12" cy="13" r="3"/></svg></span>
            <span class="txt">fundraising,</span>
          </div>
          <div class="f48-item">
            <span class="n">iii.</span>
            <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 5 L21 5 L21 17 L14 17 L11 21 L11 17 L3 17 z"/></svg></span>
            <span class="txt">communications.</span>
          </div>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
