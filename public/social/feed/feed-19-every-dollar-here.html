<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 19 · Every dollar raised here... — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f19 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 8%, rgba(224,214,188,.6) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(107,90,66,.16) 0%, transparent 60%),
      linear-gradient(180deg, #f8f4ea 0%, #ede4cf 100%);
  }
  /* Editorial dot grid */
  .f19-grid { position:absolute; inset:0; z-index:2; opacity:.06; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 26px 26px;
  }
  /* Mast + stars */
  .f19-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f19-mast img { height:60px; width:auto; }
  .f19-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Kicker + top rule */
  .f19-kick { position:absolute; z-index:10; top:240px; left:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060; }
  .f19-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f19-toprule { position:absolute; z-index:6; top:296px; left:96px; right:96px; height:2px; background:#2e4538; opacity:.5; }
  /* Three-column narrative */
  .f19-cols { position:absolute; z-index:10; left:96px; right:96px; top:340px; bottom:200px; display:grid; grid-template-columns:1fr 1px 1fr 1px 1fr; gap:36px; }
  .f19-vrule { background:linear-gradient(180deg, rgba(46,69,56,.14), rgba(46,69,56,.5) 22%, rgba(46,69,56,.5) 78%, rgba(46,69,56,.14)); }
  .f19-col { display:flex; flex-direction:column; }
  .f19-col .n { font-family:var(--font-display); font-style:italic; font-weight:400; font-size:120px; line-height:.85; letter-spacing:-.04em; color:rgba(46,69,56,.12); }
  .f19-col .top { margin-top:12px; font-family:var(--font-display); font-weight:500; font-size:40px; line-height:1.06; letter-spacing:-.015em; color:#2e4538; }
  .f19-col .top em { font-style:italic; font-weight:400; color:#5a7060; }
  .f19-col .arrow { margin-top:auto; padding-top:22px; display:flex; align-items:center; gap:16px; color:#5a7060; }
  .f19-col .arrow svg { display:block; flex:none; }
  .f19-col .arrow-txt { font-family:var(--font-display); font-weight:500; font-size:30px; line-height:1.14; letter-spacing:-.014em; color:#2e4538; }
  .f19-col .arrow-txt em { font-style:italic; font-weight:400; color:#5a7060; }
  /* Bottom baseline rule */
  .f19-baseline { position:absolute; z-index:6; bottom:160px; left:96px; right:96px; height:1px; background:linear-gradient(90deg, rgba(46,69,56,.5), rgba(46,69,56,0) 60%, rgba(46,69,56,.5)); opacity:.6; }
  .f19-foot { position:absolute; z-index:10; bottom:96px; left:96px; right:96px; display:flex; align-items:center; justify-content:space-between; }
  .f19-foot .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6); }
  .f19-foot .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  .f19-foot .r { display:flex; gap:6px; opacity:.5; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f19">
      <div class="f19-grid"></div>

      <div class="f19-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f19-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f19-kick"><span class="bar"></span></div>
      <div class="f19-toprule"></div>

      <div class="f19-cols">
        <div class="f19-col">
          <div class="n">01</div>
          <div class="top">Every dollar raised <em>here...</em></div>
          <div class="arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            <span class="arrow-txt">helps build <em>campaigns here.</em></span>
          </div>
        </div>
        <div class="f19-vrule"></div>
        <div class="f19-col">
          <div class="n">02</div>
          <div class="top">Every candidate supported <em>here...</em></div>
          <div class="arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            <span class="arrow-txt">helps strengthen <em>communities here.</em></span>
          </div>
        </div>
        <div class="f19-vrule"></div>
        <div class="f19-col">
          <div class="n">03</div>
          <div class="top">Every conversation started <em>here...</em></div>
          <div class="arrow">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
            <span class="arrow-txt">helps <em>Northwest Oregon</em> move forward.</span>
          </div>
        </div>
      </div>

      <div class="f19-baseline"></div>
      <div class="f19-foot">
        <div class="l"><span class="bar"></span></div>
        <div class="r" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
