<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 16 · We support practical solutions — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f16 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0f1a13; }
  /* Left photo panel — 44% width */
  .f16-photo { position:absolute; z-index:1; left:0; top:0; bottom:0; width:44%; overflow:hidden; }
  .f16-photo img { width:100%; height:100%; object-fit:cover; object-position:60% 50%; filter:saturate(.6) contrast(1.2) brightness(.55); }
  .f16-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(90deg, rgba(15,26,19,.2) 0%, rgba(15,26,19,.65) 90%, #0f1a13 100%);
  }
  /* Right dark column */
  .f16-col { position:absolute; z-index:2; right:0; top:0; bottom:0; left:44%;
    background:
      radial-gradient(80% 60% at 100% 0%, rgba(90,112,96,.22) 0%, transparent 60%),
      linear-gradient(178deg, #1c2b23 0%, #0e1712 100%);
  }
  /* Hatch overlay */
  .f16-hatch { position:absolute; z-index:3; right:0; top:0; bottom:0; left:44%; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  /* Mast — placed on dark column */
  .f16-mast { position:absolute; z-index:14; top:96px; left:calc(44% + 60px); }
  .f16-mast img { height:52px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  /* Vertical eyebrow — on photo panel */
  .f16-vert { position:absolute; z-index:10; left:64px; top:60%; transform:translateY(-50%) rotate(-90deg); transform-origin:left top;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.75);
    display:flex; align-items:center; gap:22px; white-space:nowrap;
  }
  .f16-vert .bar { width:80px; height:1px; background:currentColor; opacity:.7; }
  /* Small stars on photo */
  .f16-star { position:absolute; z-index:14; top:110px; left:60px; display:flex; gap:12px; opacity:.55; }
  /* Kicker */
  .f16-kick { position:absolute; z-index:10; top:230px; left:calc(44% + 60px); display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f16-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  /* Pull-quote opener */
  .f16-opener { position:absolute; z-index:10; top:284px; left:calc(44% + 60px); right:60px;
    font-family:var(--font-display); font-weight:500; font-style:italic; font-size:44px; line-height:1.1; letter-spacing:-.02em; color:#e0d6bc;
  }
  /* Rule */
  .f16-rule { position:absolute; z-index:10; top:404px; left:calc(44% + 60px); width:180px; height:2px; background:rgba(224,214,188,.55); }
  /* Body paragraph */
  .f16-body { position:absolute; z-index:10; top:452px; left:calc(44% + 60px); right:60px;
    font-family:var(--font-display); font-weight:500; font-size:34px; line-height:1.28; letter-spacing:-.012em; color:#f6f2e8;
  }
  .f16-body em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Footer detail */
  .f16-footer { position:absolute; z-index:10; bottom:96px; left:calc(44% + 60px); right:60px; padding-top:20px; border-top:1px solid rgba(224,214,188,.28); display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55);
  }
  .f16-footer .stars { display:flex; gap:10px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f16">
      <div class="f16-photo"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f16-col"></div>
      <div class="f16-hatch"></div>

      <div class="f16-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f16-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f16-kick"><span class="bar"></span></div>
      <p class="f16-opener">We support practical solutions</p>
      <div class="f16-rule"></div>
      <p class="f16-body">that help law enforcement, first responders, and local communities <em>work together</em> to reduce crime, improve public spaces, and keep Northwest Oregon a place where families and businesses can grow.</p>

      <div class="f16-footer">
        <span>—</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
