<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 40 · Invest in Northwest Oregon. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f40 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 8% 6%, rgba(224,214,188,.7) 0%, transparent 60%),
      linear-gradient(180deg, #f6f2e8 0%, #ece2ca 100%);
  }
  /* Fine editorial dot grid */
  .f40-grid { position:absolute; inset:0; z-index:2; opacity:.06; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 22px 22px;
  }
  /* Right tall photo panel (2/5 canvas width) */
  .f40-photo { position:absolute; z-index:4; top:0; bottom:0; right:0; width:38%; overflow:hidden; }
  .f40-photo img { width:100%; height:100%; object-fit:cover; object-position:50% 45%;
    filter:saturate(.7) contrast(1.14) brightness(.82);
  }
  .f40-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(270deg, rgba(20,30,22,.2) 0%, rgba(20,30,22,.35) 100%),
      linear-gradient(90deg, rgba(236,226,202,.35) 0%, transparent 40%);
  }
  /* Photo caption strip — decorative registration */
  .f40-caption { position:absolute; z-index:8; right:56px; bottom:96px; display:flex; align-items:center; gap:14px; }
  .f40-caption .dot { width:8px; height:8px; background:rgba(246,242,232,.85); }
  .f40-caption .rule { display:inline-block; width:44px; height:1px; background:rgba(246,242,232,.6); }
  /* Mast */
  .f40-mast { position:absolute; z-index:12; top:96px; left:96px; }
  .f40-mast img { height:56px; width:auto; }
  /* Kicker */
  .f40-kick { position:absolute; z-index:10; top:230px; left:96px;
    display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .f40-kick .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .f40-kick .idx { font-size:12px; letter-spacing:.4em; color:rgba(46,69,56,.5); }
  /* Big serif hero */
  .f40-head { position:absolute; z-index:10; top:290px; left:96px; width:560px;
    font-family:var(--font-display); font-weight:500; font-size:74px; line-height:1; letter-spacing:-.028em; color:#2e4538;
  }
  .f40-head em { font-style:italic; font-weight:400; color:#5a7060; display:block; }
  /* Body paragraph — magazine style */
  .f40-body { position:absolute; z-index:10; left:96px; top:530px; width:560px;
    padding-top:28px; border-top:2px solid #2e4538;
    font-family:var(--font-display); font-weight:500; font-size:26px; line-height:1.28; letter-spacing:-.006em; color:#2e4538;
  }
  /* Bottom italic closer */
  .f40-closer { position:absolute; z-index:10; left:96px; bottom:96px; width:560px;
    padding-top:22px; border-top:1px solid rgba(46,69,56,.35);
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:36px; line-height:1.12; letter-spacing:-.015em; color:#5a7060;
  }
  .f40-closer .mark { display:block; width:80px; height:2px; background:#2e4538; opacity:.5; margin-bottom:22px; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f40">
      <div class="f40-grid"></div>

      <div class="f40-photo"><img src="../assets/img/campaign.jpg" alt="" /></div>
      <div class="f40-caption"><span class="dot"></span><span class="rule"></span></div>

      <div class="f40-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f40-kick"><span class="bar"></span></div>

      <h1 class="f40-head">Invest in <em>Northwest Oregon.</em></h1>

      <p class="f40-body">Every contribution helps strengthen local campaigns, recruit future leaders, support grassroots volunteers, and expand our reach across the region.</p>

      <p class="f40-closer"><span class="mark"></span>Help build something that lasts.</p>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
