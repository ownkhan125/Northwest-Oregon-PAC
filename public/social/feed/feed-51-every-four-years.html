<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 51 · Northwest Oregon — Every Four Years — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Half-photo asymmetric split — photo panel right (44%), editorial column left */
  .f51 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 8% 8%, rgba(224,214,188,.55) 0%, transparent 60%),
      linear-gradient(178deg, #f6f2e8 0%, #ece4cf 100%);
  }
  /* Tall photo panel right */
  .f51-photo { position:absolute; z-index:2; right:0; top:0; bottom:0; width:44%; overflow:hidden; }
  .f51-photo img { width:100%; height:100%; object-fit:cover; object-position:center; filter:saturate(.7) contrast(1.16) brightness(.82); }
  .f51-photo::after { content:''; position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(30,42,32,.05) 0%, rgba(30,42,32,.35) 100%),
      linear-gradient(90deg, rgba(246,242,232,.35) 0%, transparent 20%);
  }
  /* Fine seam between photo + column */
  .f51-seam { position:absolute; z-index:3; right:44%; top:0; bottom:0; width:1px; background:linear-gradient(180deg, transparent, rgba(46,69,56,.32) 15%, rgba(46,69,56,.32) 85%, transparent); }

  /* Mast */
  .f51-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f51-mast img { height:56px; width:auto; }

  /* Corner registration marks */
  .f51-reg { position:absolute; z-index:8; font-family:var(--font-mono); font-size:20px; color:rgba(46,69,56,.4); letter-spacing:.2em; }
  .f51-reg.tr { top:96px; right:36%; }
  .f51-reg.bl { bottom:96px; left:96px; }

  /* Mono eyebrow */
  .f51-eyebrow { position:absolute; z-index:10; top:236px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:15px; letter-spacing:.55em; text-transform:uppercase; color:#5a7060; font-weight:600;
  }
  .f51-eyebrow .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  .f51-eyebrow .dot { width:5px; height:5px; border-radius:50%; background:currentColor; opacity:.8; }

  /* Editorial manifesto: headline + body */
  .f51-head { position:absolute; z-index:10; top:320px; left:96px; right:calc(44% + 60px);
    font-family:var(--font-display); font-weight:500; font-size:76px; line-height:.98; letter-spacing:-.028em; color:#2e4538;
  }
  .f51-head em { font-style:italic; font-weight:400; color:#5a7060; }

  /* Editorial rule */
  .f51-rule { position:absolute; z-index:10; top:640px; left:96px; width:120px; height:2px; background:#2e4538; opacity:.65; }

  /* Body */
  .f51-body { position:absolute; z-index:10; top:672px; left:96px; right:calc(44% + 60px);
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:32px; line-height:1.34; letter-spacing:-.006em; color:#2a2a26;
  }
  .f51-body em { font-style:normal; font-weight:600; color:#2e4538; }

  /* Bottom credit */
  .f51-credit { position:absolute; z-index:10; bottom:96px; left:96px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.45em; text-transform:uppercase; color:rgba(46,69,56,.55);
  }
  .f51-credit .bar { width:44px; height:1px; background:currentColor; opacity:.6; }

  /* Vertical column mark on photo */
  .f51-vmark { position:absolute; z-index:10; bottom:96px; right:96px;
    writing-mode: vertical-rl; transform:rotate(180deg);
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(246,242,232,.75);
  }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f51">
      <div class="f51-photo"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="f51-seam"></div>

      <div class="f51-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f51-reg tr">+</div>
      <div class="f51-reg bl">+</div>

      <div class="f51-eyebrow"><span class="bar"></span>NORTHWEST OREGON<span class="dot"></span></div>

      <h1 class="f51-head">Our communities deserve more than attention <em>every four years.</em></h1>

      <div class="f51-rule"></div>

      <p class="f51-body">They deserve <em>consistent leadership,</em> local investment, and representatives who never stop showing up.</p>

      <div class="f51-credit"><span class="bar"></span>Manifesto · No. 51</div>
      <div class="f51-vmark">Northwest Oregon PAC</div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
