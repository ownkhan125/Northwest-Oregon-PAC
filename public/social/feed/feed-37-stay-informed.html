<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 37 · Stay informed. Stay connected. Stay updated. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Three-part manifesto — "Stay informed. / Stay connected. / Stay updated." stacked huge upper 2/3,
     descriptive paragraph as a hairline-framed block below, icon strip at bottom (Facebook / Website / Email)
     with labels — the labels come DIRECTLY from the PDF spec line "Facebook · Website · Email Updates". */
  .f37 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 25% 20%, rgba(90,112,96,.35) 0%, transparent 60%),
      radial-gradient(60% 45% at 80% 85%, rgba(107,90,66,.25) 0%, transparent 65%),
      linear-gradient(180deg, #253a2e 0%, #1a2820 100%);
  }
  /* Mast top-left */
  .f37-mast { position:absolute; z-index:14; top:64px; left:96px; }
  .f37-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.5)); }
  /* Star cluster top-right */
  .f37-stars { position:absolute; z-index:14; top:80px; right:96px; display:grid; grid-template-columns:repeat(5,10px); gap:12px; opacity:.65; }
  /* Kicker line under mast */
  .f37-kick { position:absolute; z-index:12; left:96px; top:212px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.72); }
  .f37-kick .bar { width:60px; height:1px; background:currentColor; opacity:.6; }
  /* Three-line manifesto */
  .f37-manifesto { position:absolute; z-index:10; left:96px; right:96px; top:260px; font-family:var(--font-display); color:#f6f2e8; letter-spacing:-.032em; line-height:.98; }
  .f37-manifesto .l { display:block; font-weight:500; font-size:104px; }
  .f37-manifesto .l em { font-style:italic; color:#e0d6bc; font-weight:500; }
  .f37-manifesto .l + .l { margin-top:6px; }
  /* Description block, hairline framed */
  .f37-desc { position:absolute; z-index:10; left:96px; right:96px; top:640px; padding:24px 0 0; border-top:1px solid rgba(224,214,188,.4);
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:26px; line-height:1.36; letter-spacing:-.008em; color:rgba(246,242,232,.92);
    max-width:820px;
  }
  /* Icon strip */
  .f37-strip { position:absolute; z-index:10; left:96px; right:96px; bottom:120px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;
    border-top:1px solid rgba(224,214,188,.4);
    padding-top:36px;
  }
  .f37-cell { display:flex; flex-direction:column; align-items:center; gap:16px; position:relative; padding:0 20px; }
  .f37-cell + .f37-cell::before { content:''; position:absolute; left:0; top:6px; bottom:6px; width:1px; background:rgba(224,214,188,.28); }
  .f37-cell .ico { width:52px; height:52px; display:flex; align-items:center; justify-content:center; border:1px solid rgba(224,214,188,.4); border-radius:50%; }
  .f37-cell .ico svg { display:block; }
  .f37-cell .lbl { font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.85); text-align:center; }
  /* Bottom-most tiny detail row */
  .f37-baseline { position:absolute; z-index:12; left:0; right:0; bottom:56px; text-align:center; display:flex; justify-content:center; gap:14px; opacity:.5; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f37">
      <div class="f37-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="f37-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f37-kick"><span class="bar"></span></div>

      <h1 class="f37-manifesto">
        <span class="l">Stay <em>informed.</em></span>
        <span class="l">Stay <em>connected.</em></span>
        <span class="l">Stay <em>updated.</em></span>
      </h1>

      <p class="f37-desc">Follow Northwest Oregon PAC for candidate updates, local events, campaign news, and the issues shaping our communities.</p>

      <div class="f37-strip">
        <div class="f37-cell">
          <div class="ico" aria-hidden="true">
            <!-- Facebook -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0d6bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
          </div>
          <div class="lbl">Facebook</div>
        </div>
        <div class="f37-cell">
          <div class="ico" aria-hidden="true">
            <!-- Website / globe -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0d6bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          </div>
          <div class="lbl">Website</div>
        </div>
        <div class="f37-cell">
          <div class="ico" aria-hidden="true">
            <!-- Envelope -->
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#e0d6bc" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <div class="lbl">Email Updates</div>
        </div>
      </div>

      <div class="f37-baseline" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
