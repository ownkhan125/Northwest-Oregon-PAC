<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 49 · Let builders build. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f49 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(80% 60% at 50% 0%, rgba(224,214,188,.55) 0%, transparent 60%),
      radial-gradient(70% 55% at 50% 100%, rgba(107,90,66,.14) 0%, transparent 55%),
      linear-gradient(180deg, #f6f2e8 0%, #eee4cc 100%);
  }
  /* Fine editorial dot grid */
  .f49-grid { position:absolute; inset:0; z-index:2; opacity:.07; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 26px 26px;
  }
  /* Corner marks */
  .f49-mark { position:absolute; z-index:6; width:24px; height:24px; }
  .f49-mark::before, .f49-mark::after { content:''; position:absolute; background:#2e4538; opacity:.6; }
  .f49-mark::before { left:11px; top:0; width:2px; height:24px; }
  .f49-mark::after  { top:11px; left:0; width:24px; height:2px; }
  .f49-mark.tl { top:56px; left:56px; }
  .f49-mark.tr { top:56px; right:56px; }
  .f49-mark.bl { bottom:56px; left:56px; }
  .f49-mark.br { bottom:56px; right:56px; }
  /* Mast */
  .f49-mast { position:absolute; z-index:12; top:96px; left:120px; }
  .f49-mast img { height:56px; width:auto; }
  /* Custom SVG seal on top right */
  .f49-seal { position:absolute; z-index:8; top:96px; right:120px; width:100px; height:100px; opacity:.85; }
  /* Mono kicker eyebrow — centered */
  .f49-kick { position:absolute; z-index:10; top:280px; left:96px; right:96px; text-align:center; }
  .f49-kick .row { display:inline-flex; align-items:center; gap:22px; font-family:var(--font-mono); font-size:16px; letter-spacing:.6em; text-transform:uppercase; color:#5a7060; }
  .f49-kick .row .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Big italic centerpiece — stacked */
  .f49-center { position:absolute; z-index:10; left:96px; right:96px; top:370px; text-align:center;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:150px; line-height:.94; letter-spacing:-.035em; color:#2e4538;
  }
  .f49-center .l1 { display:block; }
  .f49-center .l2 { display:block; color:#5a7060; }
  /* Under-headline ornament */
  .f49-orn { position:absolute; z-index:10; left:50%; transform:translateX(-50%); top:700px; width:200px; height:1px; background:#2e4538; opacity:.55; }
  .f49-orn::before { content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%) rotate(45deg); width:12px; height:12px; background:#eee4cc; border:1.5px solid #2e4538; }
  /* Supporting paragraph */
  .f49-body { position:absolute; z-index:10; left:200px; right:200px; top:770px; text-align:center;
    font-family:var(--font-display); font-weight:500; font-size:34px; line-height:1.28; letter-spacing:-.008em; color:#2e4538;
  }
  .f49-body em { font-style:italic; font-weight:400; color:#5a7060; }
  /* Foot */
  .f49-foot { position:absolute; z-index:10; left:120px; right:120px; bottom:96px;
    display:flex; align-items:center; justify-content:space-between;
    padding-top:20px; border-top:1px solid rgba(46,69,56,.28);
  }
  .f49-foot .stars { display:flex; gap:12px; opacity:.6; }
</style>
</head>
<body>
  <div class="canvas s-light">
    <div class="f49">
      <div class="f49-grid"></div>

      <span class="f49-mark tl"></span>
      <span class="f49-mark tr"></span>
      <span class="f49-mark bl"></span>
      <span class="f49-mark br"></span>

      <div class="f49-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="f49-seal" aria-hidden="true">
        <svg viewBox="0 0 100 100" fill="none" stroke="#2e4538" stroke-width="1.2">
          <circle cx="50" cy="50" r="46"/>
          <circle cx="50" cy="50" r="38" opacity=".5"/>
          <path d="M50 10 L52 40 L82 42 L54 52 L78 76 L50 58 L22 78 L46 52 L18 42 L48 40 Z" fill="#2e4538" opacity=".16"/>
          <circle cx="50" cy="50" r="4" fill="#2e4538"/>
        </svg>
      </div>

      <div class="f49-kick"><span class="row"><span class="bar"></span><span>OUR PRIORITIES</span><span class="bar"></span></span></div>

      <h1 class="f49-center"><span class="l1">Let builders</span><span class="l2">build.</span></h1>
      <div class="f49-orn"></div>

      <p class="f49-body">Northwest Oregon succeeds when <em>entrepreneurs</em> can start, hire, invest, and grow without unnecessary barriers.</p>

      <div class="f49-foot">
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
        <div aria-hidden="true">
          <svg width="60" height="10" viewBox="0 0 60 10" fill="none" stroke="#2e4538" stroke-width="1"><path d="M0 5 L50 5"/><path d="M46 1 L54 5 L46 9"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
