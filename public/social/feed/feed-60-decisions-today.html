<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 60 · The decisions we make today shape the opportunities our children inherit tomorrow. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  /* Cinematic long-quote poster — big italic wrapping quote over a hero photo, subtitle bottom */
  .f60 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Top 60% is hero photo, faded into forest at bottom */
  .f60-bg { position:absolute; z-index:1; top:0; left:0; right:0; height:66%; overflow:hidden; }
  .f60-bg img { width:100%; height:100%; object-fit:cover; object-position:center 35%; filter:saturate(.6) contrast(1.2) brightness(.55); }
  .f60-bg::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(65% 55% at 20% 20%, rgba(90,112,96,.2) 0%, transparent 65%),
      linear-gradient(180deg, rgba(20,30,22,.55) 0%, rgba(20,30,22,.2) 30%, rgba(20,30,22,.65) 75%, #14201a 100%);
  }
  .f60-lower { position:absolute; z-index:2; left:0; right:0; top:60%; bottom:0;
    background:
      radial-gradient(70% 50% at 100% 100%, rgba(24,34,27,.9) 0%, transparent 55%),
      linear-gradient(180deg, #14201a 0%, #0a100c 100%);
  }

  /* Giant ornamental italic glyph background */
  .f60-glyph { position:absolute; z-index:3; right:-60px; top:-120px;
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:1000px; line-height:.72;
    color:rgba(224,214,188,.07);
    pointer-events:none;
  }

  /* Mast */
  .f60-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f60-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.7)); }

  /* Right side eyebrow */
  .f60-tag { position:absolute; z-index:14; top:112px; right:96px; display:flex; align-items:center; gap:14px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f60-tag .bar { width:44px; height:1px; background:currentColor; opacity:.7; }

  /* Center-left eyebrow */
  .f60-eyebrow { position:absolute; z-index:10; top:238px; left:96px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.6em; text-transform:uppercase; color:rgba(224,214,188,.75); font-weight:600;
  }
  .f60-eyebrow .bar { width:60px; height:1px; background:currentColor; opacity:.75; }

  /* Large italic quote — wraps generously */
  .f60-quote { position:absolute; z-index:10; left:96px; right:96px; top:298px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:82px; line-height:1.02; letter-spacing:-.028em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.55);
  }
  .f60-quote .em { color:#e0d6bc; }
  .f60-quote .open { font-family:var(--font-display); font-style:italic; font-size:1.05em; color:#e0d6bc; margin-right:.05em; }

  /* Rule */
  .f60-rule { position:absolute; z-index:10; left:96px; top:820px; width:140px; height:2px; background:rgba(224,214,188,.7); }

  /* Subtitle — non-italic, forest cream */
  .f60-sub { position:absolute; z-index:10; left:96px; right:96px; top:856px;
    font-family:var(--font-display); font-weight:500; font-size:32px; line-height:1.28; letter-spacing:-.008em; color:rgba(246,242,232,.92);
  }
  .f60-sub em { font-style:italic; color:#e0d6bc; }

  /* Baseline meta */
  .f60-baseline { position:absolute; z-index:10; bottom:96px; left:96px; right:96px; display:flex; justify-content:space-between; align-items:center;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
  .f60-baseline .stars { display:flex; gap:12px; opacity:.7; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f60">
      <div class="f60-bg"><img src="../assets/img/hero.jpg" alt="" /></div>
      <div class="f60-lower"></div>
      <div class="f60-glyph">&rdquo;</div>

      <div class="f60-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f60-tag"><span class="bar"></span>No. 60</div>

      <div class="f60-eyebrow"><span class="bar"></span>For Our Children</div>

      <h1 class="f60-quote"><span class="open">&ldquo;</span>The decisions we make today shape the <span class="em">opportunities</span> our children inherit <span class="em">tomorrow.</span></h1>

      <div class="f60-rule"></div>

      <p class="f60-sub">Let&rsquo;s build Northwest Oregon <em>they&rsquo;ll be proud to call home.</em></p>

      <div class="f60-baseline">
        <span>Northwest Oregon PAC</span>
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
