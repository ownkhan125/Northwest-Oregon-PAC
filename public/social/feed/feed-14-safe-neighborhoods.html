<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 14 · Safe neighborhoods — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f14 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#0a100c; }
  /* Cinematic full-bleed photo */
  .f14-bg { position:absolute; z-index:1; inset:0; }
  .f14-bg img { width:100%; height:100%; object-fit:cover; object-position:50% 50%; filter:saturate(.55) contrast(1.3) brightness(.4); }
  .f14-bg::after { content:''; position:absolute; inset:0;
    background:
      radial-gradient(80% 60% at 50% 55%, rgba(10,16,12,.1) 0%, rgba(10,16,12,.9) 90%),
      linear-gradient(180deg, rgba(10,16,12,.75) 0%, rgba(10,16,12,.15) 40%, rgba(10,16,12,.9) 100%);
  }
  .f14-scan { position:absolute; z-index:2; inset:0; opacity:.07; pointer-events:none;
    background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(0,0,0,.5) 4px 5px);
    mix-blend-mode:multiply;
  }
  /* Mast */
  .f14-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f14-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f14-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.6; }
  /* Corner brackets — cinematic frame */
  .f14-bracket { position:absolute; z-index:6; width:44px; height:44px; }
  .f14-bracket::before, .f14-bracket::after { content:''; position:absolute; background:rgba(224,214,188,.55); }
  .f14-bracket.tl { top:220px; left:96px; }
  .f14-bracket.tl::before { top:0; left:0; width:2px; height:44px; }
  .f14-bracket.tl::after  { top:0; left:0; width:44px; height:2px; }
  .f14-bracket.br { bottom:220px; right:96px; }
  .f14-bracket.br::before { bottom:0; right:0; width:2px; height:44px; }
  .f14-bracket.br::after  { bottom:0; right:0; width:44px; height:2px; }
  /* Kicker above quote */
  .f14-kick { position:absolute; z-index:10; left:0; right:0; top:355px; display:flex; justify-content:center; gap:20px; align-items:center;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.7);
  }
  .f14-kick .bar { width:60px; height:1px; background:currentColor; opacity:.7; }
  /* Cinematic quote — centered */
  .f14-quote { position:absolute; z-index:10; left:140px; right:140px; top:430px;
    font-family:var(--font-display); font-weight:500; font-size:62px; line-height:1.16; letter-spacing:-.02em; color:#f6f2e8;
    text-align:center; text-shadow: 0 8px 40px rgba(0,0,0,.7);
  }
  .f14-quote em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Bottom baseline */
  .f14-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f14-baseline .l { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f14-baseline .l .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
</style>
</head>
<body>
  <div class="canvas on-photo">
    <div class="f14">
      <div class="f14-bg"><img src="../assets/img/community.jpg" alt="" /></div>
      <div class="f14-scan"></div>

      <div class="f14-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f14-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <span class="f14-bracket tl"></span>
      <span class="f14-bracket br"></span>

      <div class="f14-kick"><span class="bar"></span></div>

      <p class="f14-quote">Safe neighborhoods give children room to dream, families peace of mind, and local businesses the confidence to grow. <em>Public safety is where opportunity begins.</em></p>

      <div class="f14-baseline">
        <div class="l"><span class="bar"></span></div>
        <div class="l"><span class="bar"></span></div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
