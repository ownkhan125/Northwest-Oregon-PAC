<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 45 · This is bigger than one election. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f45 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(80% 60% at 100% 10%, rgba(224,214,188,.55) 0%, transparent 60%),
      linear-gradient(180deg, #ece2ca 0%, #d4c8a7 100%);
  }
  /* Fine hatch */
  .f45-hatch { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.07;
    background-image:
      linear-gradient(45deg, #2e4538 1px, transparent 1px),
      linear-gradient(-45deg, #2e4538 1px, transparent 1px);
    background-size: 22px 22px;
  }
  /* Torn/document accent — vertical seam left */
  .f45-seam { position:absolute; z-index:4; top:0; bottom:0; left:14%; width:14px;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='1080' viewBox='0 0 14 1080'><path d='M7 0 L10 60 L4 130 L11 200 L5 270 L9 340 L6 410 L11 480 L4 550 L9 620 L6 690 L11 760 L4 830 L9 900 L6 970 L11 1040 L7 1080' stroke='%232e4538' stroke-width='1.2' fill='none' opacity='.35'/></svg>") repeat-y;
  }
  /* Mast */
  .f45-mast { position:absolute; z-index:12; top:96px; left:96px; }
  .f45-mast img { height:56px; width:auto; }
  /* Documentary corner brackets top-right */
  .f45-tag { position:absolute; z-index:12; top:112px; right:96px; width:44px; height:44px; }
  .f45-tag::before { content:''; position:absolute; right:0; top:0; width:2px; height:44px; background:#2e4538; opacity:.7; }
  .f45-tag::after { content:''; position:absolute; right:0; top:0; width:44px; height:2px; background:#2e4538; opacity:.7; }
  /* Big documentary-poster title, left-aligned, ragged right */
  .f45-title { position:absolute; z-index:10; left:calc(14% + 60px); right:96px; top:290px;
    font-family:var(--font-display); font-weight:500; font-size:96px; line-height:.94; letter-spacing:-.03em; color:#2e4538;
  }
  .f45-title .p1 { display:block; }
  .f45-title em { display:block; font-style:italic; font-weight:400; color:#5a7060; font-size:130px; margin-top:8px; letter-spacing:-.035em; }
  /* Under-title rule */
  .f45-rule { position:absolute; z-index:10; left:calc(14% + 60px); top:600px; width:220px; height:3px; background:#2e4538; }
  /* Subtitle paragraph */
  .f45-sub { position:absolute; z-index:10; left:calc(14% + 60px); right:96px; top:640px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:30px; line-height:1.28; letter-spacing:-.008em; color:#2e4538;
    max-width:720px;
  }
  /* Foot */
  .f45-foot { position:absolute; z-index:10; left:96px; right:96px; bottom:96px;
    display:flex; align-items:flex-end; justify-content:space-between;
  }
  .f45-foot .stars { display:flex; gap:12px; }
  .f45-foot .arrow svg { display:block; }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="f45">
      <div class="f45-hatch"></div>
      <div class="f45-seam"></div>

      <div class="f45-mast"><img src="../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="f45-tag" aria-hidden="true"></div>

      <h1 class="f45-title"><span class="p1">This is bigger than</span><em>one election.</em></h1>
      <div class="f45-rule"></div>
      <p class="f45-sub">It's about building a Northwest Oregon where every community has a voice, every voter has a choice, and every candidate has the opportunity to compete.</p>

      <div class="f45-foot">
        <div class="stars" aria-hidden="true">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
          <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        </div>
        <div class="arrow" aria-hidden="true">
          <svg width="72" height="12" viewBox="0 0 72 12" fill="none" stroke="#2e4538" stroke-width="1.2"><path d="M0 6 L62 6"/><path d="M58 2 L66 6 L58 10"/></svg>
        </div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
