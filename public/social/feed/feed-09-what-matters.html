<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 09 · What Matters Most? — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f09 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 20% 8%, rgba(90,112,96,.45) 0%, transparent 60%),
      radial-gradient(70% 60% at 100% 100%, rgba(24,34,27,.9) 0%, transparent 60%),
      linear-gradient(178deg, #2a3d33 0%, #1c2b23 60%, #131e17 100%);
  }
  .f09-hatch { position:absolute; inset:0; z-index:2; opacity:.05;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events:none;
  }
  .f09-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f09-mast img { height:56px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .f09-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.7; }
  /* Kicker mono under mast */
  .f09-kick { position:absolute; z-index:10; top:230px; left:96px; display:flex; align-items:center; gap:20px; font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65); }
  .f09-kick .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
  /* Small pre-title with tag */
  .f09-pretitle { position:absolute; z-index:10; top:280px; left:96px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:44px; color:#e0d6bc; letter-spacing:-.015em;
  }
  /* Big question — takes middle */
  .f09-q { position:absolute; z-index:10; left:96px; right:96px; top:352px;
    font-family:var(--font-display); font-weight:500; font-size:104px; line-height:.98; letter-spacing:-.03em; color:#f6f2e8;
  }
  .f09-q em { font-style:italic; font-weight:400; color:#e0d6bc; }
  /* Grid of 5 icon cards — 5 across, monospaced pill-icons */
  .f09-grid { position:absolute; z-index:10; left:96px; right:96px; bottom:180px; display:grid; grid-template-columns:repeat(5, 1fr); gap:16px; }
  .f09-cell { display:flex; flex-direction:column; align-items:center; gap:14px; padding:22px 8px; border:1px solid rgba(224,214,188,.28); background:rgba(224,214,188,.05); border-radius:14px; }
  .f09-cell .ico-wrap { width:56px; height:56px; display:flex; align-items:center; justify-content:center; border-radius:50%; background:rgba(224,214,188,.14); }
  .f09-cell .ico-wrap svg { width:32px; height:32px; color:#e0d6bc; }
  .f09-cell .n { font-family:var(--font-mono); font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f09-cell .lbl { font-family:var(--font-display); font-weight:500; font-size:22px; line-height:1.14; color:#f6f2e8; letter-spacing:-.012em; text-align:center; }
  /* Bottom rule + credit */
  .f09-baseline { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; height:1px; background:linear-gradient(90deg, rgba(224,214,188,.55), rgba(224,214,188,0)); }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f09">
      <div class="f09-hatch"></div>

      <div class="f09-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f09-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="f09-kick"><span class="bar"></span></div>
      <div class="f09-pretitle">NorthWest Oregon.</div>
      <h1 class="f09-q">What Matters <em>Most?</em></h1>

      <div class="f09-grid">
        <div class="f09-cell">
          <div class="ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2 L20 6 v6 c0 5-3.5 9-8 10-4.5-1-8-5-8-10 V6 z"/></svg></div>
          <div class="n">i</div>
          <div class="lbl">Public<br/>Safety</div>
        </div>
        <div class="f09-cell">
          <div class="ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 22 V10 L12 3 L21 10 V22"/><path d="M9 22 v-8 h6 v8"/></svg></div>
          <div class="n">ii</div>
          <div class="lbl">Small<br/>Business</div>
        </div>
        <div class="f09-cell">
          <div class="ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 8 L12 3 L22 8 L12 13 z"/><path d="M6 10 v6 c0 2 3 4 6 4 s6-2 6-4 v-6"/></svg></div>
          <div class="n">iii</div>
          <div class="lbl">Education</div>
        </div>
        <div class="f09-cell">
          <div class="ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13 2 L4 14 h7 L10 22 L20 10 h-7 z"/></svg></div>
          <div class="n">iv</div>
          <div class="lbl">Affordable<br/>Energy</div>
        </div>
        <div class="f09-cell">
          <div class="ico-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 v18"/><path d="M5 6 L19 6"/><path d="M3 10 L21 10"/><rect x="6" y="14" width="12" height="6" rx="1"/></svg></div>
          <div class="n">v</div>
          <div class="lbl">Government<br/>Accountability</div>
        </div>
      </div>

      <div class="f09-baseline"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
