<!doctype html>

<head>

<title>Safe neighborhoods give children room to dream, families peace of mind, and local businesses the confidence to grow. Public safety is where opportunity begins — Northwest Oregon PAC</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1350px;overflow:hidden;background:rgba(255,255,255,1);
    font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:rgba(51,51,47,1);border-radius:6px;"></div>
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:linear-gradient(156deg, rgba(74,74,68,1) 0%, rgba(43,43,39,1) 100%);"></div>
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:linear-gradient(51deg, rgba(47,47,43,1) 0%, rgba(47,47,43,1) 1%, rgba(58,58,52,0.094) 1%, rgba(58,58,52,0.094) 2%);"></div>
<img src="../posts/img/img-777f0675edce14cc.jpg" alt="" style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;object-fit:cover;">
<img src="../posts/img/img-2dc558446ba27865.jpg" alt="" style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;object-fit:cover;">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1350px;background:linear-gradient(180deg, rgba(42,42,38,0.3) 0%, rgba(42,42,38,0.18) 40%, rgba(42,42,38,0.45) 100%);"></div>
<div style="position:absolute;left:0px;top:0px;width:1080px;height:292px;background:linear-gradient(180deg, rgba(42,42,38,0.8) 0%, rgba(42,42,38,0) 100%);"></div>
<img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:88px;width:162px;height:48px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:671px;width:640px;height:376px;background:rgba(78,96,81,1);"></div>
<div style="position:absolute;left:144px;top:727px;width:528px;height:264px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:34px;font-weight:700;color:rgba(241,238,228,1);letter-spacing:0px;line-height:44px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">Safe neighborhoods give
children room to dream,
families peace of mind, and local
businesses the confidence to
grow. <span style="color:rgba(224,214,188,1);">Public safety</span> is where
opportunity begins.</p></div>
</div></div>
<script>(function(){var W=1080,H=1350,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
