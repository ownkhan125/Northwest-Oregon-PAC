<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Feed 04 · Accountability Matters. — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../assets/social.css" />
<link rel="stylesheet" href="../assets/templates.css" />
<link rel="stylesheet" href="../assets/carousels.css" />

<style>
  .f04 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(60% 45% at 12% 12%, rgba(90,112,96,.55) 0%, transparent 60%),
      radial-gradient(80% 60% at 100% 100%, rgba(107,90,66,.35) 0%, transparent 60%),
      linear-gradient(180deg, #253a2e 0%, #14201a 100%);
  }
  /* Fine paper grain overlay */
  .f04-noise { position:absolute; z-index:2; inset:0; opacity:.14; pointer-events:none;
    background-image: radial-gradient(circle, rgba(224,214,188,.5) 1px, transparent 1.3px);
    background-size: 22px 22px;
    mix-blend-mode:overlay;
  }
  /* Mast + stars */
  .f04-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .f04-mast img { height:60px; width:auto; }
  .f04-star { position:absolute; z-index:14; top:110px; right:96px; display:flex; gap:12px; opacity:.65; }
  /* Corner brackets top-left / bottom-right */
  .f04-bracket { position:absolute; z-index:6; width:80px; height:80px; }
  .f04-bracket::before, .f04-bracket::after { content:''; position:absolute; background:rgba(224,214,188,.4); }
  .f04-bracket.tl { top:200px; left:96px; }
  .f04-bracket.tl::before { top:0; left:0; width:80px; height:2px; }
  .f04-bracket.tl::after  { top:0; left:0; width:2px; height:80px; }
  .f04-bracket.br { bottom:200px; right:96px; }
  .f04-bracket.br::before { bottom:0; right:0; width:80px; height:2px; }
  .f04-bracket.br::after  { bottom:0; right:0; width:2px; height:80px; }
  /* Central civic seal — huge ballot-box glyph as backdrop */
  .f04-seal { position:absolute; z-index:3; top:320px; left:50%; transform:translateX(-50%);
    width:440px; height:440px; display:flex; align-items:center; justify-content:center;
    opacity:.14; color:#e0d6bc; pointer-events:none;
  }
  .f04-seal svg { width:100%; height:100%; }
  /* Central concentric ring seal */
  .f04-ring { position:absolute; z-index:4; top:320px; left:50%; transform:translateX(-50%);
    width:440px; height:440px; border:1px solid rgba(224,214,188,.22); border-radius:50%;
    pointer-events:none;
  }
  .f04-ring::before { content:''; position:absolute; inset:34px; border:1px solid rgba(224,214,188,.14); border-radius:50%; }
  .f04-ring::after  { content:''; position:absolute; inset:68px; border:1px dashed rgba(224,214,188,.14); border-radius:50%; }
  /* Kicker */
  .f04-kick { position:absolute; z-index:10; top:230px; left:0; right:0; display:flex; justify-content:center; align-items:center; gap:22px; font-family:var(--font-mono); font-size:14px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.7); }
  .f04-kick .bar { width:64px; height:1px; background:currentColor; opacity:.75; }
  /* Massive stacked poster typography */
  .f04-title { position:absolute; z-index:10; left:60px; right:60px; top:800px; text-align:center;
    font-family:var(--font-display); font-weight:600; font-size:136px; line-height:.9; letter-spacing:-.038em; color:#f6f2e8;
    text-shadow: 0 8px 40px rgba(0,0,0,.5);
  }
  .f04-title .m { display:block; font-style:italic; font-weight:400; color:#e0d6bc; letter-spacing:-.03em; }
  /* Center-below thin rule */
  .f04-underline { position:absolute; z-index:10; left:50%; transform:translateX(-50%); bottom:190px; width:180px; height:2px; background:#e0d6bc; opacity:.55; }
  /* Baseline signature row */
  .f04-base { position:absolute; z-index:10; left:96px; right:96px; bottom:96px; display:flex; align-items:center; justify-content:space-between; }
  .f04-base .l, .f04-base .r { display:flex; align-items:center; gap:16px; font-family:var(--font-mono); font-size:13px; letter-spacing:.44em; text-transform:uppercase; color:rgba(224,214,188,.55); }
  .f04-base .bar { width:52px; height:1px; background:currentColor; opacity:.7; }
</style>
</head>
<body>
  <div class="canvas s-forest">
    <div class="f04">
      <div class="f04-noise"></div>

      <div class="f04-mast"><img src="../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="f04-star" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <span class="f04-bracket tl"></span>
      <span class="f04-bracket br"></span>

      <div class="f04-ring"></div>
      <div class="f04-seal" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.1">
          <rect x="3" y="8" width="18" height="12" rx="1"/>
          <path d="M8 8V5a4 4 0 0 1 8 0v3"/>
          <path d="M12 12v4"/>
          <path d="M8 20h8"/>
          <path d="M3 12h18"/>
        </svg>
      </div>

      <div class="f04-kick"><span class="bar"></span><span class="bar"></span></div>

      <h1 class="f04-title">Accountability<span class="m">Matters.</span></h1>

      <div class="f04-underline"></div>

      <div class="f04-base">
        <div class="l"><span class="bar"></span></div>
        <div class="r"><span class="bar"></span></div>
      </div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
