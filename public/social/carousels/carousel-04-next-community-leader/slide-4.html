<!doctype html>

<link rel="stylesheet" href="../../assets/social.css" />

<style>
  .c04-4 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 88% 12%, rgba(224,214,188,.6) 0%, transparent 60%),
      linear-gradient(180deg, #f6f2e8 0%, #e6dcc4 100%);
  }
  .c04-4-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 32px 32px;
  }
  .c04-4-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .c04-4-mast img { height:56px; width:auto; }
  .c04-4-stars { position:absolute; z-index:14; top:112px; right:96px; display:flex; gap:14px; opacity:.6; }
  .c04-4-spine { position:absolute; z-index:6; left:56px; top:280px; bottom:180px; width:1px;
    background:linear-gradient(180deg, rgba(46,69,56,0), rgba(46,69,56,.4) 22%, rgba(46,69,56,.4) 78%, rgba(46,69,56,0));
  }
  .c04-4-eyebrow { position:absolute; z-index:10; left:96px; top:300px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .c04-4-eyebrow .chap { font-family:var(--font-display); font-style:italic; font-size:24px; letter-spacing:.02em; color:#2e4538; }
  .c04-4-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .c04-4-head { position:absolute; z-index:10; left:96px; right:96px; top:330px;
    font-family:var(--font-display); font-weight:500; font-size:52px; line-height:1.05; letter-spacing:-.022em; color:#2e4538;
  }
  .c04-4-head em { font-style:italic; font-weight:400; color:#5a7060; }
  .c04-4-stack { position:absolute; z-index:10; left:96px; right:400px; top:470px;
    display:flex; flex-direction:column; gap:2px;
  }
  .c04-4-stack .name { font-family:var(--font-display); font-style:italic; font-weight:500; font-size:32px; letter-spacing:-.014em; color:#2e4538; line-height:1.15;
    padding-bottom:8px; border-bottom:1px solid rgba(46,69,56,.22);
  }
  .c04-4-tag { position:absolute; z-index:10; left:96px; right:96px; bottom:130px;
    font-family:var(--font-display); font-weight:500; font-size:28px; letter-spacing:-.012em; color:#2e4538;
  }
  .c04-4-tag em { font-style:italic; font-weight:400; color:#5a7060; }
  .c04-4-cap { position:absolute; z-index:10; left:96px; bottom:96px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6);
  }
  .c04-4-index { position:absolute; z-index:10; right:96px; bottom:96px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6);
  }
</style>

<body>
  <div class="canvas s-light">
    <div class="c04-4">
      <div class="c04-4-hatch"></div>
      <div class="c04-4-spine"></div>

      <div class="c04-4-mast"><img src="../../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="c04-4-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="c04-4-eyebrow"><span class="bar"></span></div>
      <h2 class="c04-4-head">Northwest Oregon needs leaders from <em>every community.</em></h2>

      <div class="c04-4-stack">
        <div class="name">Teachers.</div>
        <div class="name">Small business owners.</div>
        <div class="name">Veterans.</div>
        <div class="name">Parents.</div>
        <div class="name">Farmers.</div>
        <div class="name">Community volunteers.</div>
      </div>

      <p class="c04-4-tag">Leadership comes from <em>every walk of life.</em></p>
    </div>

    <div class="grain"></div>
  </div>
