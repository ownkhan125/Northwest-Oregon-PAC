<!doctype html>

<style>
  .c04-1 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:

      linear-gradient(180deg, #f6f2e8 0%, #e6dcc4 100%);
  }
  .c04-1-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image: radial-gradient(circle, #2e4538 1px, transparent 1.5px);
    background-size: 32px 32px;
  }
  .c04-1-photo { position:absolute; z-index:3; right:96px; top:220px; width:400px; height:560px; overflow:hidden;
    box-shadow: 0 32px 60px -22px rgba(46,42,20,.42);
  }
  .c04-1-photo img { width:100%; height:100%; object-fit:cover; object-position:center 30%; filter:saturate(.72) contrast(1.12); }
  .c04-1-photo::after { content:''; position:absolute; inset:0; background:
    linear-gradient(180deg, rgba(46,69,56,0) 0%, rgba(46,69,56,.28) 100%);
  }
  .c04-1-bracket { position:absolute; z-index:6; width:40px; height:40px; }
  .c04-1-bracket::before, .c04-1-bracket::after { content:''; position:absolute; background:#2e4538; opacity:.7; }
  .c04-1-bracket.tl::before { left:0; top:0; width:2px; height:40px; }
  .c04-1-bracket.tl::after { top:0; left:0; width:40px; height:2px; }
  .c04-1-bracket.tl { top:56px; left:56px; }
  .c04-1-bracket.br::before { right:0; bottom:0; width:2px; height:40px; }
  .c04-1-bracket.br::after { bottom:0; right:0; width:40px; height:2px; }
  .c04-1-bracket.br { bottom:56px; right:56px; }
  .c04-1-mast { position:absolute; z-index:14; top:96px; left:96px; }
  .c04-1-mast img { height:56px; width:auto; }
  .c04-1-stars { position:absolute; z-index:14; top:112px; right:96px; display:flex; gap:14px; opacity:.6; }
  .c04-1-eyebrow { position:absolute; z-index:10; left:96px; top:340px; display:flex; align-items:center; gap:18px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .c04-1-eyebrow .chap { font-family:var(--font-display); font-style:italic; font-size:24px; letter-spacing:.02em; color:#2e4538; }
  .c04-1-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .c04-1-title { position:absolute; z-index:10; left:96px; right:540px; top:390px;
    font-family:var(--font-display); font-weight:500; font-size:78px; line-height:1.0; letter-spacing:-.03em; color:#2e4538;
  }
  .c04-1-title em { font-style:italic; font-weight:400; color:#5a7060; display:block; }
  .c04-1-spine { position:absolute; z-index:6; left:56px; top:280px; bottom:180px; width:1px;

  }
  .c04-1-cap { position:absolute; z-index:10; left:96px; bottom:96px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6);
  }
  .c04-1-index { position:absolute; z-index:10; right:96px; bottom:96px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:rgba(46,69,56,.6);
  }

  <div class="canvas s-light">
    <div class="c04-1">

      <span class="c04-1-bracket br"></span>

      <div class="c04-1-mast"><img src="../../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

        <svg width="10" height="10" viewBox="0 0 24 24" fill="#2e4538"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="c04-1-eyebrow"><span class="bar"></span></div>
      <h1 class="c04-1-title">Could You Be the Next<em>Community Leader?</em></h1>
    </div>

    <div class="grain"></div>
  </div>
