<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>We invest in people · 2/5 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />

<style>
  .c08-2 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 15% 10%, rgba(224,214,188,.85) 0%, transparent 60%),
      radial-gradient(80% 70% at 100% 108%, rgba(107,90,66,.22) 0%, transparent 60%),
      linear-gradient(180deg, #eae0c6 0%, #d4c8a7 100%);
  }
  .c08-2-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.05;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .c08-2-mark { position:absolute; z-index:6; width:24px; height:24px; }
  .c08-2-mark::before, .c08-2-mark::after { content:''; position:absolute; background:#6b5a42; }
  .c08-2-mark::before { left:11px; top:0; width:2px; height:24px; }
  .c08-2-mark::after  { top:11px; left:0; width:24px; height:2px; }
  .c08-2-mark.tl { top:56px; left:56px; }
  .c08-2-mark.tr { top:56px; right:56px; }
  .c08-2-mark.bl { bottom:56px; left:56px; }
  .c08-2-mark.br { bottom:56px; right:56px; }
  .c08-2-mast { position:absolute; z-index:12; top:96px; left:120px; }
  .c08-2-mast img { height:56px; width:auto; }
  .c08-2-plate { position:absolute; z-index:12; top:110px; right:120px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.45em; text-transform:uppercase; color:#6b5a42;
    padding:8px 14px; border:1px solid #6b5a42;
  }
  .c08-2-eyebrow { position:absolute; z-index:10; top:260px; left:120px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .c08-2-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Split: photo left, text right */
  .c08-2-photo { position:absolute; z-index:6; top:340px; left:120px; width:420px; height:520px;
    overflow:hidden; border:1px solid rgba(46,69,56,.35);
    box-shadow:0 30px 60px -22px rgba(46,42,20,.5);
  }
  .c08-2-photo img { width:100%; height:100%; object-fit:cover; filter:saturate(.7) contrast(1.16) sepia(.06); }
  .c08-2-photo::after { content:''; position:absolute; inset:0;
    background:linear-gradient(180deg, transparent 60%, rgba(46,42,26,.4) 100%);
  }
  .c08-2-photo-cap { position:absolute; z-index:10; top:872px; left:120px; width:420px;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:#6b5a42;
  }
  .c08-2-title { position:absolute; z-index:10; left:590px; right:120px; top:340px;
    font-family:var(--font-display); font-weight:500; font-size:100px; line-height:.96; letter-spacing:-.03em; color:#2e4538;
  }
  .c08-2-title em { font-style:italic; font-weight:400; color:#6b5a42; }
  .c08-2-orn { position:absolute; z-index:10; left:590px; top:590px; width:160px; height:2px; background:#2e4538; opacity:.55; }
  .c08-2-body { position:absolute; z-index:10; left:590px; right:120px; top:620px;
    font-family:var(--font-display); font-style:italic; font-weight:400; font-size:32px; line-height:1.34; color:#3a4d3f; letter-spacing:-.006em;
  }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="c08-2">
      <div class="c08-2-grid"></div>

      <span class="c08-2-mark tl"></span>
      <span class="c08-2-mark tr"></span>
      <span class="c08-2-mark bl"></span>
      <span class="c08-2-mark br"></span>

      <div class="c08-2-mast"><img src="../../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>
      <div class="c08-2-plate">02 / 05</div>

      <div class="c08-2-eyebrow"><span class="bar"></span>Exhibition 02 &middot; People</div>

      <div class="c08-2-photo"><img src="../../assets/img/who-we-are.jpg" alt="" /></div>
      <div class="c08-2-photo-cap">Plate I &middot; The people we serve</div>

      <h1 class="c08-2-title">We invest in <em>people.</em></h1>
      <div class="c08-2-orn"></div>
      <p class="c08-2-body">We identify and support candidates who are committed to serving Northwest Oregon with integrity, accountability, and practical leadership.</p>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
