<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Hope. Support. Heard. · 5/5 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />
<link rel="stylesheet" href="../../assets/templates.css" />
<link rel="stylesheet" href="../../assets/carousels.css" />

<style>
  .c08-5 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 15% 10%, rgba(224,214,188,.85) 0%, transparent 60%),
      radial-gradient(80% 70% at 100% 108%, rgba(107,90,66,.22) 0%, transparent 60%),
      linear-gradient(180deg, #eae0c6 0%, #d4c8a7 100%);
  }
  .c08-5-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.05;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .c08-5-mark { position:absolute; z-index:6; width:24px; height:24px; }
  .c08-5-mark::before, .c08-5-mark::after { content:''; position:absolute; background:#6b5a42; }
  .c08-5-mark::before { left:11px; top:0; width:2px; height:24px; }
  .c08-5-mark::after  { top:11px; left:0; width:24px; height:2px; }
  .c08-5-mark.tl { top:56px; left:56px; }
  .c08-5-mark.tr { top:56px; right:56px; }
  .c08-5-mark.bl { bottom:56px; left:56px; }
  .c08-5-mark.br { bottom:56px; right:56px; }
  .c08-5-mast { position:absolute; z-index:12; top:96px; left:120px; }
  .c08-5-mast img { height:56px; width:auto; }
  .c08-5-seal { position:absolute; z-index:8; top:96px; right:120px; width:110px; height:110px; }
  .c08-5-seal svg { width:100%; height:100%; }
  .c08-5-eyebrow { position:absolute; z-index:10; top:270px; left:120px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .c08-5-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  /* Three big triadic words in horizontal splits */
  .c08-5-triad { position:absolute; z-index:10; left:120px; right:120px; top:340px;
    display:flex; flex-direction:column; gap:0;
  }
  .c08-5-word { padding:18px 0; border-bottom:2px solid #2e4538;
    font-family:var(--font-display); font-weight:500; font-size:96px; line-height:.98; letter-spacing:-.032em; color:#2e4538;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  .c08-5-word:last-child { border-bottom:none; }
  .c08-5-word em { font-style:italic; font-weight:400; color:#6b5a42; }
  .c08-5-word .n { font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#6b5a42; }
  .c08-5-close { position:absolute; z-index:10; left:120px; right:120px; bottom:150px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:28px; line-height:1.28; color:#3a4d3f; letter-spacing:-.012em;
    padding-top:20px; border-top:1px solid rgba(46,69,56,.35);
  }
  .c08-5-footer { position:absolute; z-index:10; left:120px; right:120px; bottom:100px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.45em; text-transform:uppercase; color:#6b5a42;
  }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="c08-5">
      <div class="c08-5-grid"></div>

      <span class="c08-5-mark tl"></span>
      <span class="c08-5-mark tr"></span>
      <span class="c08-5-mark bl"></span>
      <span class="c08-5-mark br"></span>

      <div class="c08-5-mast"><img src="../../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <div class="c08-5-seal" aria-hidden="true">
        <svg viewBox="0 0 120 120" fill="none" stroke="#2e4538" stroke-width="1.4">
          <circle cx="60" cy="60" r="56"/>
          <circle cx="60" cy="60" r="48" opacity=".6"/>
          <circle cx="60" cy="60" r="6" fill="#2e4538"/>
          <path d="M60 8 L62 40 L94 42 L64 60 L92 88 L60 68 L28 90 L56 60 L28 42 L58 40 Z" fill="#2e4538" opacity=".14"/>
        </svg>
      </div>

      <div class="c08-5-triad">
        <div class="c08-5-word"><span>Hope.</span></div>
        <div class="c08-5-word"><em>Support.</em></div>
        <div class="c08-5-word"><span>Heard.</span></div>
      </div>

      <p class="c08-5-close">Join the movement and help strengthen Northwest Oregon.</p>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
