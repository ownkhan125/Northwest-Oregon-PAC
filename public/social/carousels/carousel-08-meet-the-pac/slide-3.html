<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>We invest in communities · 3/5 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />
<link rel="stylesheet" href="../../assets/templates.css" />
<link rel="stylesheet" href="../../assets/carousels.css" />

<style>
  .c08-3 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 15% 10%, rgba(224,214,188,.85) 0%, transparent 60%),
      radial-gradient(80% 70% at 100% 108%, rgba(107,90,66,.22) 0%, transparent 60%),
      linear-gradient(180deg, #eae0c6 0%, #d4c8a7 100%);
  }
  .c08-3-grid { position:absolute; z-index:2; inset:0; pointer-events:none; opacity:.05;
    background-image:
      linear-gradient(90deg, #2e4538 1px, transparent 1px),
      linear-gradient(180deg, #2e4538 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .c08-3-mark { position:absolute; z-index:6; width:24px; height:24px; }
  .c08-3-mark::before, .c08-3-mark::after { content:''; position:absolute; background:#6b5a42; }
  .c08-3-mark::before { left:11px; top:0; width:2px; height:24px; }
  .c08-3-mark::after  { top:11px; left:0; width:24px; height:2px; }
  .c08-3-mark.tl { top:56px; left:56px; }
  .c08-3-mark.tr { top:56px; right:56px; }
  .c08-3-mark.bl { bottom:56px; left:56px; }
  .c08-3-mark.br { bottom:56px; right:56px; }
  .c08-3-mast { position:absolute; z-index:12; top:96px; left:120px; }
  .c08-3-mast img { height:56px; width:auto; }
  .c08-3-plate { position:absolute; z-index:12; top:110px; right:120px;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.45em; text-transform:uppercase; color:#6b5a42;
    padding:8px 14px; border:1px solid #6b5a42;
  }
  .c08-3-eyebrow { position:absolute; z-index:10; top:260px; left:120px; display:flex; align-items:center; gap:20px;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase; color:#5a7060;
  }
  .c08-3-eyebrow .bar { width:56px; height:1px; background:currentColor; opacity:.7; }
  .c08-3-title { position:absolute; z-index:10; left:120px; right:120px; top:340px;
    font-family:var(--font-display); font-weight:500; font-size:106px; line-height:.96; letter-spacing:-.03em; color:#2e4538;
  }
  .c08-3-title em { font-style:italic; font-weight:400; color:#6b5a42; }
  .c08-3-orn { position:absolute; z-index:10; left:120px; top:520px; width:160px; height:2px; background:#2e4538; opacity:.55; }
  .c08-3-intro { position:absolute; z-index:10; left:120px; right:120px; top:550px;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:34px; line-height:1.3; color:#3a4d3f; letter-spacing:-.008em;
  }
  /* Editorial list — middle dot markers */
  .c08-3-list { position:absolute; z-index:10; left:120px; right:120px; bottom:200px;
    display:flex; flex-direction:column; gap:0;
  }
  .c08-3-item { display:grid; grid-template-columns:80px 1fr; gap:20px; align-items:baseline; padding:20px 0;
    border-bottom:1px solid rgba(46,69,56,.24);
  }
  .c08-3-item:last-child { border-bottom:none; }
  .c08-3-item .dot { font-family:var(--font-display); font-weight:500; font-size:42px; line-height:.7; color:#6b5a42; text-align:right; }
  .c08-3-item .txt { font-family:var(--font-display); font-weight:500; font-size:36px; line-height:1.14; letter-spacing:-.012em; color:#2e4538; }
  .c08-3-footer { position:absolute; z-index:10; left:120px; right:120px; bottom:100px;
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--font-mono); font-size:12px; letter-spacing:.45em; text-transform:uppercase; color:#6b5a42;
  }
</style>
</head>
<body>
  <div class="canvas s-sand">
    <div class="c08-3">
      <div class="c08-3-grid"></div>

      <span class="c08-3-mark tl"></span>
      <span class="c08-3-mark tr"></span>
      <span class="c08-3-mark bl"></span>
      <span class="c08-3-mark br"></span>

      <div class="c08-3-mast"><img src="../../assets/nwop-logo-dark.png" alt="Northwest Oregon PAC" /></div>

      <h1 class="c08-3-title">We invest in <em>communities.</em></h1>
      <div class="c08-3-orn"></div>
      <p class="c08-3-intro">Our work includes</p>

      <div class="c08-3-list">
        <div class="c08-3-item">
          <span class="dot">&middot;</span>
          <span class="txt">Candidate recruitment</span>
        </div>
        <div class="c08-3-item">
          <span class="dot">&middot;</span>
          <span class="txt">Strategic communications</span>
        </div>
        <div class="c08-3-item">
          <span class="dot">&middot;</span>
          <span class="txt">Campaign support</span>
        </div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
