<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Every campaign deserves strong support. — Northwest Oregon PAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#2a2a26;overflow:hidden;}
  body{margin:0;}
  .stage{position:fixed;top:50%;left:50%;width:1080px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,1));transform-origin:center center;}
  .post{position:relative;width:1080px;height:1080px;overflow:hidden;background:rgba(42,42,38,1);
    font-family:'Source Sans 3',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;}
  .post p{margin:0;}
</style>
</head>
<body>
<div class="stage"><div class="post">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;background:rgba(42,42,38,1);"></div>
<div style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;background:linear-gradient(160deg, rgba(107,99,87,1) 0%, rgba(67,65,58,1) 55%, rgba(43,43,39,1) 100%);"></div>
<img src="../../posts/img/25_2097.jpg" alt="" style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;object-fit:cover;">
<div style="position:absolute;left:0px;top:0px;width:1080px;height:190px;background:linear-gradient(180deg, rgba(42,42,38,0.5) 0%, rgba(42,42,38,0) 100%);"></div>
<img src="../../posts/img/25_2101.svg" alt="" style="position:absolute;left:0px;top:0px;width:1080px;height:1080px;">
<img src="../../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" style="position:absolute;left:88px;top:88px;width:148px;height:44px;object-fit:contain;object-position:left center;">
<div style="position:absolute;left:88px;top:718px;width:752px;height:120px;display:flex;flex-direction:column;justify-content:center;overflow:visible;"><p style="font-family:'Lora', Georgia, serif;font-size:50px;font-weight:400;color:rgba(241,238,228,1);letter-spacing:0px;line-height:60px;text-align:left;white-space:pre;font-style:normal;text-transform:none;margin:0">Every campaign deserves <span style="color:rgba(224,214,188,1);font-weight:400;font-family:'Lora', Georgia, serif;">strong
support.</span></p></div>
</div></div>
<script>(function(){var W=1080,H=1080,s=document.querySelector('.stage');function f(){var iw=innerWidth,ih=innerHeight,exact=Math.abs(iw-W)<2&&Math.abs(ih-H)<2;if(window.self!==window.top||exact){s.style.setProperty('--s',Math.min(iw/W,ih/H));return;}var p=Math.max(24,Math.min(iw,ih)*0.05);s.style.setProperty('--s',Math.min((iw-2*p)/W,(ih-2*p)/H));}f();addEventListener('resize',f);})();</script>
</body>
</html>
