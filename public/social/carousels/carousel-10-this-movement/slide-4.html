<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Support. Donate. Stay Informed. Run for Office. · 4/4 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />
<link rel="stylesheet" href="../../assets/templates.css" />
<link rel="stylesheet" href="../../assets/carousels.css" />

<style>
  .c10-4 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(70% 55% at 25% 10%, rgba(90,112,96,.32) 0%, transparent 65%),
      radial-gradient(80% 80% at 100% 100%, rgba(6,10,7,.94) 0%, transparent 60%),
      linear-gradient(178deg, #1c2b23 0%, #0f1712 60%, #0a100c 100%);
  }
  .c10-4-hatch { position:absolute; inset:0; z-index:2; opacity:.05; pointer-events:none;
    background-image:
      linear-gradient(90deg, #e0d6bc 1px, transparent 1px),
      linear-gradient(180deg, #e0d6bc 1px, transparent 1px);
    background-size: 60px 60px;
  }
  .c10-4-film { position:absolute; z-index:6; bottom:60px; left:0; right:0; height:32px;
    background:repeating-linear-gradient(90deg, #0a100c 0 26px, transparent 26px 46px);
    border-top:1px solid rgba(224,214,188,.28);
    border-bottom:1px solid rgba(224,214,188,.28);
  }
  .c10-4-film::before { content:''; position:absolute; inset:6px 0;
    background:repeating-linear-gradient(90deg, rgba(224,214,188,.18) 0 22px, transparent 22px 44px);
  }
  .c10-4-mast { position:absolute; z-index:14; top:80px; left:96px; }
  .c10-4-mast img { height:60px; width:auto; }
  .c10-4-serial { position:absolute; z-index:14; top:100px; right:96px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.65);
    display:flex; align-items:center; gap:14px;
  }
  .c10-4-serial .bar { width:40px; height:1px; background:currentColor; opacity:.7; }
  .c10-4-kick { position:absolute; z-index:10; left:96px; top:240px;
    font-family:var(--font-mono); font-size:15px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.8);
    display:flex; align-items:center; gap:16px;
  }
  .c10-4-kick .brk { color:rgba(224,214,188,.5); font-family:var(--font-display); font-size:22px; }
  /* Manifesto CTA list — four big bold statements */
  .c10-4-list { position:absolute; z-index:10; left:96px; right:96px; top:280px;
    display:flex; flex-direction:column; gap:0;
  }
  .c10-4-item { display:block; padding:20px 0;
    border-bottom:1px solid rgba(224,214,188,.24);
  }
  .c10-4-item:last-child { border-bottom:none; }
  .c10-4-item .n { font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; color:rgba(224,214,188,.55); }
  .c10-4-item .txt { font-family:var(--font-display); font-weight:500; font-size:68px; line-height:1.0; letter-spacing:-.028em; color:#f6f2e8; white-space:nowrap; }
  .c10-4-item .txt em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .c10-4-item .mark { font-family:var(--font-mono); font-size:12px; letter-spacing:.45em; text-transform:uppercase; color:rgba(224,214,188,.55); align-self:end; padding-bottom:14px; }
  /* URL rule at bottom */
  .c10-4-url { position:absolute; z-index:10; left:96px; right:96px; bottom:130px;
    padding-top:20px; border-top:2px solid rgba(224,214,188,.6);
    display:flex; justify-content:space-between; align-items:baseline;
    font-family:var(--font-mono); font-size:24px; letter-spacing:.28em; text-transform:uppercase; color:#f6f2e8;
  }
  .c10-4-url .l { font-size:11px; letter-spacing:.55em; color:rgba(224,214,188,.55); }
</style>
</head>
<body>
  <div class="canvas on-photo" style="background:#0a100c;">
    <div class="c10-4">
      <div class="c10-4-hatch"></div>

      <div class="c10-4-mast"><img src="../../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>

      <div class="c10-4-list">
        <div class="c10-4-item">
          <span class="txt">Support.</span>
        </div>
        <div class="c10-4-item">
          <span class="txt"><em>Donate.</em></span>
        </div>
        <div class="c10-4-item">
          <span class="txt">Stay Informed.</span>
        </div>
        <div class="c10-4-item">
          <span class="txt"><em>Run for Office.</em></span>
        </div>
      </div>

      <div class="c10-4-url">
        <span>northwestoregon.com</span>
      </div>

      <div class="c10-4-film"></div>
    </div>
    <div class="grain"></div>
  </div>
</body>
</html>
