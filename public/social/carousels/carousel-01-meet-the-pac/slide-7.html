<style>

  .c01-7-mast { position:absolute; z-index:14; top:72px; left:96px; }

  }
  .c01-7-orn .bar { width:64px; height:1px; background:currentColor; opacity:.7; }
  .c01-7-title { position:absolute; z-index:10; left:96px; right:96px; top:450px;
    font-family:var(--font-display); font-weight:500; font-size:104px; line-height:.98; letter-spacing:-.03em;

  .c01-7-index { position:absolute; z-index:10; right:96px; bottom:96px;
