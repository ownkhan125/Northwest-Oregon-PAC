<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>Every Community · 3/7 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />

<style>
  .c01-3 { position:absolute; inset:0; z-index:5; overflow:hidden; background:#070c09; }
  .c01-3-bg { position:absolute; inset:0; z-index:1; }
  .c01-3-bg img { width:100%; height:100%; object-fit:cover; object-position:center 55%;
    filter:saturate(.5) contrast(1.35) brightness(.3); }
  .c01-3-bg::after { content:''; position:absolute; inset:0; background:
    radial-gradient(80% 60% at 50% 50%, rgba(20,30,22,.55) 0%, rgba(6,10,7,.95) 80%),
    linear-gradient(178deg, rgba(6,10,7,.5) 0%, rgba(6,10,7,.35) 50%, rgba(6,10,7,.85) 100%);
  }
  .c01-3-scan { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.1;
    background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(0,0,0,.5) 3px 4px);
    mix-blend-mode:multiply;
  }
  .c01-3-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:760px; line-height:.66; color:rgba(90,112,96,.14);
    right:-40px; top:60px; user-select:none; pointer-events:none;
  }
  .c01-3-mast { position:absolute; z-index:14; top:72px; left:96px; }
  .c01-3-mast img { height:60px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .c01-3-stars { position:absolute; z-index:14; top:96px; right:96px; display:flex; gap:14px; opacity:.7; }
  .c01-3-orn { position:absolute; z-index:10; left:96px; top:400px; display:flex; align-items:center; gap:22px;
    color:rgba(224,214,188,.75); font-family:var(--font-mono); font-size:14px; letter-spacing:.5em; text-transform:uppercase;
  }
  .c01-3-orn .bar { width:64px; height:1px; background:currentColor; opacity:.7; }
  .c01-3-head { position:absolute; z-index:10; left:96px; right:96px; top:470px;
    font-family:var(--font-display); font-weight:500; font-size:112px; line-height:1; letter-spacing:-.03em;
    color:#f6f2e8; text-shadow: 0 8px 40px rgba(0,0,0,.6);
  }
  .c01-3-head em { font-style:italic; font-weight:400; color:#e0d6bc; }
  .c01-3-rule { position:absolute; z-index:10; left:96px; bottom:180px; width:220px; height:2px; background:rgba(224,214,188,.55); }
  .c01-3-index { position:absolute; z-index:10; right:96px; bottom:96px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55);
  }
  .c01-3-cap { position:absolute; z-index:10; left:96px; bottom:96px;
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.55);
  }
</style>
</head>
<body>
  <div class="canvas on-photo" style="background:#050807;">
    <div class="c01-3">
      <div class="c01-3-bg"><img src="../../assets/img/community.jpg" alt="" /></div>
      <div class="c01-3-scan"></div>
      <div class="c01-3-glyph">&ldquo;</div>

      <div class="c01-3-mast"><img src="../../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
      <div class="c01-3-stars" aria-hidden="true">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>

      <div class="c01-3-orn"><span class="bar"></span></div>
      <h2 class="c01-3-head">We believe every community deserves <em>investment.</em></h2>
      <div class="c01-3-rule"></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
