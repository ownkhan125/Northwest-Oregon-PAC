<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080" />
<title>Strong Campaigns · 1/5 — Northwest Oregon PAC</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Source+Sans+3:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../../assets/social.css" />
<link rel="stylesheet" href="../../assets/templates.css" />
<link rel="stylesheet" href="../../assets/carousels.css" />

<style>
  .c05-1 { position:absolute; inset:0; z-index:5; overflow:hidden;
    background:
      radial-gradient(80% 55% at 15% 12%, rgba(90,112,96,.28) 0%, transparent 60%),
      radial-gradient(70% 55% at 95% 100%, rgba(107,90,66,.16) 0%, transparent 60%),
      linear-gradient(178deg, #16211a 0%, #0a100c 100%);
  }
  .c05-1-scan { position:absolute; inset:0; z-index:2; pointer-events:none; opacity:.08;
    background: repeating-linear-gradient(180deg, transparent 0 3px, rgba(255,255,255,.4) 3px 4px);
    mix-blend-mode:overlay;
  }
  .c05-1-frame { position:absolute; z-index:6; inset:80px; border:2px solid rgba(224,214,188,.28); }
  .c05-1-frame-inner { position:absolute; z-index:6; inset:110px; border:1px solid rgba(224,214,188,.14); }
  .c05-1-glyph { position:absolute; z-index:3; font-family:var(--font-display); font-style:italic; font-weight:400;
    font-size:900px; line-height:.66; color:rgba(90,112,96,.14); left:-80px; top:60px; pointer-events:none; user-select:none;
  }
  .c05-1-eyebrow { position:absolute; z-index:10; left:96px; right:96px; top:280px; text-align:center;
    font-family:var(--font-mono); font-size:14px; letter-spacing:.55em; text-transform:uppercase; color:rgba(224,214,188,.65);
  }
  .c05-1-title { position:absolute; z-index:10; left:120px; right:120px; top:380px; text-align:center;
    font-family:var(--font-display); font-style:italic; font-weight:500; font-size:150px; line-height:.94; letter-spacing:-.032em;
    color:#f6f2e8; text-shadow:0 8px 40px rgba(0,0,0,.55);
  }
  .c05-1-title .strong { font-style:normal; font-weight:600; color:#e0d6bc; }
  .c05-1-rule { position:absolute; z-index:10; left:50%; top:800px; transform:translateX(-50%); width:220px; height:3px; background:rgba(224,214,188,.55); }
  .c05-1-mast { position:absolute; z-index:14; bottom:130px; right:130px; }
  .c05-1-mast img { height:52px; width:auto; filter:drop-shadow(0 2px 22px rgba(0,0,0,.6)); }
  .c05-1-stars { position:absolute; z-index:14; bottom:150px; left:130px; display:flex; gap:14px; opacity:.7; }
  .c05-1-cap { position:absolute; z-index:14; bottom:160px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:13px; letter-spacing:.5em; text-transform:uppercase; color:rgba(224,214,188,.5);
  }
</style>
</head>
<body>
  <div class="canvas s-ink">
    <div class="c05-1">
      <div class="c05-1-scan"></div>
      <div class="c05-1-glyph">&ldquo;</div>
      <div class="c05-1-frame"></div>
      <div class="c05-1-frame-inner"></div>

      <h1 class="c05-1-title"><span class="strong">Strong campaigns</span> require strong <span class="strong">support.</span></h1>
      <div class="c05-1-rule"></div>

      <div class="c05-1-stars" aria-hidden="true">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
        <svg width="10" height="10" viewBox="0 0 24 24" fill="#e0d6bc"><path d="M12 2l2.9 6.7L22 10l-5.5 4.6L18.2 22 12 18.3 5.8 22l1.7-7.4L2 10l7.1-1.3L12 2z"/></svg>
      </div>
      <div class="c05-1-mast"><img src="../../assets/nwop-logo-light.png" alt="Northwest Oregon PAC" /></div>
    </div>

    <div class="grain"></div>
  </div>
</body>
</html>
